<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overworld D: Rings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ui:"Poppins",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;--serif:"Lora",Georgia,"Times New Roman",serif;--mono:ui-monospace,Menlo,monospace;
  /* Anthropic brand neutrals; soft blue replaces the orange accent */
  --bg:#FAF9F5;--head:rgba(250,249,245,.96);--panel:#F5F3EC;--line:#E8E6DC;--fg:#141413;--mut:#6F6E68;--chip:#F0EEE6;--input:#FFFFFF;
  --hot:#3F6F9F;--onhot:#FFFFFF;--good:#788C5D;--acc:#6A9BCC;--onacc:#141413;--shadow:rgba(20,20,19,.08);
  /* goal hues, validated on #FAF9F5 (adjacent + wrap pair; tightest pair carries name labels) */
  --g1:#4F8AC9;--g2:#C2475A;--g3:#00968A;--g4:#B8862A;--g5:#9A4F8C;--g6:#5F8A3A;
  --ring:#E8E6DC;--ring-stale:#B0AEA5;--rlbl:#B0AEA5;--rlbl-stale:#8A8880;--stalezone:rgba(176,174,165,.10);--halo:#FAF9F5}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
svg#map{position:fixed;top:44px;left:0;width:100%;height:calc(100% - 44px);font-family:var(--ui)}
.ring{fill:none;stroke:var(--ring);stroke-width:1} .ring.stale{stroke:var(--ring-stale);stroke-dasharray:3 4}
.zone{fill:var(--stalezone)} .laneband{fill:var(--stalezone)}
.rlbl{fill:var(--mut);paint-order:stroke;stroke:var(--bg);stroke-width:3px;font-size:10.5px;font-weight:500;font-variant-numeric:tabular-nums} .rlbl.stale{fill:var(--rlbl-stale)}
.spoke{stroke:var(--line);stroke-width:2}
.wedge{opacity:.13} .rim{fill:none;stroke-width:7}
.sector{fill:var(--fg);font-size:13px;font-weight:600} .sector .n{fill:var(--mut);font-weight:400}
.blip{cursor:pointer} .blip:hover .b{stroke:var(--fg);stroke-width:2}
.b{stroke:var(--halo);stroke-width:2}
.sel .b{stroke:var(--fg);stroke-width:3}
.person{fill:none;stroke:var(--fg);stroke-width:2}
.stalering{fill:none;stroke:var(--mut);stroke-width:1;stroke-dasharray:2 2;opacity:.8}
.tag{fill:var(--fg);font-size:11.5px;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.tag.age{fill:var(--mut);font-size:10.5px;font-variant-numeric:tabular-nums}
.fade{opacity:.2}
.stitle{fill:var(--fg);font-size:14px;font-weight:650;text-anchor:middle} .scount{fill:var(--mut);font-size:11.5px;text-anchor:middle}
.mode{position:fixed;top:56px;left:14px;z-index:3;display:flex;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:2px;font:12.5px var(--ui)}
.mode button{background:none;border:0;color:var(--mut);padding:5px 10px;border-radius:6px;cursor:pointer;font:inherit}
.mode.dist{left:auto;right:14px} .mlbl{color:var(--mut);padding:5px 6px}
.mode button.on{background:var(--panel);color:var(--fg)}
.ow-ask-text,.ow-p-meta,.ow-full pre{font-family:var(--serif)!important} .ow-ask-text{font-size:16px!important;line-height:1.5}
.ow-p-title{font-weight:600}
.legend{position:fixed;left:14px;bottom:12px;color:var(--mut);font:12px/1.7 var(--ui);background:var(--head);padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.legend i{display:inline-block;width:9px;height:9px;margin:0 5px -1px 10px;background:var(--mut)}
</style></head><body>
<svg id="map"><g id="scope"></g></svg>
<div class="mode" role="tablist"><button data-m="one">One scope</button><button data-m="split">Per goal</button></div>
<div class="mode dist" role="tablist"><span class="mlbl">Distance means</span><button data-d="wait">Waited</button><button data-d="oldest">Oldest first</button><button data-d="score">Priority</button><button data-d="lanes">Lanes</button><span class="mlbl">·</span><button data-burst="1" title="Add 12 made-up asks from the last hour to see a burst">Simulate burst</button></div>
<div class="legend"><span id="distnote"></span><br>
  colour = goal · <i style="border-radius:50%"></i>action <i style="transform:rotate(45deg)"></i>decision · big = work block ·
  <i style="background:none;border:2px solid var(--fg);border-radius:50%"></i>someone else involved · <i style="background:none;border:1px solid var(--mut);border-radius:50%"></i>nothing needed · v layout · n next ask</div>
<script src="/proto/common.js"></script>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("map"), scope = document.getElementById("scope");
const S = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const RINGS = [[1 / 24, "1h"], [1, "1d"], [3, "3d"], [7, "7d"], [30, "30d"]], MAXD = 60;
const frac = d => 0.1 + 0.9 * Math.log1p(Math.max(0, d) * 24) / Math.log1p(MAXD * 24);
let mode = localStorage.getItem("ow.rings.mode") || "one";
// colour follows the goal, never its rank: hue slot is fixed by the goal's position in the galaxy's own order
const hueOf = (g, i) => `var(--g${(i % 6) + 1})`;

function ageDays(t) { return (Date.now() - (t.openAsks.length ? t.oldest : (t.lastActive || Date.now()))) / OW.DAY; }

// What distance from the centre means. Each mode places an ask by one rule and draws its own guide rings.
const DIST = {
  wait:   { label: "Waited", note: "Centre = just replied · rings = how long it has waited · past the dashed ring = over 7 days" },
  oldest: { label: "Oldest first", note: "Centre = waited longest (up to 14 days) · outer edge = just replied · grey band = stale, over 14 days" },
  score:  { label: "Priority", note: "Centre = do first. Score = someone else involved 35% + decision 20% + agent still running 15% + wait up to 14d 30%; over 30d fades" },
  lanes:  { label: "Lanes", note: "Rings are kinds of ask, inside out: someone else involved · decision · quick reply · work block · stale over 14d · nothing needed" },
};
let dist = localStorage.getItem("ow.rings.dist") || "wait";
const STALE_D = 14;
const involved = t => (t.askedBy && t.askedBy.length) || (t.people && t.people.length) ? 1 : 0;
const isDecision = t => t.openAsks.some(a => a.kind === "decision");
const isBlock = t => t.openAsks.some(a => a.effort === "block");
const isLive = t => t.openAsks.some(a => !a.exited);
function score(t) {
  const d = ageDays(t);
  const age = Math.min(d, STALE_D) / STALE_D * (d > 30 ? 0.4 : 1);
  return 0.35 * involved(t) + 0.2 * (isDecision(t) ? 1 : 0) + 0.15 * (isLive(t) ? 1 : 0) + 0.3 * age;
}
const LANES = ["Someone else involved", "Decision", "Quick reply", "Work block", "Stale, over 14d", "Nothing needed"];
function laneOf(t) {
  if (!t.openAsks.length) return 5;
  if (ageDays(t) > STALE_D) return 4;
  if (involved(t)) return 0;
  if (isDecision(t)) return 1;
  return isBlock(t) ? 3 : 2;
}
const laneR = (i, R) => R * (0.2 + 0.8 * (i + 0.5) / LANES.length);
const f14 = d => Math.log1p(Math.min(d, STALE_D) * 24) / Math.log1p(STALE_D * 24);
// radius fraction for a task under the current mode
function rOf(t) {
  const d = ageDays(t), ask = t.openAsks.length > 0;
  if (dist === "wait") return frac(Math.min(d, MAXD));
  if (dist === "oldest") return !ask ? 0.97 : d > STALE_D ? 0.93 : 0.3 + 0.54 * (1 - f14(d));
  if (dist === "score") return !ask ? 0.97 : 0.28 + 0.62 * (1 - score(t));
  return laneR(laneOf(t), 1);
}

function rings(G, R) {
  if (dist === "wait") {
    const r7 = frac(7) * R;
    S("path", { d: `M ${-R} 0 A ${R} ${R} 0 1 0 ${R} 0 A ${R} ${R} 0 1 0 ${-R} 0 M ${-r7} 0 A ${r7} ${r7} 0 1 1 ${r7} 0 A ${r7} ${r7} 0 1 1 ${-r7} 0`, class: "zone", "fill-rule": "evenodd" }, G);
    RINGS.forEach(([d, l]) => { const r = frac(d) * R; S("circle", { r, class: "ring" + (d >= 7 ? " stale" : "") }, G); if (R > 120 || d === 1 || d === 7) S("text", { x: 3, y: -r - 3, class: "rlbl" + (d >= 7 ? " stale" : "") }, G).textContent = l; });
  } else if (dist === "oldest") {
    const rb = 0.88 * R;
    S("path", { d: `M ${-R} 0 A ${R} ${R} 0 1 0 ${R} 0 A ${R} ${R} 0 1 0 ${-R} 0 M ${-rb} 0 A ${rb} ${rb} 0 1 1 ${rb} 0 A ${rb} ${rb} 0 1 1 ${-rb} 0`, class: "zone", "fill-rule": "evenodd" }, G);
    [[STALE_D, "14d"], [7, "7d"], [3, "3d"], [1, "1d"], [1 / 24, "1h"]].forEach(([d, l]) => { const r = (0.3 + 0.54 * (1 - f14(d))) * R; S("circle", { r, class: "ring" }, G); if (R > 120 || d === 1 || d === 7) S("text", { x: 3, y: -r - 3, class: "rlbl" }, G).textContent = l; });
    S("circle", { r: rb, class: "ring stale" }, G);
    if (R > 120) S("text", { x: 3, y: -rb - 3, class: "rlbl stale" }, G).textContent = "stale";
  } else if (dist === "score") {
    [[0.75, "Now"], [0.5, "Soon"], [0.25, "Later"], [0, "Low"]].forEach(([sc, l]) => { const r = (0.28 + 0.62 * (1 - sc)) * R; S("circle", { r, class: "ring" }, G); if (R > 120 || sc === 0.5) S("text", { x: 3, y: -r - 3, class: "rlbl" }, G).textContent = l; });
  } else {
    LANES.forEach((l, i) => { if (i % 2) { const ro = laneR(i, R) + R * 0.4 / LANES.length, ri = laneR(i, R) - R * 0.4 / LANES.length;
        S("path", { d: `M ${-ro} 0 A ${ro} ${ro} 0 1 0 ${ro} 0 A ${ro} ${ro} 0 1 0 ${-ro} 0 M ${-ri} 0 A ${ri} ${ri} 0 1 1 ${ri} 0 A ${ri} ${ri} 0 1 1 ${-ri} 0`, class: "laneband", "fill-rule": "evenodd" }, G); } });
    LANES.forEach((l, i) => { const r = laneR(i, R); S("circle", { r, class: "ring" + (i >= 4 ? " stale" : "") }, G); if (R > 150 || i < 2) S("text", { x: 3, y: -r - 3, class: "rlbl" + (i >= 4 ? " stale" : "") }, G).textContent = l; });
  }
  S("circle", { r: R, class: "ring" }, G);
  G.querySelectorAll(".rlbl").forEach(t => ringLabels.push([G, t]));
}
let ringLabels = [];
function raiseRingLabels() { for (const [G, t] of ringLabels) G.appendChild(t); ringLabels = []; }

function placeTasks(G, g, color, a0, span, R, selected) {
  // spread each ring band separately so a burst in one band uses that band's whole arc
  const key = t => dist === "lanes" ? laneOf(t) : (t.openAsks.length ? "ask" : "rest");
  const groups = new Map();
  [...g.tasks].sort((x, y) => (x.oldest || 9e15) - (y.oldest || 9e15) || (y.lastActive || 0) - (x.lastActive || 0)).forEach(t => { const k = key(t); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); });
  let off = 0;
  for (const [, list] of groups) {
    list.forEach((t, i) => {
      const ang = a0 + span * (0.08 + 0.84 * (list.length === 1 ? 0.5 : (i + off) / (list.length - 1 + off * 2)));
      const r = rOf(t) * R;
      blip(G, t, Math.cos(ang) * r, Math.sin(ang) * r, color, selected, ang);
    });
    off = off ? 0 : 0.5;
  }
}

function render(data, { selected }) {
  document.querySelectorAll(".mode button[data-m]").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
  document.querySelectorAll(".mode button[data-d]").forEach(b => b.classList.toggle("on", b.dataset.d === dist));
  document.querySelector(".mode button[data-burst]").classList.toggle("on", burst);
  document.getElementById("distnote").textContent = DIST[dist].note + (burst ? " · BURST: 12 made-up asks added" : "");
  if (burst) data = withBurst(data);
  const w = svg.clientWidth - (selected ? 440 : 0), h = svg.clientHeight - 56;
  scope.replaceChildren();
  const goals = data.goals.map((g, i) => ({ g, color: hueOf(g, data.goalsOrder ? data.goalsOrder.indexOf(g.id) : i) }));
  const selGoal = selected && data.goals.find(g => g.tasks.some(t => t.id === selected));
  if (mode === "one") renderOne(goals, w, h, selected, selGoal); else renderSplit(goals, w, h, selected, selGoal);
  raiseRingLabels();
  declutter();
}

function renderOne(goals, w, h, selected, selGoal) {
  const R = Math.min(w - 520, h - 30) / 2 - 30, cx = w / 2, cy = h / 2 + 8;
  scope.setAttribute("transform", `translate(${cx},${cy})`);
  const total = goals.reduce((s, x) => s + 1 + x.g.tasks.length * 0.4 + x.g.tasks.reduce((n, t) => n + t.openAsks.length, 0) * 1.2, 0);
  let a0 = -Math.PI / 2;
  const sectors = goals.map(x => { const wt = 1 + x.g.tasks.length * 0.4 + x.g.tasks.reduce((n, t) => n + t.openAsks.length, 0) * 1.2; const s = { ...x, a0, span: wt / total * Math.PI * 2 }; a0 += s.span; return s; });
  // wedges first, then rings over them, so each goal reads as a coloured slice
  for (const s of sectors) {
    const a1 = s.a0 + s.span, big = s.span > Math.PI ? 1 : 0;
    S("path", { d: `M0 0 L${Math.cos(s.a0) * R} ${Math.sin(s.a0) * R} A${R} ${R} 0 ${big} 1 ${Math.cos(a1) * R} ${Math.sin(a1) * R} Z`, fill: s.color, class: "wedge" + (selGoal && selGoal !== s.g ? " fade" : "") }, scope);
    const rr = R + 4;
    S("path", { d: `M${Math.cos(s.a0 + 0.01) * rr} ${Math.sin(s.a0 + 0.01) * rr} A${rr} ${rr} 0 ${big} 1 ${Math.cos(a1 - 0.01) * rr} ${Math.sin(a1 - 0.01) * rr}`, stroke: s.color, class: "rim" }, scope);
  }
  rings(scope, R);
  for (const s of sectors) {
    S("line", { x1: 0, y1: 0, x2: Math.cos(s.a0) * R, y2: Math.sin(s.a0) * R, class: "spoke" }, scope);
    const mid = s.a0 + s.span / 2, lx = Math.cos(mid) * (R + 26), ly = Math.sin(mid) * (R + 26);
    const asks = s.g.tasks.reduce((n, t) => n + t.openAsks.length, 0);
    const anchor = Math.abs(Math.cos(mid)) < 0.25 ? "middle" : Math.cos(mid) > 0 ? "start" : "end";
    const L = S("g", { class: selGoal && selGoal !== s.g ? "fade" : "" }, scope);
    const tx = S("text", { x: lx, y: ly + 4, class: "sector", "text-anchor": anchor }, L);
    tx.textContent = s.g.title + " ";
    S("tspan", { class: "n" }, tx).textContent = `${asks} need you`;
    const bb = tx.getBBox();
    S("rect", { x: bb.x - 15, y: bb.y + bb.height / 2 - 5, width: 10, height: 10, rx: 2, fill: s.color }, L);
    const G = S("g", { class: selGoal && selGoal !== s.g ? "fade" : "" }, scope);
    placeTasks(G, s.g, s.color, s.a0, s.span, R, selected);
  }
}

function renderSplit(goals, w, h, selected, selGoal) {
  scope.setAttribute("transform", "translate(0,0)");
  const n = goals.length, cols = Math.max(1, Math.round(Math.sqrt(n * w / h))), rows = Math.ceil(n / cols);
  const cw = w / cols, ch = (h - 40) / rows, R = Math.min(cw - 200, ch - 76) / 2;
  // busiest goals first, so the top-left scope is where the asks are
  const order = [...goals].sort((a, b) => b.g.tasks.reduce((n, t) => n + t.openAsks.length, 0) - a.g.tasks.reduce((n, t) => n + t.openAsks.length, 0));
  order.forEach((s, i) => {
    const cx = (i % cols) * cw + cw / 2, cy = Math.floor(i / cols) * ch + ch / 2 + 44;
    const G = S("g", { transform: `translate(${cx},${cy})`, class: selGoal && selGoal !== s.g ? "fade" : "" }, scope);
    S("circle", { r: R, fill: s.color, class: "wedge" }, G);
    S("circle", { r: R + 4, stroke: s.color, class: "rim" }, G);
    rings(G, R);
    const asks = s.g.tasks.reduce((n, t) => n + t.openAsks.length, 0);
    const t = S("text", { y: -R - 26, class: "stitle" }, G); t.textContent = s.g.title;
    S("text", { y: -R - 11, class: "scount" }, G).textContent = `${asks} need you · ${s.g.tasks.length} open`;
    placeTasks(G, s.g, s.color, -Math.PI / 2, Math.PI * 2, R, selected);
  });
}

function blip(G, t, x, y, color, selected, ang) {
  const B = S("g", { transform: `translate(${x},${y})`, class: "blip" + (selected === t.id ? " sel" : "") }, G);
  if (t.openAsks.length) {
    const big = t.openAsks.some(a => a.effort === "block"), s = big ? 9 : 6.5, dec = t.openAsks.some(a => a.kind === "decision");
    if (Date.now() - t.oldest > 7 * OW.DAY) S("circle", { r: s + 5, class: "stalering" }, B);
    if (involved(t)) S("circle", { r: s + 3, class: "person" }, B);
    if (dec) S("rect", { x: -s, y: -s, width: s * 2, height: s * 2, transform: "rotate(45)", fill: color, class: "b" }, B);
    else S("circle", { r: s, fill: color, class: "b" }, B);
    const right = Math.cos(ang) >= 0, dx = right ? s + 8 : -s - 8, anc = right ? "start" : "end";
    S("text", { x: dx, y: 0, class: "tag", "text-anchor": anc }, B).textContent = t.title.length > 26 ? t.title.slice(0, 25) + "…" : t.title;
    const who = (t.askedBy && t.askedBy[0]) || (t.people && t.people[0]);
    S("text", { x: dx, y: 12, class: "tag age", "text-anchor": anc }, B).textContent = OW.ago(t.oldest) + (who ? ` · ${who.split(" ")[0]}` : "") + (big ? " · work block" : "") + (t.openAsks.length > 1 ? ` · ${t.openAsks.length} asks` : "") + (dist === "score" ? ` · ${Math.round(score(t) * 100)}` : "");
  } else if (t.status === "working") {
    S("circle", { r: 4.5, fill: color, class: "b" }, B);
  } else {
    S("circle", { r: 3.2, fill: "none", stroke: color, "stroke-width": 1.4, opacity: 0.75 }, B);
  }
  S("circle", { r: 12, fill: "transparent" }, B);
  B.onclick = e => { e.stopPropagation(); OW.open(t.id); };
  B.onmousemove = e => OW.showTip(e, t.title, t.openAsks.length ? t.openAsks[0].text : t.status === "working" ? "Working" : `Last active ${t.lastActive ? OW.ago(t.lastActive) + " ago" : "?"}`);
  B.onmouseleave = OW.hideTip;
}

// labels that would land on another label (or a goal name) move a line, then hide the name; the age stays
function declutter() {
  const kept = [...scope.querySelectorAll(".sector,.stitle,.scount,.rlbl")].map(e => e.getBoundingClientRect());
  const hits = r => kept.some(k => r.left < k.right && r.right > k.left && r.top < k.bottom && r.bottom > k.top);
  const view = svg.getBoundingClientRect(), right = view.right - (OW.selected ? 440 : 0);
  [...scope.querySelectorAll(".blip")].filter(b => b.querySelector(".tag")).forEach(b => {
    const name = b.querySelector(".tag:not(.age)"), age = b.querySelector(".tag.age");
    // a label that would leave the screen flips to the other side of its blip
    const rr = name.getBoundingClientRect();
    if (rr.left < view.left + 4 || rr.right > right - 4)
      for (const t of [name, age]) { t.setAttribute("x", -t.getAttribute("x")); t.setAttribute("text-anchor", t.getAttribute("text-anchor") === "end" ? "start" : "end"); }
    for (let tries = 0; tries < 3; tries++) {
      const r = name.getBoundingClientRect(), r2 = age.getBoundingClientRect();
      const box = { left: Math.min(r.left, r2.left), right: Math.max(r.right, r2.right), top: r.top - 1, bottom: r2.bottom + 1 };
      if (!hits(box)) { kept.push(box); return; }
      const dy = (tries === 0 ? 1 : -1) * 13 * (tries + 1);
      name.setAttribute("y", +name.getAttribute("y") + dy); age.setAttribute("y", +age.getAttribute("y") + dy);
    }
    name.setAttribute("display", "none");
    const ra = age.getBoundingClientRect(), ab = { left: ra.left, right: ra.right, top: ra.top - 1, bottom: ra.bottom + 1 };
    if (hits(ab)) age.setAttribute("display", "none"); else kept.push(ab);
  });
}

// Burst preview: 12 made-up asks from the last hour, spread over the goals. Display only; their verbs are disabled.
let burst = false;
function withBurst(data) {
  const goals = data.goals.map(g => ({ ...g, tasks: [...g.tasks] }));
  const kinds = ["decision", "action"];
  for (let i = 0; i < 12; i++) {
    const g = goals[i % goals.length], at = Date.now() - (5 + i * 4) * 60e3;
    const task = { id: "burst" + i, title: `New ask ${i + 1}`, goalTitle: g.title, status: "needs", lastActive: at, live: [], sessions: 1,
      askedBy: i % 4 === 0 ? ["Someone"] : [], people: [], asks: [], openAsks: [], oldest: at };
    task.openAsks = [{ id: "burst" + i, task, title: task.title, at, text: "Made-up ask for the burst preview.", kind: kinds[i % 2], options: [], effort: i % 3 ? "quick" : "block", exited: true, session: { workspace: "", id: "" } }];
    task.asks = task.openAsks;
    g.tasks.push(task);
  }
  return { ...data, goals };
}
document.querySelectorAll(".mode button[data-d]").forEach(b => b.onclick = () => { dist = b.dataset.d; localStorage.setItem("ow.rings.dist", dist); OW.data && render(OW.data, { selected: OW.selected }); });
document.querySelector(".mode button[data-burst]").onclick = () => { burst = !burst; OW.data && render(OW.data, { selected: OW.selected }); };
function setMode(m) { mode = m; localStorage.setItem("ow.rings.mode", m); OW.data && render(OW.data, { selected: OW.selected }); }
document.querySelectorAll(".mode button[data-m]").forEach(b => b.onclick = () => setMode(b.dataset.m));
