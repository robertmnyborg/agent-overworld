<body>
<header>
  <button type="button" class="brand-btn" id="homeBtn" title="Return to Triage and reset filters">
    <h1>Overworld</h1>
  </button>
  <div class="tally" id="tally" aria-live="polite"></div>
  <nav class="nav-seg" role="tablist" aria-label="Views">
    <button type="button" role="tab" id="navTriage" data-view="triage" aria-selected="true" title="Prioritized asks and session board (key: 1)">Triage</button>
    <button type="button" role="tab" id="navLinks" data-view="links" aria-selected="false" title="Tabs to work items to goals wiring map (key: 2)">Links</button>
    <button type="button" role="tab" id="navGalaxy" data-view="galaxy" aria-selected="false" title="Spatial map of goals, work items, and links (key: 3 or g)">Galaxy</button>
  </nav>
  <div class="hdr-right">
    <button type="button" class="btn sm" id="searchBtn" aria-label="Search sessions and work items" title="Search all sessions and work items (key: /)">
      <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <span class="search-lbl">Search</span>
      <span class="kbd">/</span>
    </button>
    <div class="usage" id="usage" title="Weekly usage limit, same as the Claude desktop app">
      <span>Usage syncing...</span>
    </div>
    <button type="button" class="btn sm" id="inboxBtn" title="Quick filterable list of all live sessions and subagents (key: i)">Inbox</button>
    <button type="button" class="btn sm icon" id="helpBtn" aria-label="Keyboard shortcuts and help" title="Keyboard shortcuts (key: ?)">?</button>
  </div>
</header>
<div class="poll-banner" id="pollBanner" role="alert" hidden></div>

<main id="map"></main>

<aside id="gplanet" role="region" aria-label="Work item details" hidden></aside>
<div class="modal-scrim" id="sheetScrim" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
<div class="modal-scrim" id="inboxScrim" role="dialog" aria-modal="true" aria-labelledby="inboxTitle" hidden></div>
<div class="modal-scrim" id="searchScrim" role="dialog" aria-modal="true" aria-labelledby="searchTitle" hidden></div>
<div class="modal-scrim" id="helpScrim" role="dialog" aria-modal="true" aria-labelledby="helpTitle" hidden></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ---------------- Core Helpers & Icons ---------------- */
const SVGNS = "http://www.w3.org/2000/svg";
const STALLED_MS = 20 * 60 * 1000;
const STALE_ASK_MS = 24 * 60 * 60 * 1000;
const ORDER = { waiting: 0, working: 1, stalled: 2, done: 3, idle: 4, ended: 5, shell: 6 };
const STATUS_LABEL = {
  waiting: "Needs you",
  working: "Working",
  stalled: "Stalled",
  done: "Finished",
  idle: "Idle",
  ended: "Ended",
  shell: "Shell"
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (tag === "button") e.type = "button";
  return e;
}
function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function icon(name) {
  const paths = {
    reply: '<path d="M6.5 4.5L3 8l3.5 3.5"/><path d="M3 8h6.5a3.5 3.5 0 0 1 0 7H8"/>',
    open: '<path d="M9.5 2.5h4v4"/><path d="M13.5 2.5L7.5 8.5"/><path d="M12.5 9v4a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h4"/>',
    clock: '<circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2.2 1.3"/>',
    edit: '<path d="M11 2.5l2.5 2.5-7.5 7.5H3.5V10z"/>',
    check: '<path d="M3 8.5l3.2 3.2L13 4.5"/>',
    close: '<path d="M4 4l8 8M12 4l-8 8"/>',
    sparkle: '<path d="M8 2l1.4 3.6L13 7l-3.6 1.4L8 12l-1.4-3.6L3 7l3.6-1.4z"/>',
    plus: '<path d="M8 3v10M3 8h10"/>',
    dock: '<rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M9 3v10"/>'
  };
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("class", "ico");
  s.setAttribute("viewBox", "0 0 16 16");
  s.setAttribute("fill", "none");
  s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "1.6");
  s.setAttribute("stroke-linecap", "round");
  s.setAttribute("stroke-linejoin", "round");
  s.setAttribute("aria-hidden", "true");
  s.innerHTML = paths[name] || "";
  return s;
}

function remember(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function recalled(k, fallback) { try { const v = localStorage.getItem(k); return v == null ? fallback : v; } catch (e) { return fallback; } }
function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 90) return "now";
  if (s < 5400) return Math.round(s / 60) + "m";
  if (s < 129600) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
}
function dur(s) {
  s = Math.max(0, Number(s) || 0);
  if (s < 60) return Math.round(s) + "s";
  if (s < 3600) return Math.floor(s / 60) + "m" + String(Math.round(s % 60)).padStart(2, "0");
  if (s < 172800) return (s / 3600).toFixed(1) + "h";
  return (s / 86400).toFixed(1) + "d";
}
function spanBetween(a, b) {
  const ta = Date.parse(a), tb = Date.parse(b);
  if (!Number.isFinite(ta) || !Number.isFinite(tb)) return "";
  return dur((tb - ta) / 1000);
}
function fmtSpan(d) {
  d = Math.max(0, Number(d) || 0);
  const h = Math.floor(d / 3600), m = Math.floor((d % 3600) / 60);
  return h >= 24 ? `${Math.floor(h / 24)}d ${h % 24}h` : `${h}h ${m}m`;
}
function when(t) { return new Date(t * 1000).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }); }
function gAgo(t) { return t ? ago(new Date(t * 1000).toISOString()) + (Date.now() / 1000 - t < 90 ? "" : " ago") : "never"; }

/* ---------------- Unified State & Truth Predicate ---------------- */
const map = document.getElementById("map");
const tally = document.getElementById("tally");
const sheetScrim = document.getElementById("sheetScrim");
const inboxScrim = document.getElementById("inboxScrim");
const searchScrim = document.getElementById("searchScrim");
const helpScrim = document.getElementById("helpScrim");
const toastBox = document.getElementById("toasts");

let last = null;
let view = recalled("ow.view", "triage");
if (!["triage", "links", "galaxy"].includes(view)) view = "triage";
let boardGroup = recalled("ow.boardGroup", "workspace");
if (!["workspace", "goal"].includes(boardGroup)) boardGroup = "workspace";
let triageFilter = recalled("ow.triageFilter", "all");
let showShells = recalled("ow.shells", "0") === "1";
let linksShowInactive = recalled("ow.linksInactive", "0") === "1";

let dragging = null, draggingRegion = null, draggingItem = null;
let armed = null, armedTimer = null;
let editing = false, naming = null;
let sel = null;
const ticked = new Set(), sent = new Set();

// Client-side dismiss store keyed by sessionId -> ask text so a new reply automatically resurfaces the ask.
let dismissed = {};
try { dismissed = JSON.parse(localStorage.getItem("ow.dismissed") || "{}"); } catch (e) { dismissed = {}; }
function saveDismissed() { remember("ow.dismissed", JSON.stringify(dismissed)); }
function askTextOf(t) { return ((t.action && t.action.action) || t.ask || t.recap || "").trim(); }
function isDismissed(t) { return !!(dismissed[t.id] && dismissed[t.id] === askTextOf(t)); }
function dismissSession(t) {
  const prev = dismissed[t.id];
  dismissed[t.id] = askTextOf(t);
  saveDismissed();
  render(last);
  showToast(`Dismissed "${t.title}" until it replies again`, "ok", "Undo", () => {
    if (prev == null) delete dismissed[t.id]; else dismissed[t.id] = prev;
    saveDismissed();
    render(last);
  });
}
function restoreSession(t) {
  delete dismissed[t.id];
  saveDismissed();
  render(last);
}

// Single source of truth for status across every view.
function waitedMs(t) {
  const ms = Date.parse(t.since);
  if (Number.isFinite(ms)) return ms;
  return t.updated ? t.updated * 1000 : Date.now();
}
function effectiveStatus(t) {
  if (!t) return "idle";
  const ended = !t.agent || t.status === "shell";
  if (t.needs && !isDismissed(t)) return ended ? "ended" : "waiting";
  if (ended) return "shell";
  if (t.status === "working") {
    const ms = Date.parse(t.since);
    if (Number.isFinite(ms) && Date.now() - ms > STALLED_MS) return "stalled";
    return "working";
  }
  return t.status || "idle";
}
function allSessions() { return last ? last.regions.flatMap(r => r.sessions) : []; }
function sessionById(id) { return allSessions().find(t => t.id === id) || null; }
function itemBySessionId(id) {
  if (!last || !last.work) return null;
  return last.work.items.find(i => i.tabs && i.tabs.includes(id)) || null;
}
function needsSessions(includeDismissed = false) {
  return allSessions()
    .filter(t => t.needs && (includeDismissed || !isDismissed(t)))
    .sort((a, b) => {
      const aEnded = (!a.agent || a.status === "shell") ? 1 : 0;
      const bEnded = (!b.agent || b.status === "shell") ? 1 : 0;
      if (aEnded !== bEnded) return aEnded - bEnded;
      const aStale = isStaleAsk(a) ? 1 : 0;
      const bStale = isStaleAsk(b) ? 1 : 0;
      if (aStale !== bStale) return aStale - bStale;
      return aStale ? (waitedMs(a) - waitedMs(b)) : (waitedMs(b) - waitedMs(a));
    });
}
function liveNeedsSessions() {
  return needsSessions(false).filter(t => t.agent && t.status !== "shell");
}
function isStaleAsk(t) { return Date.now() - waitedMs(t) > STALE_ASK_MS; }

/* ---------------- Toast Notifications ---------------- */
function showToast(msg, kind = "", actionLabel = null, actionFn = null) {
  const box = el("div", "toast" + (kind ? " " + kind : ""));
  box.append(el("span", "", msg));
  if (actionLabel && actionFn) {
    const b = el("button", "btn sm", actionLabel);
    b.onclick = () => { actionFn(); box.remove(); };
    box.append(b);
  }
  const close = el("button", "btn sm icon", "");
  close.setAttribute("aria-label", "Dismiss notice");
  close.append(icon("close"));
  close.onclick = () => box.remove();
  box.append(close);
  toastBox.append(box);
  setTimeout(() => { if (box.isConnected) box.remove(); }, 6500);
}

/* ---------------- Network & Armed Destructive Helpers ---------------- */
async function post(path, body, okMsg) {
  try {
    const res = await fetch(path, { method: "POST", body: JSON.stringify(body || {}) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
    if (okMsg) showToast(okMsg, "ok");
    setTimeout(tick, 450);
    return data;
  } catch (e) {
    showToast(`Action failed: ${e.message}`, "err");
    throw e;
  }
}
async function sendTo(t, text) {
  try {
    const res = await fetch("/api/send", { method: "POST", body: JSON.stringify({ workspace: t.workspace, surface: t.id, text }) });
    if (res.ok) return null;
    return (await res.json().catch(() => ({ error: `HTTP ${res.status}` }))).error || `HTTP ${res.status}`;
  } catch (e) { return e.message; }
}
function armAction(key, run) {
  if (armed === key) {
    armed = null; clearTimeout(armedTimer);
    run();
    render(last);
    return;
  }
  armed = key;
  clearTimeout(armedTimer);
  armedTimer = setTimeout(() => { if (armed === key) { armed = null; render(last); } }, 3500);
  render(last);
}

async function autoname(workspace) {
  if (naming) return;
  naming = workspace || "all";
  render(last);
  try {
    const res = await (await fetch("/api/autoname", { method: "POST", body: JSON.stringify(workspace ? { workspace } : {}) })).json();
    naming = null;
    if (res.error) showToast(`Auto-name failed: ${res.error}`, "err");
    else showToast(`Auto-named ${res.renamed} item${res.renamed === 1 ? "" : "s"}`, "ok");
  } catch (e) {
    naming = null;
    showToast(`Auto-name failed: ${e.message}`, "err");
  }
  tick();
}

/* ---------------- Inline Rename Helper ---------------- */
function startRename(labelEl, current, save) {
  editing = true;
  const input = el("input", "rename");
  input.value = current;
  input.setAttribute("aria-label", "Rename");
  const done = keep => {
    if (!editing) return;
    editing = false;
    const title = input.value.trim();
    if (keep && title && title !== current) save(title);
    render(last);
  };
  input.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); };
  input.onblur = () => done(true);
  ["click", "mousedown", "dragstart"].forEach(ev => input.addEventListener(ev, e => e.stopPropagation()));
  labelEl.replaceWith(input);
  input.focus();
  input.select();
}

/* ---------------- Navigation & Header ---------------- */
const navButtons = [...document.querySelectorAll(".nav-seg button[data-view]")];
function setView(v) {
  if (!["triage", "links", "galaxy"].includes(v)) return;
  if (view === "galaxy" && v !== "galaxy") gStop();
  view = v;
  remember("ow.view", v);
  navButtons.forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === v)));
  if (v !== "galaxy") {
    map.classList.remove("gmode");
    G.panel.hidden = true;
    G.wrap = null;
  } else if (G.planet) {
    G.panel.hidden = false;
  }
  render(last);
}
navButtons.forEach(b => { b.onclick = () => setView(b.dataset.view); });
document.getElementById("homeBtn").onclick = () => {
  triageFilter = "all"; remember("ow.triageFilter", "all");
  sel = null; ticked.clear(); sent.clear();
  if (view === "galaxy") { G.sys = null; gClosePlanet(true); }
  setView("triage");
  scrollTo({ top: 0, behavior: "smooth" });
};

function renderTally() {
  const sessions = allSessions();
  const liveNeeds = liveNeedsSessions().length;
  const endedNeeds = needsSessions(false).length - liveNeeds;
  const working = sessions.filter(t => effectiveStatus(t) === "working").length;
  const active = sessions.filter(t => t.agent && t.status !== "shell").length;
  let subRunning = 0;
  sessions.forEach(t => { subRunning += (t.subagents || []).filter(a => a.status === "running").length; });

  const makeStat = (dotCls, num, label, extraCls = "") => {
    const s = el("span", "stat" + (extraCls ? " " + extraCls : ""));
    if (dotCls) s.append(el("span", "dot " + dotCls));
    s.append(el("b", "", String(num)), document.createTextNode(label));
    return s;
  };
  const nodes = [
    makeStat("waiting", liveNeeds, "needs you" + (endedNeeds ? ` (+${endedNeeds} ended)` : ""), liveNeeds > 0 ? "urgent" : ""),
    makeStat("working", working, "working"),
    makeStat(null, active, "live", "stat-live")
  ];
  if (subRunning) nodes.push(makeStat(null, subRunning, `subagent${subRunning === 1 ? "" : "s"}`, "stat-live"));
  tally.replaceChildren(...nodes);
}

/* ---------------- Universal Session Sheet (Reply + 5-Tab Diagnostics) ---------------- */
const SHEET_TABS = {
  reply: "Reply",
  timeline: "Timeline",
  waterfall: "Waterfall",
  agents: "Agents",
  context: "Context",
  handoffs: "Handoffs"
};
const KIND = { model: "Model generating", tool: "Tool call", agents: "Waiting on subagents", you: "Waiting on you" };
const CM_KIND = {
  system: ["System prompt", "#64748b"], tools: ["Tool definitions", "#b48cff"], memory: ["CLAUDE.md + memory", "#2bb3a3"],
  skills: ["Skills", "#d16bd6"], files: ["Files", "#3ecf8e"], chat: ["Conversation", "#60a5fa"], calls: ["Tool calls", "#7aa2ff"],
  results: ["Tool results", "#f5a524"], summary: ["Compaction summary", "#94a3b8"], reminders: ["Reminders", "#6b7280"], hooks: ["Hooks", "#ff7b7b"]
};

let sheetSessionId = null;
let sheetTab = "reply";
let tlScope = recalled("tlScope", "session") === "turn" ? "turn" : "session";
let ctxAgent = "";
const folded = new Set(), opened = new Set(), unfolded = new Set();
const replyDrafts = new Map();

let modalPrevFocus = null;
function captureFocus() { if (!modalPrevFocus && document.activeElement && document.activeElement !== document.body) modalPrevFocus = document.activeElement; }
function restoreFocus() {
  if (sheetScrim.hidden && inboxScrim.hidden && searchScrim.hidden && helpScrim.hidden && modalPrevFocus) {
    const elPrev = modalPrevFocus; modalPrevFocus = null;
    if (elPrev.isConnected) try { elPrev.focus(); } catch (e) {}
  }
}
function trapModalTab(scrim, e) {
  if (e.key !== "Tab") return;
  const focusables = [...scrim.querySelectorAll('button:not(:disabled), [href], input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null);
  if (!focusables.length) return;
  const first = focusables[0], lastEl = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); lastEl.focus(); }
  else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); first.focus(); }
}
[sheetScrim, inboxScrim, searchScrim, helpScrim].forEach(sc => sc.addEventListener("keydown", e => trapModalTab(sc, e)));

function openSheet(id, tab = "reply") {
  const t = sessionById(id);
  if (!t) return;
  captureFocus();
  sheetSessionId = id;
  sheetTab = SHEET_TABS[tab] ? tab : "reply";
  editing = true;
  folded.clear(); opened.clear(); unfolded.clear();
  sheetScrim.hidden = false;
  renderSheet();
}
function closeSheet() {
  if (!sheetSessionId) return;
  sheetSessionId = null;
  sheetScrim.hidden = true;
  sheetScrim.replaceChildren();
  editing = false;
  sent.clear();
  render(last);
  restoreFocus();
}
sheetScrim.onmousedown = e => { if (e.target === sheetScrim) closeSheet(); };

function nextReplyId(currentId) {
  const queue = liveNeedsSessions().map(t => t.id).filter(id => !sent.has(id));
  if (!queue.length) return null;
  const idx = queue.indexOf(currentId);
  return idx >= 0 ? (queue[(idx + 1) % queue.length] !== currentId ? queue[(idx + 1) % queue.length] : null) : queue[0];
}

function renderSheet() {
  if (!sheetSessionId) return;
  const t = sessionById(sheetSessionId);
  if (!t) return closeSheet();
  const item = itemBySessionId(t.id);
  const st = effectiveStatus(t);
  const isClaude = t.agent === "claude";
  if (!isClaude && sheetTab !== "reply") sheetTab = "reply";

  const sheet = el("div", "sheet");
  const head = el("div", "sheet-head");
  const tw = el("div", "sheet-title-wrap");
  const h2 = el("h2", "", t.title); h2.id = "sheetTitle";
  const sub = el("div", "sheet-sub");
  sub.append(el("span", "dot " + st), el("span", "", STATUS_LABEL[st] || st));
  const age = ago(new Date(waitedMs(t)).toISOString());
  if (age) sub.append(el("span", "", "· " + age));
  if (t.ws_title) sub.append(el("span", "", "· " + t.ws_title));
  if (item && item.title !== t.title) sub.append(el("span", "", "· " + item.title));
  if (t.agent && t.agent !== "claude") sub.append(el("span", "agent-tag", t.agent));
  tw.append(h2, sub);

  const acts = el("div", "sheet-acts");
  const openBtn = el("button", "btn sm", "");
  openBtn.append(icon("open"), document.createTextNode("Open tab"));
  openBtn.title = `Switch directly to this tab in ${t.ws_title || "cmux"}`;
  openBtn.onclick = () => post("/api/focus", { workspace: t.workspace, surface: t.id });
  acts.append(openBtn);

  const isDocked = last && last.docked === t.id;
  const dockBtn = el("button", "btn sm", "");
  dockBtn.append(icon("dock"), document.createTextNode(isDocked ? "Send back" : "Dock beside"));
  dockBtn.title = isDocked ? "Return docked tab to its original workspace" : "Move this real cmux tab into a split pane right of Overworld";
  dockBtn.onclick = () => (isDocked ? gUndock() : gDock(t.id));
  acts.append(dockBtn);

  if (t.needs && !isDismissed(t)) {
    const dis = el("button", "btn sm", "");
    dis.append(icon("check"), document.createTextNode("Dismiss"));
    dis.title = "Hide from Needs you until this session replies again";
    dis.onclick = () => { dismissSession(t); const nxt = nextReplyId(t.id); if (nxt) openSheet(nxt, "reply"); else closeSheet(); };
    acts.append(dis);
  }
  const closeBtn = el("button", "btn sm icon", "");
  closeBtn.setAttribute("aria-label", "Close session sheet");
  closeBtn.title = "Close (Esc)";
  closeBtn.append(icon("close"));
  closeBtn.onclick = closeSheet;
  acts.append(closeBtn);
  head.append(tw, acts);

  const tabs = el("div", "sheet-tabs");
  tabs.setAttribute("role", "tablist");
  Object.entries(SHEET_TABS).forEach(([k, label]) => {
    if (k !== "reply" && !isClaude) return;
    const b = el("button", "", label);
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(sheetTab === k));
    b.onclick = () => { sheetTab = k; renderSheet(); };
    tabs.append(b);
  });

  const body = el("div", "sheet-body");
  sheet.append(head, tabs, body);

  if (sheetTab === "reply") {
    renderSheetReply(t, item, st, sheet, body);
  } else {
    body.append(el("div", "tl-prompt", "Loading telemetry..."));
    sheetScrim.replaceChildren(sheet);
    loadSheetDiag(t, body);
    return;
  }
  sheetScrim.replaceChildren(sheet);
  const ta = sheet.querySelector("textarea");
  if (ta) ta.focus();
}

function renderSheetReply(t, item, st, sheet, body) {
  const queue = liveNeedsSessions();
  const inQueue = queue.some(x => x.id === t.id);
  const left = queue.filter(x => !sent.has(x.id)).length;
  const ended = st === "ended" || st === "shell";

  const advance = () => {
    const nxt = nextReplyId(t.id);
    if (nxt) { sel = nxt; openSheet(nxt, "reply"); }
    else closeSheet();
  };

  if (t.full || t.action || t.ask) {
    const callout = el("div", "peek-ask");
    const fillAction = a => {
      const lbl = { decision: "Your decision", action: "Your action", none: "Nothing needed" }[a.kind] || "Next step";
      callout.classList.toggle("quiet", a.kind === "none");
      callout.replaceChildren(el("div", "peek-ask-label", lbl), el("div", "peek-ask-text", a.action || t.ask || ""));
      if (a.options && a.options.length && !ended) {
        const opts = el("div", "peek-ask-opts");
        a.options.forEach(o => {
          const ob = el("button", "opt-chip", o);
          ob.title = `Send "${o}" to ${t.title}`;
          ob.onclick = async () => {
            ob.disabled = true; ob.textContent = "Sending...";
            const err = await sendTo(t, o);
            if (err) { ob.disabled = false; ob.textContent = o; showToast("Not sent: " + err, "err"); return; }
            sent.add(t.id);
            showToast(`Sent to ${t.title}`, "ok");
            if (inQueue) advance(); else { closeSheet(); setTimeout(tick, 500); }
          };
          opts.append(ob);
        });
        callout.append(opts);
      }
    };
    if (t.action) fillAction(t.action);
    else if (t.full) {
      callout.replaceChildren(el("div", "peek-ask-label", "Working out the action..."), el("div", "peek-ask-text muted", t.ask || ""));
      fetch("/api/action?surface=" + encodeURIComponent(t.id)).then(r => r.json()).then(a => {
        if (!callout.isConnected) return;
        if (a.action) fillAction(a);
        else callout.replaceChildren(el("div", "peek-ask-label", "Latest ask"), el("div", "peek-ask-text", t.ask || a.error || "No action detected"));
      }).catch(e => {
        if (!callout.isConnected) return;
        callout.replaceChildren(el("div", "peek-ask-label", "Latest ask"), el("div", "peek-ask-text", t.ask || "Could not classify action (" + e.message + ")"));
      });
    }
    body.append(callout);
  }

  const msg = el("div", "peek-msg");
  msg.append(t.full ? markdown(t.full) : el("p", "muted", t.recap || "(No assistant reply captured yet.)"));
  body.append(msg);

  const comp = el("div", "composer");
  if (ended) {
    const row = el("div", "composer-bar");
    row.append(el("span", "composer-hint", "This session's agent process has ended. Reopen it before replying so input does not hit a plain shell."));
    const acts = el("div", "sheet-acts");
    if (item && item.resumable) {
      const res = el("button", "btn sm primary", "Resume session");
      res.onclick = async () => { res.disabled = true; res.textContent = "Reopening..."; await itemAct(item, "resume", "Opening session"); closeSheet(); };
      acts.append(res);
    }
    row.append(acts);
    comp.append(row);
  } else {
    const input = el("textarea");
    input.rows = 3;
    input.value = replyDrafts.get(t.id) || "";
    input.placeholder = `Reply to ${t.title}...`;
    input.setAttribute("aria-label", `Reply to ${t.title}`);
    const bar = el("div", "composer-bar");
    const hint = el("span", "composer-hint", (inQueue ? `Enter sends + opens next (${left} waiting)` : "Enter sends") + " · Shift+Enter new line · Esc closes");
    const btns = el("div", "sheet-acts");
    if (inQueue && left > 1) {
      const skip = el("button", "btn sm", "Skip");
      skip.onclick = () => { sent.add(t.id); advance(); };
      btns.append(skip);
    }
    const sendBtn = el("button", "btn sm primary", "Send");
    sendBtn.disabled = !input.value.trim();
    input.oninput = () => {
      if (input.value) replyDrafts.set(t.id, input.value); else replyDrafts.delete(t.id);
      sendBtn.disabled = !input.value.trim();
    };
    const doSend = async () => {
      const text = input.value.trim();
      if (!text) return;
      input.disabled = true; sendBtn.disabled = true; sendBtn.textContent = "Sending...";
      hint.classList.remove("fail");
      const err = await sendTo(t, text);
      if (err) {
        input.disabled = false; sendBtn.disabled = !input.value.trim(); sendBtn.textContent = "Send";
        hint.textContent = "Not sent: " + err; hint.classList.add("fail"); input.focus();
        return;
      }
      replyDrafts.delete(t.id);
      sent.add(t.id);
      showToast(`Sent reply to ${t.title}`, "ok");
      if (inQueue) advance(); else { closeSheet(); setTimeout(tick, 500); }
    };
    sendBtn.onclick = doSend;
    input.onkeydown = e => {
      if (e.key === "Escape") { e.stopPropagation(); closeSheet(); return; }
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.stopPropagation(); doSend(); }
    };
    btns.append(sendBtn);
    bar.append(hint, btns);
    comp.append(input, bar);
  }
  sheet.append(comp);
}

/* Diagnostics Tabs Loader (non-clobbering when user is selecting text) */
async function loadSheetDiag(t, body) {
  const tab = sheetTab;
  try {
    if (tab === "timeline") {
      const d = await (await fetch("/api/timeline?surface=" + encodeURIComponent(t.id))).json();
      if (sheetSessionId !== t.id || sheetTab !== tab) return;
      if (d.error) { body.replaceChildren(el("div", "tl-prompt", d.error)); return; }
      body.replaceChildren(...buildTimelineNodes(d));
    } else if (tab === "waterfall" || tab === "agents") {
      const scope = tab === "waterfall" ? "turn" : tlScope;
      const d = await (await fetch(`/api/trace?surface=${encodeURIComponent(t.id)}&scope=${scope}&running=${effectiveStatus(t) === "working" ? 1 : 0}`)).json();
      if (sheetSessionId !== t.id || sheetTab !== tab) return;
      if (d.error) { body.replaceChildren(el("div", "tl-prompt", d.error)); return; }
      const keep = body.scrollTop;
      body.replaceChildren(...(tab === "waterfall" ? buildWaterfallNodes(d, t, body) : buildAgentTreeNodes(d, t, body)));
      body.scrollTop = keep;
    } else if (tab === "context") {
      const d = await (await fetch(`/api/context?surface=${encodeURIComponent(t.id)}&agent=${encodeURIComponent(ctxAgent)}`)).json();
      if (sheetSessionId !== t.id || sheetTab !== tab) return;
      body.replaceChildren(...buildContextNodes(d, t, body));
    } else if (tab === "handoffs") {
      const d = await (await fetch("/api/handoffs?surface=" + encodeURIComponent(t.id))).json();
      if (sheetSessionId !== t.id || sheetTab !== tab) return;
      body.replaceChildren(...buildHandoffNodes(d, body));
    }
  } catch (e) {
    if (sheetSessionId === t.id && sheetTab === tab) body.replaceChildren(el("div", "err-banner", "Could not load telemetry: " + e.message));
  }
}

setInterval(() => {
  if (!sheetSessionId || sheetTab === "reply") return;
  const selText = window.getSelection && window.getSelection().toString();
  if (selText) return; // Never wipe active text selection
  const t = sessionById(sheetSessionId);
  const body = sheetScrim.querySelector(".sheet-body");
  if (t && body) loadSheetDiag(t, body);
}, 3000);

function buildTimelineNodes(d) {
  const end = Math.max(d.active_end, d.start + 5), width = end - d.start;
  const tail = d.lanes[0].segments.find(s => s.kind === "you" && s.open);
  const sum = el("div", "tl-sum");
  const kv = (k, v) => { const s = el("span"); s.append(el("span", "k", k + " "), el("b", null, v)); sum.append(s); };
  kv("Turn", dur((tail ? tail.start : d.now) - d.start));
  ["model", "tool", "agents"].forEach(k => { if (d.totals[k] >= 1) kv(KIND[k], dur(d.totals[k])); });
  const youDone = (d.totals.you || 0) - (tail ? d.now - tail.start : 0);
  if (youDone >= 1) kv("Waited on you mid-turn", dur(youDone));
  if (tail) kv("Waiting on you", dur(d.now - tail.start));

  const slow = el("ol", "tl-slow");
  d.slowest.forEach(s => {
    const li = el("li");
    li.append(el("span", "d", dur(s.end - s.start)), el("span", "l", (s.open ? "▶ " : "") + s.label), el("span", "w", s.lane));
    slow.append(li);
  });

  const grid = el("div", "tl-grid"), axis = el("div", "tl-axis");
  for (let i = 0; i <= 4; i++) {
    const tk = el("span", null, i ? "+" + dur(width * i / 4) : "prompt");
    tk.style.left = (i * 25) + "%";
    if (i === 4) tk.style.transform = "translateX(-100%)";
    axis.append(tk);
  }
  grid.append(el("div"), axis);
  d.lanes.forEach(l => {
    const name = el("div", "tl-name");
    name.append(el("b", null, l.name === "main" ? "Main session" : l.type), " " + (l.name === "main" ? "" : l.name) + (l.status ? " · " + l.status : ""));
    name.title = l.name;
    const track = el("div", "tl-track");
    l.segments.forEach(s => {
      const a = Math.max(s.start, d.start), b = Math.min(s.end, end);
      if (b <= a) return;
      const seg = el("div", "seg " + s.kind + (s.open && s.end <= end + 1 ? " open" : ""));
      seg.style.left = ((a - d.start) / width * 100) + "%";
      seg.style.width = ((b - a) / width * 100) + "%";
      seg.title = `${s.label} · ${dur(s.end - s.start)}${s.open ? " (running)" : ""}`;
      track.append(seg);
    });
    grid.append(name, track);
  });
  const legend = el("div", "tl-legend");
  Object.entries(KIND).forEach(([k, label]) => { const s = el("span"), i = el("i", "seg " + k); i.style.position = "static"; s.append(i, label); legend.append(s); });
  const parts = [el("div", "tl-prompt", "“" + d.prompt + "”"), sum];
  if (d.slowest.length) parts.push(el("h3", "", "Slowest steps"), slow);
  parts.push(grid, legend);
  if (tail && tail.start < d.now - width) parts.push(el("div", "muted", `Axis stops at last activity; waiting time (${dur(d.now - tail.start)}) is not drawn to scale.`));
  return parts;
}

function money(v) { return v == null ? "?" : v < 0.01 ? "<$0.01" : "$" + v.toFixed(v < 10 ? 2 : 0); }
function toks(n) { return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n); }
function shortModel(m) { return (m || "").replace(/^claude-/, ""); }
function keyOf(n) { return n.kind + "|" + n.start + "|" + (n.label || n.name); }
function traceSummary(d, r) {
  const sum = el("div", "tl-sum");
  const kv = (k, v) => { const s = el("span"); s.append(el("span", "k", k + " "), el("b", null, v)); sum.append(s); };
  let agents = 0, calls = 0, tools = 0, tin = 0, tout = 0, unpriced = new Set();
  (function walk(n) {
    if (n.kind === "agent") { agents++; calls += n.calls; tools += n.tools; tin += n.tokens_in; tout += n.tokens_out; (n.unpriced || []).forEach(m => unpriced.add(m)); }
    (n.children || []).forEach(c => c.kind === "agent" ? walk(c) : (c.children || []).forEach(walk));
  })(r);
  kv("Cost", money(r.cost)); kv("Duration", dur(r.end - r.start)); kv("Model calls", String(calls)); kv("Tool calls", String(tools));
  if (agents > 1) kv("Subagents", String(agents - 1));
  kv("Tokens", toks(tin) + " in / " + toks(tout) + " out");
  return [sum, el("div", "muted", "Cost is a list-price estimate from token counts" + (unpriced.size ? "; unpriced: " + [...unpriced].join(", ") : "."))];
}

const IDLE_GAP = 30;
function squeeze(steps, from) {
  const busy = steps.map(s => [Math.max(s.start, from), s.end]).filter(([a, b]) => b > a).sort((a, b) => a[0] - b[0]);
  const merged = [];
  busy.forEach(([a, b]) => { const m = merged[merged.length - 1]; if (m && a <= m[1]) m[1] = Math.max(m[1], b); else merged.push([a, b]); });
  const knots = [[from, 0]], gaps = [];
  let cur = from, x = 0, active = 0;
  merged.forEach(([a, b]) => {
    const idle = a - cur;
    if (idle > IDLE_GAP) { x += IDLE_GAP; gaps.push(x - IDLE_GAP / 2); } else x += Math.max(0, idle);
    knots.push([a, x]); x += b - a; active += b - a; knots.push([b, x]); cur = b;
  });
  const at = t => {
    if (t <= from) return 0;
    for (let i = 1; i < knots.length; i++) {
      const [t0, x0] = knots[i - 1], [t1, x1] = knots[i];
      if (t <= t1) return t1 === t0 ? x1 : x0 + (t - t0) / (t1 - t0) * (x1 - x0);
    }
    return x;
  };
  return { at, total: Math.max(x, 1), gaps, active };
}

function buildWaterfallNodes(d, t, body) {
  const r = d.root;
  let slowest = null;
  const steps = [];
  (function walk(n) { (n.children || []).forEach(c => { if (c.kind === "agent") return walk(c); steps.push(c); if (!slowest || c.end - c.start > slowest.end - slowest.start) slowest = c; (c.children || []).forEach(walk); }); })(r);
  const axis = squeeze(steps, d.start), width = axis.total;
  const grid = el("div", "wf");
  ["Step", "", "Time", "Tokens", "Cost"].forEach((h, i) => grid.append(el("div", "wf-h" + (i > 1 ? " r" : ""), h)));
  const bar = (n, cls) => {
    const b = el("div", "wf-bar"), i = el("i", cls + (n.open ? " open" : ""));
    const a = axis.at(n.start), z = axis.at(n.end);
    i.style.left = (a / width * 100) + "%"; i.style.width = (Math.max(0, z - a) / width * 100) + "%";
    axis.gaps.forEach(g => { const m = el("span", "wf-gap"); m.style.left = (g / width * 100) + "%"; b.append(m); });
    b.append(i); return b;
  };
  const addRow = (n, depth, label, cls, nums, onclick) => {
    const rw = el("div", "wf-row"), name = el("div", "wf-name " + n.kind);
    name.style.paddingLeft = (depth * 14) + "px";
    name.append(...label);
    if (n === slowest) name.append(el("span", "wf-slow", "slowest"));
    name.title = n.label || n.name;
    rw.append(name, bar(n, cls), el("div", "wf-num r", dur(n.end - n.start)), ...nums);
    if (onclick) {
      rw.onclick = onclick;
      name.tabIndex = 0; name.setAttribute("role", "button");
      name.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onclick(); } };
    }
    grid.append(rw);
  };
  (function walk(a, depth) {
    const k = keyOf(a), isOpen = depth === 0 ? !folded.has(k) : unfolded.has(k);
    const set = depth === 0 ? folded : unfolded, closing = depth === 0;
    addRow(a, depth, [el("span", "caret", isOpen ? "▾" : "▸"), a.type === "session" ? "Main session" : a.type + ": " + a.name], "agent",
      [el("div", "wf-num r", toks(a.tokens_in) + "/" + toks(a.tokens_out)), el("div", "wf-num r", money(a.cost))],
      () => { (isOpen === closing) ? set.add(k) : set.delete(k); loadSheetDiag(t, body); });
    if (!isOpen) return;
    (a.children || []).forEach(c => {
      if (c.kind === "llm") {
        addRow(c, depth + 1, [el("span", "caret", ""), el("span", "k", "model "), shortModel(c.name)], "llm",
          [el("div", "wf-num r", toks(c.tokens_in) + "/" + toks(c.tokens_out)), el("div", "wf-num r", money(c.cost))], null);
        return;
      }
      const ck = keyOf(c), show = opened.has(ck);
      addRow(c, depth + 1, [el("span", "caret", show ? "▾" : "▸"), el("span", "k", "tool "), c.label], c.error ? "tool fail" : "tool",
        [el("div", "wf-num r", ""), el("div", "wf-num r", "")],
        () => { show ? opened.delete(ck) : opened.add(ck); loadSheetDiag(t, body); });
      if (show) {
        const box = el("div", "wf-detail"), io = (h, v) => { const w = el("div"); w.append(el("div", "muted", h), el("pre", null, v ?? "(none yet)")); return w; };
        box.append(io("Input", c.input), io(c.error ? "Error" : "Output", c.output));
        grid.append(box);
      }
      (c.children || []).forEach(child => walk(child, depth + 2));
    });
  })(r, 0);
  const legend = el("div", "tl-legend");
  [["working", "Model call"], ["tool", "Tool call"], ["danger", "Failed tool"], ["done", "Agent run"]].forEach(([tok, lbl]) => {
    const s = el("span"), i = el("i"); i.style.background = `var(--${tok})`; s.append(i, lbl); legend.append(s);
  });
  const [sum, note] = traceSummary(d, r);
  const act = el("span"); act.append(el("span", "k", "Active "), el("b", null, dur(axis.active))); sum.append(act);
  return [el("div", "tl-prompt", "“" + d.prompt + "”"), sum, note, grid, legend];
}

function buildAgentTreeNodes(d, t, body) {
  const scopes = el("div", "tl-scope");
  [["session", "Whole session"], ["turn", "This turn"]].forEach(([k, label]) => {
    const b = el("button", "btn sm" + (k === tlScope ? " primary" : ""), label);
    b.onclick = () => { tlScope = k; remember("tlScope", k); loadSheetDiag(t, body); };
    scopes.append(b);
  });
  const kidsOf = a => (a.children || []).filter(c => c.kind === "agent").concat((a.children || []).flatMap(c => c.kind === "tool" ? (c.children || []) : []));
  const list = agents => {
    const ul = el("ul", "at");
    agents.sort((x, y) => x.start - y.start).forEach(a => {
      const li = el("li"), kids = kidsOf(a), k = keyOf(a), isOpen = !folded.has(k);
      const card = el("div", "at-card " + a.status);
      const title = el("div", "t"); title.append(el("span", "dot " + a.status), " ", el("b", null, a.type === "session" ? "Main session" : a.type), a.type === "session" ? "" : " " + a.name);
      card.append(el("span", "caret", kids.length ? (isOpen ? "▾" : "▸") : ""), title, el("span", "c", money(a.cost)),
        el("div", "m", [a.status, shortModel(a.model), dur(a.end - a.start), `${a.calls} model calls`, `${a.tools} tool calls`,
          kids.length ? `own ${money(a.cost_own)} · total ${money(a.cost)}` : null].filter(Boolean).join(" · ")));
      if (kids.length) {

        card.onclick = tog;

      }
      li.append(card);
      if (kids.length && isOpen) li.append(list(kids));

  return [scopes, ...traceSummary(d, d.root), list([d.root])];
}

function squarify(values, W, H) {
  const total = values.reduce((a, b) => a + b, 0) || 1, areas = values.map(v => v / total * W * H), out = [];
  let x = 0, y = 0, w = W, h = H, i = 0;
  const worst = (row, side) => { const s = row.reduce((a, b) => a + b, 0), mx = Math.max(...row), mn = Math.min(...row); return Math.max(side * side * mx / (s * s), s * s / (side * side * mn)); };
  while (i < areas.length) {
    const side = Math.min(w, h) || 1;
    let row = [areas[i]], j = i + 1;
    while (j < areas.length && worst(row.concat(areas[j]), side) <= worst(row, side)) row.push(areas[j++]);
    const s = row.reduce((a, b) => a + b, 0), thick = s / side;
    let off = 0;
    row.forEach(a => { const len = a / thick; out.push(w >= h ? { x, y: y + off, w: thick, h: len } : { x: x + off, y, w: len, h: thick }); off += len; });
    if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
    i = j;
  }
  return out;
}

function buildContextNodes(d, t, body) {
  if (d.error && !d.agents) return [el("div", "tl-prompt", d.error)];
  const top = el("div", "cm-head");
  if (d.agents && d.agents.length > 1) {
    const pick = el("select");
    pick.setAttribute("aria-label", "Select agent context");
    d.agents.forEach(a => { const o = el("option", null, a.name); o.value = a.id; o.selected = a.id === ctxAgent; pick.append(o); });
    pick.onchange = () => { ctxAgent = pick.value; loadSheetDiag(t, body); };
    top.append(pick);
  }
  if (d.error) return [top, el("div", "tl-prompt", d.error)];
  const kv = (k, v) => { const s = el("span"); s.append(el("span", "muted", k + " "), el("b", null, v)); top.append(s); };
  kv("Context", `${toks(d.total)} / ${toks(d.limit)} (${Math.round(d.total / d.limit * 100)}%)`);
  kv("Model", shortModel(d.model));
  kv("Cached", Math.round(d.cached / Math.max(d.total, 1) * 100) + "%");
  kv("Last call", ago(new Date(d.at * 1000).toISOString()));
  if (d.compactions) kv("Compacted", `${d.compactions}x`);
  const meter = el("div", "cm-meter"), fill = el("i"); fill.style.width = Math.min(100, d.total / d.limit * 100) + "%"; meter.append(fill);
  const cmap = el("div", "cm-map");
  const parts = d.blocks.concat([{ kind: "free", tokens: Math.max(0, d.limit - d.total), items: [] }]).filter(b => b.tokens > 0);
  requestAnimationFrame(() => {
    const W = cmap.clientWidth, H = cmap.clientHeight;
    if (!W) return;
    squarify(parts.map(b => b.tokens), W, H).forEach((r, i) => {
      const b = parts[i], [label, color] = CM_KIND[b.kind] || ["Free", "transparent"];
      const cat = el("div", "cm-cat" + (b.kind === "free" ? " free" : ""));
      Object.assign(cat.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" });
      cat.title = `${label} · ${toks(b.tokens)} tokens (${(b.tokens / d.limit * 100).toFixed(1)}%)`;
      if (r.w > 64 && r.h > 20) cat.append(el("b", null, `${label} ${toks(b.tokens)}`));
      squarify(b.items.map(it => it.tokens), r.w, r.h).forEach((q, k) => {
        const it = b.items[k], tile = el("div", "cm-item");
        Object.assign(tile.style, { left: q.x + "px", top: q.y + "px", width: q.w + "px", height: q.h + "px", background: color, opacity: 0.55 + 0.45 * (1 - k / Math.max(b.items.length, 1)) });
        tile.title = `${it.label} · ${toks(it.tokens)} tokens`;
        if (q.w > 78 && q.h > 36) tile.append(el("span", null, it.label), el("span", null, toks(it.tokens)));

      cmap.append(cat);

  const free = el("span"), fi = el("i"); fi.style.border = "1px dashed var(--muted)"; free.append(fi, `Free ${toks(d.limit - d.total)}`); legend.append(free);
  return [top, meter, cmap, legend];

function buildHandoffNodes(d, body) {
  if (!d.handoffs.length) return [el("div", "tl-prompt", "No /spinoff briefs or subagent handoffs recorded for this session yet.")];
  const openSet = new Set([...body.querySelectorAll("details[open]")].map(x => x.dataset.k));
  return d.handoffs.map(h => {
    const box = el("div", "ho"), top = el("div", "ho-top");
    const badge = h.kind === "spinoff" ? (h.direction === "out" ? "Spinoff →" : "← Spun off from") : "Subagent · " + h.type;
    top.append(el("span", "ho-badge", badge), el("b", null, h.title), el("span", "muted", [h.status, h.at ? ago(new Date(h.at * 1000).toISOString()) : ""].filter(Boolean).join(" · ")));
    const other = h.kind === "spinoff" ? sessionById(h.direction === "out" ? h.to : h.from) : null;
    if (other) { const go = el("button", "btn sm", "Open"); go.onclick = () => post("/api/focus", { workspace: other.workspace, surface: other.id }); top.append(go); }
    box.append(top);
    const sec = (k, label, text) => { const det = el("details"); det.dataset.k = h.title + h.at + k; det.open = openSet.has(det.dataset.k); det.append(el("summary", null, label), el("pre", null, text)); box.append(det); };
    sec("g", h.kind === "spinoff" ? "Brief given" : "Prompt given", h.given || "(empty)");
    if (h.returned) sec("r", "Final report", h.returned);
    const carried = (h.items || []).filter(i => !i.lost), lost = (h.items || []).filter(i => i.lost);
    if ((h.items || []).length) {
      const chips = el("div", "chips");
      carried.forEach(i => { const c = el("span", "chip" + (i.kind === "source" ? " src" : ""), i.label); c.title = "Named in the brief"; chips.append(c); });
      lost.forEach(i => { const c = el("span", "chip lost", i.label); c.title = i.why; chips.append(c); });
      box.append(chips);
    }
    return box;
  });
}

/* ---------------- Safe Markdown Renderer (textContent only) ---------------- */
function inlineMd(text) {
  const frag = document.createDocumentFragment();
  const re = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\[[^\]]+\]\([^)\s]+\))|(https?:\/\/[^\s)]+)|(\*[^*\s][^*]*\*)/g;
  let at = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > at) frag.append(text.slice(at, m.index));
    const [tok] = m;
    if (m[1]) frag.append(el("code", null, tok.slice(1, -1)));
    else if (m[2]) { const b = el("strong"); b.append(inlineMd(tok.slice(2, -2))); frag.append(b); }
    else if (m[3]) { const [, label, href] = tok.match(/^\[([^\]]+)\]\(([^)]+)\)$/); const l = el("a", null, label); l.href = href; l.target = "_blank"; l.rel = "noopener"; frag.append(l); }
    else if (m[4]) { const l = el("a", null, tok); l.href = tok; l.target = "_blank"; l.rel = "noopener"; frag.append(l); }
    else frag.append(el("em", null, tok.slice(1, -1)));
    at = m.index + tok.length;
  }
  if (at < text.length) frag.append(text.slice(at));
  return frag;
}
const mdCells = line => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
const MD_LIST = /^(\s*)([-*\u2022]|\d+[.)])\s+(.*)$/;
function markdown(src) {
  const out = el("div", "md"), lines = src.replace(/\r/g, "").split("\n");
  let i = 0, para = [];
  const flush = () => { if (para.length) { const p = el("p"); p.append(inlineMd(para.join(" "))); out.append(p); para = []; } };
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { flush(); i++; continue; }
    if (/^\s*```/.test(line)) {
      flush(); const code = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
      i++; out.append(el("pre", null, code.join("\n"))); continue;
    }
    if (/^\s*\|/.test(line) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || "")) {
      flush(); const wrap = el("div", "tbl"), table = el("table"), head = el("tr");
      mdCells(line).forEach(c => { const th = el("th"); th.append(inlineMd(c)); head.append(th); });
      table.append(head); i += 2;
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        const tr = el("tr"); mdCells(lines[i++]).forEach(c => { const td = el("td", c.length <= 28 ? "short" : null); td.append(inlineMd(c)); tr.append(td); }); table.append(tr);
      }
      wrap.append(table); out.append(wrap); continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flush(); const e = el("h3"); e.append(inlineMd(h[2])); out.append(e); i++; continue; }
    if (/^\s*>/.test(line)) {
      flush(); const q = el("blockquote"), body = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ""));
      q.append(inlineMd(body.join(" "))); out.append(q); continue;
    }
    if (MD_LIST.test(line)) {
      flush(); const ordered = /\d/.test(line.match(MD_LIST)[2]), list = el(ordered ? "ol" : "ul");
      while (i < lines.length && (MD_LIST.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && list.lastChild))) {
        const m = lines[i].match(MD_LIST);
        if (m) { const li = el("li"); if (m[1].length >= 2) li.className = "sub"; li.append(inlineMd(m[3])); list.append(li); }
        else list.lastChild.append(" ", inlineMd(lines[i].trim()));
        i++;
      }
      out.append(list); continue;
    }
    para.push(line.trim()); i++;
  }
  flush();
  return out;
}

/* ---------------- Triage View (Default: Needs-You Grid + Unified Workspace/Goal Board) ---------------- */
function renderTriage(state) {
  const y = scrollY;
  const wrap = el("div", "triage-wrap");

  // Zone 1: Prioritized Needs-You Queue
  const allFlagged = needsSessions(true);
  const activeNeeds = allFlagged.filter(t => !isDismissed(t));
  const dismissedNeeds = allFlagged.filter(t => isDismissed(t));
  const freshNeeds = activeNeeds.filter(t => !isStaleAsk(t));
  const staleNeeds = activeNeeds.filter(t => isStaleAsk(t));

  const triageSec = el("section");
  triageSec.setAttribute("aria-label", "Sessions needing your attention");
  const bar = el("div", "sec-bar");
  const liveCnt = activeNeeds.filter(t => t.agent && t.status !== "shell").length;
  const endedCnt = activeNeeds.length - liveCnt;
  const h2 = el("h2", "", "Needs you");
  h2.append(el("span", "count-pill" + (liveCnt ? " warm" : ""), String(liveCnt)));
  if (endedCnt) h2.append(el("span", "count-pill", `+${endedCnt} ended`));
  bar.append(h2);

  const pills = el("div", "filter-pills");
  const addPill = (k, lbl) => {
    const b = el("button", "pill-btn" + (triageFilter === k ? " on" : ""), lbl);
    b.onclick = () => { triageFilter = k; remember("ow.triageFilter", k); render(last); };
    pills.append(b);
  };
  addPill("all", `All (${activeNeeds.length})`);
  if (freshNeeds.length && staleNeeds.length) {
    addPill("fresh", `Recent <24h (${freshNeeds.length})`);
    addPill("stale", `Older 24h+ (${staleNeeds.length})`);
  }
  if (dismissedNeeds.length) addPill("dismissed", `Dismissed (${dismissedNeeds.length})`);
  bar.append(pills);

  if (staleNeeds.length && triageFilter !== "dismissed") {
    const bulkKey = "dismiss-stale";
    const bulk = el("button", "btn sm" + (armed === bulkKey ? " armed" : ""), armed === bulkKey ? `Dismiss ${staleNeeds.length} older asks?` : `Dismiss older (${staleNeeds.length})`);
    bulk.title = "Hide all asks older than 24h until they reply again (click twice)";
    bulk.onclick = () => armAction(bulkKey, () => {
      const snap = { ...dismissed };
      staleNeeds.forEach(t => { dismissed[t.id] = askTextOf(t); });
      saveDismissed();
      render(last);
      showToast(`Dismissed ${staleNeeds.length} asks older than 24h`, "ok", "Undo", () => {
        dismissed = snap; saveDismissed(); render(last);
      });
    });
    bar.append(bulk);
  }
  if (liveNeedsSessions().length) {
    const startTriage = el("button", "btn sm warm", "");
    startTriage.style.marginLeft = "auto";
    startTriage.append(icon("reply"), document.createTextNode("Reply through queue (r)"));
    startTriage.onclick = () => openSheet(liveNeedsSessions()[0].id, "reply");
    bar.append(startTriage);
  }
  triageSec.append(bar);

  const shownNeeds = triageFilter === "fresh" ? freshNeeds
    : triageFilter === "stale" ? staleNeeds
    : triageFilter === "dismissed" ? dismissedNeeds
    : activeNeeds;

  if (!shownNeeds.length) {
    const empty = el("div", "caught-up");
    const msg = el("div");
    msg.append(el("strong", "", triageFilter === "dismissed" ? "No dismissed asks" : "All caught up"),
      el("div", "muted", triageFilter === "dismissed" ? "Dismissed asks stay hidden until the agent sends a new reply." : "Zero sessions waiting on your decision right now."));
    empty.append(msg);
    if (triageFilter !== "all" && activeNeeds.length) {
      const reset = el("button", "btn sm", `Show all ${activeNeeds.length} asks`);
      reset.onclick = () => { triageFilter = "all"; remember("ow.triageFilter", "all"); render(last); };
      empty.append(reset);
    }
    triageSec.append(empty);
  } else {
    const grid = el("div", "needs-grid");
    shownNeeds.forEach(t => grid.append(buildTriageCard(t, triageFilter === "dismissed")));
    triageSec.append(grid);
  }
  wrap.append(triageSec);

  // Zone 2: Unified Board (Workspace | Goal)
  const boardSec = el("section");
  boardSec.setAttribute("aria-label", "All sessions and work items");
  const tools = el("div", "board-tools");
  tools.append(el("h2", "", boardGroup === "workspace" ? "Workspaces" : "Work by goal"));

  const grpSeg = el("div", "nav-seg");
  grpSeg.setAttribute("role", "tablist");
  grpSeg.setAttribute("aria-label", "Board grouping");
  [["workspace", "By workspace"], ["goal", "By goal"]].forEach(([k, lbl]) => {
    const b = el("button", "", lbl);
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(boardGroup === k));
    b.onclick = () => { boardGroup = k; remember("ow.boardGroup", k); render(last); };
    grpSeg.append(b);
  });
  tools.append(grpSeg);

  const right = el("div", "right-tools");
  if (boardGroup === "workspace") {
    const shLab = el("label", "chk-label");
    const shCb = el("input"); shCb.type = "checkbox"; shCb.checked = showShells;
    shCb.onchange = () => { showShells = shCb.checked; remember("ow.shells", showShells ? "1" : "0"); render(last); };
    shLab.append(shCb, document.createTextNode("Show plain shells"));
    right.append(shLab);

    const newGrp = el("button", "btn sm", "");
    newGrp.append(icon("plus"), document.createTextNode("New group"));
    newGrp.onclick = () => post("/api/new-group", {}, "Created new workspace group");
    right.append(newGrp);

    const autoBtn = el("button", "btn sm" + (armed === "autoname-all" ? " armed" : ""), "");
    autoBtn.append(icon("sparkle"), document.createTextNode(naming === "all" ? "Naming..." : armed === "autoname-all" ? "Rename all workspaces?" : "Auto-name all"));
    autoBtn.disabled = !!naming;
    autoBtn.title = "Use Haiku to name workspaces and sessions from recent prompts (click twice to confirm)";
    autoBtn.onclick = () => armAction("autoname-all", () => autoname());
    right.append(autoBtn);
  } else if (state.work && state.work.seeded) {
    const reg = el("button", "btn sm" + (armed === "regroup-goals" ? " armed" : ""), groupBusy ? "Grouping..." : armed === "regroup-goals" ? "Overwrite manual goals?" : "Regroup by goal");
    reg.disabled = groupBusy;
    reg.onclick = () => armAction("regroup-goals", proposeGroups);
    right.append(reg);
  }
  tools.append(right);
  boardSec.append(tools);

  if (boardGroup === "workspace") {
    boardSec.append(buildWorkspaceBoard(state));
  } else {
    boardSec.append(buildGoalBoard(state));
  }
  wrap.append(boardSec);

  if (ticked.size) wrap.append(buildTickBanner());
  if (pendingMerge) wrap.append(mergeBar());

  map.replaceChildren(wrap);
  scrollTo(0, y);
}

function buildTriageCard(t, isRestorable) {
  const st = effectiveStatus(t);
  const item = itemBySessionId(t.id);
  const stale = isStaleAsk(t);
  const ended = st === "ended" || st === "shell";
  const ask = askTextOf(t) || "(No message text yet)";
  const kind = ended ? "ended" : (t.action && t.action.kind) || "action";

  const card = el("article", "tcard" + (stale ? " stale" : "") + (ended ? " ended" : "") + (sel === t.id ? " sel" : ""));
  card.dataset.id = t.id;
  card.tabIndex = 0;
  card.setAttribute("aria-label", `${t.title}: ${ask.slice(0, 120)}`);
  card.onkeydown = e => {
    if (e.target !== card) return;
    if (e.key === "Enter") { e.preventDefault(); post("/api/focus", { workspace: t.workspace, surface: t.id }); }
    else if (e.key === "r" && !ended) { e.preventDefault(); openSheet(t.id, "reply"); }
    else if (e.key === "d" && !isRestorable) { e.preventDefault(); dismissSession(t); }
  };

  const top = el("div", "tcard-top");
  top.append(el("span", "dot " + st));
  top.append(el("span", "tcard-title", t.title));
  const ctxParts = [];
  if (item && item.title !== t.title) ctxParts.push(item.title);
  else if (t.ws_title) ctxParts.push(t.ws_title);
  if (ctxParts.length) top.append(el("span", "tcard-ctx", "· " + ctxParts.join(" · ")));
  if (kind === "decision") top.append(el("span", "kind-badge decision", "Decision"));
  else if (ended) top.append(el("span", "kind-badge ended", "Ended"));
  top.append(el("span", "tcard-age", ago(new Date(waitedMs(t)).toISOString())));

  const acts = el("div", "tcard-acts");
  if (isRestorable) {
    const rest = el("button", "btn sm", "Restore");
    rest.onclick = () => restoreSession(t);
    acts.append(rest);
  } else {
    if (!ended) {
      const rep = el("button", "btn sm warm", "");
      rep.dataset.walk = "reply-need";
      rep.append(icon("reply"), document.createTextNode("Reply"));
      rep.title = "Read full message and reply inline";
      rep.onclick = () => openSheet(t.id, "reply");
      acts.append(rep);
    } else if (item && item.resumable) {
      const res = el("button", "btn sm", "Resume");
      res.onclick = () => itemAct(item, "resume", "Reopening session");
      acts.append(res);
    }

    const open = el("button", "btn sm", "Open");
    open.dataset.walk = "open-need";
    open.title = `Focus this tab in ${t.ws_title || "cmux"}`;
    open.onclick = () => post("/api/focus", { workspace: t.workspace, surface: t.id });
    acts.append(open);

    if (t.agent === "claude") {
      const insp = el("button", "btn sm icon", "");
      insp.setAttribute("aria-label", `Inspect timeline and cost for ${t.title}`);
      insp.title = "Turn timeline, waterfall, and context map";
      insp.append(icon("clock"));
      insp.onclick = () => openSheet(t.id, "timeline");
      acts.append(insp);
    }

    const dis = el("button", "btn sm icon", "");
    dis.setAttribute("aria-label", `Dismiss ${t.title} from Needs you`);
    dis.title = "Dismiss until this session replies again";
    dis.append(icon("check"));
    dis.onclick = () => dismissSession(t);
    acts.append(dis);
  }
  top.append(acts);
  card.append(top);

  const askEl = el("div", "tcard-ask", ask);
  askEl.title = ask;
  card.append(askEl);

  if (!ended && !isRestorable && t.action && t.action.options && t.action.options.length) {
    const opts = el("div", "tcard-opts");
    t.action.options.slice(0, 3).forEach((o, oi) => {
      const optKey = `opt:${t.id}:${oi}`;
      const ob = el("button", "opt-chip" + (armed === optKey ? " armed" : ""), armed === optKey ? `Send "${o.slice(0, 24)}"?` : o);
      ob.title = `Click twice to send "${o}" directly to ${t.title}`;
      ob.onclick = e => {
        e.stopPropagation();
        armAction(optKey, async () => {
          ob.disabled = true; ob.textContent = "Sending...";
          const err = await sendTo(t, o);
          if (err) { ob.disabled = false; ob.textContent = o; showToast("Not sent: " + err, "err"); return; }
          sent.add(t.id);
          showToast(`Sent "${o}" to ${t.title}`, "ok");
          setTimeout(tick, 500);
        });
      };
      opts.append(ob);
    });
    card.append(opts);
  }
  return card;
}

/* ---------------- Workspace Masonry Board (Inside Triage) ---------------- */
const COL_MIN = 330, GAP = 12;

function buildWorkspaceBoard(state) {
  const board = el("div", "ws-board");
  const parentOf = Object.fromEntries((state.edges || []).map(e => [e.child, e.parent]));
  const regions = state.regions.map(r => {
    const sessions = r.sessions.filter(t => showShells || effectiveStatus(t) !== "shell");
    const rank = Math.min(...sessions.map(t => ORDER[effectiveStatus(t)] ?? 9), 9);
    return { ...r, sessions, rank };
  }).filter(r => r.sessions.length || r.scratch).sort((a, b) => a.rank - b.rank);

  const boxes = regions.map(r => {
    const box = el("section", "region" + (r.scratch ? " scratch" : ""));
    box.dataset.group = r.scratch ? "scratch" : r.group || "";
    const h = el("div", "rhead");
    h.draggable = !r.scratch;
    h.ondragstart = e => { draggingRegion = r; e.dataTransfer.setData("text/plain", r.id); box.classList.add("dragging"); };
    h.ondragend = () => { draggingRegion = null; box.classList.remove("dragging"); document.querySelectorAll(".drop").forEach(g => g.classList.remove("drop")); };

    const nameEl = el("h3", "", r.title);
    nameEl.title = r.title;
    h.append(nameEl);
    if (r.scratch) {
      h.append(el("span", "rcount", "One-off sessions · drag to a group to promote"));
    } else {
      const racts = el("div", "racts");
      const ren = el("button", "btn sm icon", "");
      ren.setAttribute("aria-label", `Rename workspace ${r.title}`);
      ren.title = "Rename workspace";
      ren.append(icon("edit"));
      ren.onclick = e => { e.stopPropagation(); startRename(nameEl, r.title, title => post("/api/rename", { workspace: r.id, title })); };
      const autoKey = "auto:" + r.id;
      const auto = el("button", "btn sm icon" + (armed === autoKey ? " armed" : ""), armed === autoKey ? "Name?" : "");
      if (armed !== autoKey) auto.append(icon("sparkle"));
      auto.setAttribute("aria-label", `Auto-name ${r.title}`);
      auto.title = "Auto-name this workspace and its sessions (click twice)";
      auto.disabled = !!naming;
      auto.onclick = e => { e.stopPropagation(); armAction(autoKey, () => autoname(r.id)); };
      racts.append(ren, auto);
      h.append(racts);
    }
    const cnt = el("span", "rcount", String(r.sessions.length));
    cnt.title = `${r.sessions.length} ${r.sessions.length === 1 ? "session" : "sessions"}`;
    h.append(cnt);
    const addBtn = el("button", "btn sm icon", "");
    addBtn.setAttribute("aria-label", `New Claude session in ${r.title}`);
    addBtn.title = `New Claude session in ${r.title}`;
    addBtn.append(icon("plus"));
    addBtn.onclick = () => post("/api/new", { workspace: r.id }, `Started new session in ${r.title}`);
    h.append(addBtn);
    box.append(h);

    box.ondragover = e => { if (!dragging) return; e.stopPropagation(); if (dragging.workspace !== r.id) { e.preventDefault(); box.classList.add("drop"); } };
    box.ondragleave = e => { if (!box.contains(e.relatedTarget)) box.classList.remove("drop"); };
    box.ondrop = e => { if (!dragging) return; e.preventDefault(); e.stopPropagation(); if (dragging.workspace === r.id) return; box.classList.remove("drop"); post("/api/move", { workspace: r.id, surface: dragging.id }); };

    const ids = new Set(r.sessions.map(t => t.id));
    const byRank = [...r.sessions].sort((a, b) => (ORDER[effectiveStatus(a)] ?? 9) - (ORDER[effectiveStatus(b)] ?? 9) || (Date.parse(b.since || 0) - Date.parse(a.since || 0)));
    const roots = byRank.filter(t => !ids.has(parentOf[t.id]));
    const addTree = (t, depth) => {
      box.append(buildSessionCard(t, depth > 0));
      byRank.filter(c => parentOf[c.id] === t.id).forEach(c => addTree(c, depth + 1));
    };
    roots.forEach(t => addTree(t, 0));
    return box;
  });

  const scratch = boxes.find(b => b.dataset.group === "scratch");
  if (scratch) board.append(scratch);

  const groups = [...(state.groups || []), { id: "", name: "Ungrouped" }]
    .map(g => ({ g, mine: boxes.filter(b => b.dataset.group === g.id) }))
    .filter(x => x.g.id || x.mine.length);

  const availW = Math.max(320, (map.clientWidth || innerWidth) - 32);
  const totalCols = Math.max(1, Math.floor((availW + GAP) / (COL_MIN + GAP)));
  groups.forEach(x => { x.n = 1; });
  for (let spare = totalCols - groups.length; spare > 0; spare--) {
    const open = groups.filter(x => x.n < x.mine.length);
    if (!open.length) break;
    open.reduce((a, b) => (b.mine.length / b.n > a.mine.length / a.n ? b : a)).n++;
  }

  groups.forEach(({ g, mine, n }) => {
    const sec = el("section", "group");
    sec.style.flex = String(n);
    const gh = el("div", "g-hdr");
    const gname = el("h3", "", g.name);
    gh.append(gname, el("span", "rcount", `${mine.length} workspace${mine.length === 1 ? "" : "s"}`));
    if (g.id) {
      const ren = el("button", "btn sm icon", "");
      ren.setAttribute("aria-label", `Rename group ${g.name}`);
      ren.title = "Rename group";
      ren.append(icon("edit"));
      ren.onclick = () => startRename(gname, g.name, name => post("/api/rename-group", { group: g.id, name }));
      gh.append(ren);
    }
    const plus = el("button", "btn sm icon", "");
    plus.setAttribute("aria-label", `New workspace in ${g.name}`);
    plus.title = `New workspace in ${g.name}`;
    plus.append(icon("plus"));
    plus.onclick = () => post("/api/new-workspace", { group: g.id || null }, `Created workspace in ${g.name}`);
    gh.append(plus);
    if (g.id) {
      const del = el("button", "btn sm icon" + (armed === "delgrp:" + g.id ? " armed" : ""), armed === "delgrp:" + g.id ? "Delete?" : "");
      if (armed !== "delgrp:" + g.id) del.append(icon("close"));
      del.setAttribute("aria-label", `Delete group ${g.name}`);
      del.title = "Ungroup workspaces (click twice)";
      del.onclick = () => armAction("delgrp:" + g.id, () => post("/api/delete-group", { group: g.id }, `Removed group ${g.name}`));
      gh.append(del);
    }

    const zone = el("div", "newzone", "Drop a session here to give it its own workspace");
    const canSplit = () => { const src = last.regions.find(r => r.id === dragging.workspace); return !(src && src.sessions.length === 1 && (src.group || "") === g.id); };
    const doSplit = () => post("/api/split", { surface: dragging.id, workspace: dragging.workspace, title: dragging.title, group: g.id || null });
    zone.ondragover = e => { if (dragging && canSplit()) { e.preventDefault(); e.stopPropagation(); zone.classList.add("drop"); } };
    zone.ondragleave = () => zone.classList.remove("drop");
    zone.ondrop = e => { if (!dragging) return; e.preventDefault(); e.stopPropagation(); zone.classList.remove("drop"); sec.classList.remove("drop"); doSplit(); };

    const cols = el("div", "cols");
    const colEls = Array.from({ length: n }, () => el("div", "col"));
    mine.forEach((box, idx) => colEls[idx % n].append(box));
    cols.append(...colEls);
    sec.append(gh, zone, cols);

    sec.ondragover = e => { if ((draggingRegion && (draggingRegion.group || "") !== g.id) || (dragging && canSplit())) { e.preventDefault(); sec.classList.add("drop"); } };
    sec.ondragleave = e => { if (!sec.contains(e.relatedTarget)) sec.classList.remove("drop"); };
    sec.ondrop = e => {
      e.preventDefault(); sec.classList.remove("drop");
      if (draggingRegion) post("/api/group", { workspace: draggingRegion.id, group: g.id || null });
      else if (dragging) doSplit();
    };
    board.append(sec);
  });

  return board;
}

function buildSessionCard(t, isChild) {
  const st = effectiveStatus(t);
  const b = el("div", "session " + st + (isChild ? " child" : "") + (t.here ? " here" : "") + (sel === t.id ? " sel" : "") + (ticked.has(t.id) ? " ticked" : ""));
  b.dataset.id = t.id;
  b.tabIndex = 0;
  b.setAttribute("role", "button");
  b.setAttribute("aria-label", `${t.title}, ${STATUS_LABEL[st] || st}`);
  b.draggable = true;
  b.ondragstart = e => { dragging = t; e.dataTransfer.setData("text/plain", t.id); b.classList.add("dragging"); document.body.classList.add("dragging-session"); };
  b.ondragend = () => { dragging = null; b.classList.remove("dragging"); document.body.classList.remove("dragging-session"); document.querySelectorAll(".drop").forEach(r => r.classList.remove("drop")); };

  const top = el("div", "s-top");
  top.append(el("span", "dot " + st));
  const titleEl = el("span", "stitle", (isChild ? "↳ " : "") + t.title);
  titleEl.title = t.title;
  top.append(titleEl);
  if (t.agent && t.agent !== "claude") top.append(el("span", "agent-tag", t.agent));
  const bg = (t.subagents || []).filter(a => a.status === "running").length;
  const age = ago(t.since || (t.updated ? new Date(t.updated * 1000).toISOString() : null));
  const metaText = [STATUS_LABEL[st] + (st === "waiting" && bg ? ` (+${bg} running)` : ""), age].filter(Boolean).join(" · ");
  const meta = el("span", "smeta " + st, metaText);
  if (st === "stalled") meta.title = "No hook event for more than 20 minutes";
  top.append(meta);
  b.append(top);

  // Hover/focus action overlay so titles keep full width at rest
  const acts = el("div", "sacts" + (armed === "close:" + t.id ? " armed" : ""));
  const ren = el("button", "", "");
  ren.setAttribute("aria-label", `Rename ${t.title}`); ren.title = "Rename"; ren.append(icon("edit"));
  ren.onclick = e => { e.stopPropagation(); startRename(titleEl, t.title, title => post("/api/rename", { workspace: t.workspace, surface: t.id, title })); };
  acts.append(ren);
  if (t.agent === "claude") {
    const tlBtn = el("button", "", "");
    tlBtn.setAttribute("aria-label", `Inspect ${t.title}`); tlBtn.title = "Timeline, waterfall, and context"; tlBtn.append(icon("clock"));
    tlBtn.onclick = e => { e.stopPropagation(); openSheet(t.id, "timeline"); };
    acts.append(tlBtn);
  }
  if (t.agent && st !== "ended") {
    const repBtn = el("button", "", "");
    repBtn.setAttribute("aria-label", `Reply to ${t.title}`); repBtn.title = "Read and reply inline (key: r)"; repBtn.append(icon("reply"));
    repBtn.onclick = e => { e.stopPropagation(); sel = t.id; openSheet(t.id, "reply"); };
    acts.append(repBtn);
  }
  const closeBtn = el("button", armed === "close:" + t.id ? "armed" : "", armed === "close:" + t.id ? "Close?" : "");
  if (armed !== "close:" + t.id) closeBtn.append(icon("close"));
  closeBtn.setAttribute("aria-label", `Close ${t.title}`); closeBtn.title = "Close session (click twice)";
  closeBtn.onclick = e => { e.stopPropagation(); armAction("close:" + t.id, () => post("/api/close", { workspace: t.workspace, surface: t.id, force: !t.agent })); };
  acts.append(closeBtn);
  b.append(acts);

  const ask = st === "waiting" && askTextOf(t);
  if (ask || t.recap) {
    b.append(el("div", "recap" + (ask ? " ask" : ""), ask || t.recap));
  }
  if ((t.subagents || []).length) {
    const lane = laneEl(t);
    lane.tabIndex = 0; lane.setAttribute("role", "button");
    lane.setAttribute("aria-label", `Inspect ${t.subagents.length} subagent${t.subagents.length === 1 ? "" : "s"} for ${t.title}`);
    lane.onclick = e => { e.stopPropagation(); openSheet(t.id, "timeline"); };
    lane.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); openSheet(t.id, "timeline"); } };
    b.append(lane);
  }

  const focusTab = () => post("/api/focus", { workspace: t.workspace, surface: t.id });
  b.onclick = e => { if (!e.target.closest("button, input")) focusTab(); };
  b.onkeydown = e => {
    if (e.target !== b) return;
    if (e.key === "Enter") { e.preventDefault(); focusTab(); }
    else if (e.key === " ") { e.preventDefault(); ticked.has(t.id) ? ticked.delete(t.id) : ticked.add(t.id); render(last); }
  };
  return b;
}

function laneEl(t) {
  const lane = el("div", "lane");
  t.subagents.forEach(a => {
    const row = el("div", "sub " + a.status), top = el("div", "s-top");
    const end = a.status === "running" ? new Date().toISOString() : a.ended;
    top.append(el("span", "dot"), el("span", "what", `${a.type} · ${a.label}`), el("span", "", [a.status, spanBetween(a.started, end)].filter(Boolean).join(" · ")));
    row.append(top);
    if (a.detail) row.append(el("div", "detail", a.detail));
    row.title = a.detail || "";
    lane.append(row);
  });
  if (t.subagents_more) lane.append(el("div", "sub", `+${t.subagents_more} more`));
  return lane;
}

function buildTickBanner() {
