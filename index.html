<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Overworld</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1117;
    --surface: #161923;
    --surface-2: #1d2130;
    --surface-3: #252b3e;
    --line: #272c3f;
    --line-strong: #39405a;
    --text: #eceef5;
    --text-2: #c2c7da;
    --muted: #9299b5;
    --idle: #8087a3;
    --waiting: #f5a524;
    --waiting-bg: rgba(245, 165, 36, 0.11);
    --waiting-line: rgba(245, 165, 36, 0.36);
    --working: #60a5fa;
    --working-bg: rgba(96, 165, 250, 0.12);
    --accent-fill: #2563eb;
    --accent-hover: #1d4ed8;
    --done: #3ecf8e;
    --done-bg: rgba(62, 207, 142, 0.12);
    --tool: #b48cff;
    --tool-bg: rgba(180, 140, 255, 0.12);
    --danger: #ff7b7b;
    --danger-bg: rgba(255, 123, 123, 0.12);
    --shell: #59607a;
    --scrim: rgba(7, 9, 14, 0.68);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 12px;
    --shadow-pop: 0 8px 20px rgba(0, 0, 0, 0.45);
    --shadow-drawer: -10px 0 28px rgba(0, 0, 0, 0.45);
    --font-sans: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 var(--font-sans);
    -webkit-font-smoothing: antialiased;
    caret-color: var(--working);
  }
  ::selection { background: rgba(96, 165, 250, 0.32); color: var(--text); }
  a { color: var(--working); text-underline-offset: 3px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  ::placeholder { color: var(--muted); opacity: 1; }
  button { cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--working); outline-offset: 2px; border-radius: 4px; }

  /* Subtle themed scrollbars */
  * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .ico { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; flex: none; }

  /* ---------------- Top Header ---------------- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px;
    padding: 8px 16px; min-height: 52px;
    background: rgba(15, 17, 23, 0.94);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .brand-btn {
    background: none; border: 0; padding: 2px 4px; border-radius: var(--radius-sm);
    display: inline-flex; align-items: center; gap: 8px; text-align: left;
  }
  .brand-btn:hover { background: var(--surface-2); }
  h1 {
    font-size: 20px; line-height: 1.2; font-weight: 700;
    letter-spacing: -0.02em; margin: 0; color: var(--text);
  }
  h2 { font-size: 15px; line-height: 1.3; font-weight: 650; margin: 0; color: var(--text); }
  h3 { font-size: 13px; line-height: 1.35; font-weight: 600; margin: 0; color: var(--text-2); }

  .tally {
    display: flex; align-items: center; gap: 12px;
    color: var(--muted); font-size: 12.5px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .tally .stat { display: inline-flex; align-items: center; gap: 5px; }
  .tally b { color: var(--text); font-weight: 650; }
  .tally .stat.urgent b { color: var(--waiting); }

  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--idle);
  }
  .dot.waiting { background: var(--waiting); }
  .dot.working { background: var(--working); }
  .dot.stalled { background: var(--idle); box-shadow: inset 0 0 0 1.5px var(--working); }
  .dot.done { background: var(--done); }
  .dot.idle { background: var(--idle); }
  .dot.shell, .dot.ended { background: transparent; border: 1.5px solid var(--idle); }

  /* 3-Segment View Switcher */
  .nav-seg {
    display: inline-flex; align-items: center; padding: 2px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; gap: 2px;
  }
  .nav-seg button {
    background: none; border: 0; border-radius: 6px; padding: 4px 11px;
    color: var(--muted); font-size: 12.5px; font-weight: 500; white-space: nowrap;
    transition: background 140ms ease, color 140ms ease;
  }
  .nav-seg button:hover { color: var(--text); background: var(--surface-2); }
  .nav-seg button[aria-selected="true"], .nav-seg button.on {
    background: var(--surface-3); color: var(--text); font-weight: 600;
    box-shadow: inset 0 0 0 1px var(--line-strong);
  }

  .hdr-right { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
    color: var(--text-2); font-size: 12.5px; font-weight: 500; line-height: 1.25;
    padding: 5px 10px; white-space: nowrap;
    transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  .btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line-strong); color: var(--text); }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .btn.icon { padding: 4px 6px; color: var(--muted); }
  .btn.icon:hover:not(:disabled) { color: var(--text); }
  .btn.primary {
    background: var(--accent-fill); border-color: var(--accent-fill); color: #ffffff; font-weight: 600;
  }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: #ffffff; }
  .btn.warm {
    background: var(--waiting-bg); border-color: var(--waiting-line); color: var(--waiting); font-weight: 600;
  }
  .btn.warm:hover:not(:disabled) { background: var(--waiting); border-color: var(--waiting); color: var(--bg); }
  .btn.armed {
    background: var(--danger-bg); border-color: var(--danger); color: var(--danger); font-weight: 600;
  }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }

  .kbd {
    display: inline-block; padding: 1px 5px; border-radius: 4px;
    background: var(--bg); border: 1px solid var(--line-strong);
    color: var(--muted); font: 12px/1.2 var(--font-mono);
  }

  /* Weekly Usage Meter */
  .usage {
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--muted); font-size: 12px; white-space: nowrap;
    font-variant-numeric: tabular-nums; padding: 3px 8px;
    border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--line);
  }
  .usage .bar { width: 64px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
  .usage .fill { height: 100%; background: var(--working); border-radius: 3px; }
  .usage.warn .fill { background: var(--waiting); }
  .usage.over .fill { background: var(--danger); }
  .usage .pct { color: var(--text); font-weight: 650; }
  .usage .pace.warn { color: var(--waiting); }
  .usage .pace.over { color: var(--danger); }
  .usage svg { display: block; }

  /* ---------------- Main Layout ---------------- */
  main { padding: 14px 16px 48px; }
  main.gmode { padding: 0; }

  /* ---------------- Triage View (Default) ---------------- */
  .triage-wrap { max-width: 1680px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  .sec-bar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px;
    margin-bottom: 10px;
  }
  .sec-bar h2 { display: inline-flex; align-items: center; gap: 8px; }
  .count-pill {
    display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 99px;
    font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--text-2);
    border: 1px solid var(--line); font-variant-numeric: tabular-nums;
  }
  .count-pill.warm { background: var(--waiting-bg); border-color: var(--waiting-line); color: var(--waiting); }

  .filter-pills { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .pill-btn {
    background: transparent; border: 1px solid var(--line); border-radius: 99px;
    color: var(--muted); font-size: 12px; padding: 2px 10px;
    transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
  }
  .pill-btn:hover { color: var(--text); border-color: var(--line-strong); }
  .pill-btn.on { background: var(--surface-3); border-color: var(--line-strong); color: var(--text); font-weight: 600; }

  /* Needs-You Triage Grid: 2 columns at >=1100px so 18-20 asks fit comfortably above fold at 1440x900 */
  .needs-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  @media (max-width: 1099px) {
    .needs-grid { grid-template-columns: minmax(0, 1fr); }
  }

  .tcard {
    background: var(--surface);
    border: 1px solid var(--waiting-line);
    border-radius: var(--radius-md);
    padding: 7px 10px;
    display: flex; flex-direction: column; gap: 4px;
    transition: background 140ms ease, border-color 140ms ease;
  }
  .tcard:hover { background: var(--surface-2); border-color: rgba(245, 165, 36, 0.55); }
  .tcard.stale { border-color: var(--line-strong); }
  .tcard.stale:hover { border-color: var(--muted); }
  .tcard.ended { border-color: var(--line); opacity: 0.92; }
  .tcard.sel { box-shadow: 0 0 0 1.5px var(--working); }

  .tcard-top {
    display: flex; align-items: center; gap: 6px; min-width: 0;
  }
  .tcard-title {
    font-weight: 650; font-size: 13px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0;
  }
  .tcard-ctx {
    color: var(--muted); font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0;
  }
  .tcard-age {
    color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: none;
  }
  .kind-badge {
    font-size: 12px; font-weight: 500; padding: 0 6px; border-radius: 4px; flex: none;
    border: 1px solid var(--line-strong); color: var(--text-2); background: var(--bg);
  }
  .kind-badge.decision { border-color: var(--waiting-line); color: var(--waiting); background: var(--waiting-bg); }
  .kind-badge.ended { border-color: var(--line); color: var(--muted); }

  .tcard-ask {
    font-size: 12.5px; line-height: 1.38; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; overflow-wrap: anywhere; word-break: break-word;
  }
  .tcard-opts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .opt-chip {
    background: var(--bg); border: 1px solid var(--waiting-line); border-radius: 5px;
    color: var(--text); font-size: 12px; padding: 2px 8px;
    max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: background 140ms ease, border-color 140ms ease;
  }
  .opt-chip:hover:not(:disabled) { background: var(--waiting-bg); border-color: var(--waiting); color: var(--waiting); }
  .tcard-acts { display: inline-flex; align-items: center; gap: 4px; flex: none; }

  .caught-up {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .caught-up strong { color: var(--done); font-size: 14px; }

  /* ---------------- Unified Board (Workspace / Goal modes) ---------------- */
  .board-tools {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px;
    padding-top: 14px; border-top: 1px solid var(--line);
  }
  .board-tools .right-tools { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .chk-label {
    display: inline-flex; align-items: center; gap: 6px; color: var(--muted);
    font-size: 12.5px; cursor: pointer; user-select: none;
  }
  .chk-label:hover { color: var(--text); }

  /* Workspace Masonry Board */
  .ws-board { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; margin-top: 10px; }
  .region {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md);
    overflow: hidden; transition: border-color 140ms ease;
  }
  .region.drop { border-color: var(--working); box-shadow: 0 0 0 1px var(--working); }
  .region.scratch {
    flex: 0 0 100%; margin-bottom: 14px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .region.scratch .rhead { grid-column: 1 / -1; cursor: default; }
  .rhead {
    padding: 9px 12px; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--line); background: var(--surface-2); cursor: grab;
  }
  .rhead h3 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-size: 13.5px; }
  .rhead .rcount { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rhead .racts { display: inline-flex; align-items: center; gap: 3px; }

  .group { min-width: 0; padding: 0 12px; }
  .group:first-of-type { padding-left: 0; }
  .group:last-of-type { padding-right: 0; }
  .group + .group { border-left: 1px solid var(--line); }
  .group.drop { border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--working); }
  .g-hdr {
    display: flex; align-items: center; gap: 8px; padding: 6px 2px 10px;
  }
  .g-hdr h3 { font-size: 13px; color: var(--text-2); letter-spacing: 0.01em; }
  .g-hdr .rcount { color: var(--muted); font-size: 12px; }
  .cols { display: flex; align-items: flex-start; gap: 12px; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .newzone {
    display: none; margin-bottom: 12px; padding: 12px;
    border: 1px dashed var(--line-strong); border-radius: var(--radius-md);
    color: var(--muted); text-align: center; font-size: 12.5px;
  }
  body.dragging-session .newzone { display: block; }
  .newzone.drop { border-color: var(--working); color: var(--text); background: var(--working-bg); }

  /* Session Card inside Workspace Board (clean dot + subtle tint, full readable title) */
  .session {
    position: relative; display: block; width: 100%; text-align: left;
    padding: 9px 12px; border-bottom: 1px solid var(--line);
    cursor: pointer; transition: background 140ms ease;
  }
  .session:last-child { border-bottom: 0; }
  .session:hover { background: var(--surface-2); }
  .session.waiting { background: rgba(245, 165, 36, 0.045); }
  .session.waiting:hover { background: rgba(245, 165, 36, 0.09); }
  .session.here { background: rgba(96, 165, 250, 0.08); }
  .session.sel { box-shadow: inset 0 0 0 1.5px var(--working); }
  .session.dragging { opacity: 0.4; }
  .session.child { padding-left: 24px; }
  .session.ticked .stitle::before { content: "✓ "; color: var(--done); }
  .session.shell .stitle { color: var(--muted); font-weight: 450; }

  .s-top { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .stitle {
    font-weight: 600; font-size: 13px; color: var(--text); flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .agent-tag {
    font-size: 12px; color: var(--tool); background: var(--tool-bg);
    border-radius: 4px; padding: 0 5px; flex: none;
  }
  .smeta {
    color: var(--muted); font-size: 12px; white-space: nowrap; flex: none;
    font-variant-numeric: tabular-nums;
  }
  .smeta.waiting { color: var(--waiting); font-weight: 600; }
  .smeta.working { color: var(--working); }
  .smeta.done { color: var(--done); }

  /* Compact hover/focus action strip overlaid cleanly on top-right so title keeps full width at rest */
  .sacts {
    position: absolute; top: 6px; right: 8px;
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 4px; border-radius: var(--radius-sm);
    background: var(--surface-2); border: 1px solid var(--line-strong);
    opacity: 0; pointer-events: none; transition: opacity 120ms ease;
  }
  .session:hover .sacts, .session:focus-within .sacts, .sacts.armed { opacity: 1; pointer-events: auto; }
  .sacts button {
    background: none; border: 0; border-radius: 4px; padding: 3px 5px;
    color: var(--text-2); font-size: 12px; line-height: 1;
    display: inline-flex; align-items: center; gap: 3px;
  }
  .sacts button:hover { background: var(--surface-3); color: var(--text); }
  .sacts button.armed { color: var(--danger); font-weight: 600; }

  .recap {
    color: var(--text-2); font-size: 12.5px; line-height: 1.4; margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; overflow-wrap: anywhere; word-break: break-word;
  }
  .recap.ask { color: var(--text); }
  .session:not(.waiting) .recap { color: var(--muted); }

  .rename {
    flex: 1; min-width: 0; background: var(--bg); color: var(--text);
    border: 1px solid var(--working); border-radius: 4px; font: inherit; font-weight: 600; padding: 2px 6px;
  }

  /* Subagent Lane */
  .lane {
    margin: 7px 0 0 2px; border-left: 1px solid var(--line-strong); padding-left: 9px;
    display: flex; flex-direction: column; gap: 4px; cursor: pointer;
  }
  .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sub .s-top { gap: 6px; }
  .sub .what { color: var(--text-2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub .detail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 14px; color: var(--muted); }
  .sub.running .dot { background: var(--working); animation: pulse 1.4s ease-in-out infinite; }
  .sub.done .dot { background: var(--done); }
  .sub.stopped .dot { background: var(--idle); }
  @keyframes pulse { 50% { opacity: 0.35; } }

  /* Goal-Grouped Board */
  .goal-board { display: flex; flex-direction: column; gap: 18px; margin-top: 12px; }
  .goal-sec {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 12px 14px;
  }
  .goal-sec.drop { border-color: var(--working); box-shadow: 0 0 0 1px var(--working); }
  .goal-sec-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;
  }
  .goal-swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--h, var(--idle)); flex: none; }
  .goal-items {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px;
  }
  .wcard {
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;
    transition: border-color 140ms ease, background 140ms ease;
  }
  .wcard.needs { border-color: var(--waiting-line); background: rgba(245, 165, 36, 0.04); }
  .wcard.parked { border-style: dashed; opacity: 0.85; }
  .wcard.drop { border-color: var(--working); box-shadow: 0 0 0 1px var(--working); }
  .wcard-head { display: flex; align-items: center; gap: 7px; cursor: grab; min-width: 0; }
  .wcard-name {
    font-weight: 650; font-size: 13.5px; color: var(--text); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .wcard-next { font-size: 12.5px; line-height: 1.4; color: var(--text-2); overflow-wrap: anywhere; }
  .wcard.needs .wcard-next { color: var(--text); }
  .wcard-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .wcard-tabs { display: flex; flex-direction: column; gap: 3px; padding-top: 4px; border-top: 1px solid var(--line); }
  .wtab-row {
    display: flex; align-items: center; gap: 6px; padding: 3px 5px; border-radius: 4px;
    background: none; border: 0; text-align: left; width: 100%;
  }
  .wtab-row:hover { background: var(--surface-2); }
  .wtab-row .wtab-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
  .wcard-acts { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 2px; }

  /* Collapsible Disclosures (Dormant / Captures) */
  details.fold {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 8px 12px;
  }
  details.fold > summary {
    cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 13px; color: var(--text-2);
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "▸"; color: var(--muted); font-size: 12px; }
  details.fold[open] > summary::before { content: "▾"; }
  details.fold .fold-body { margin-top: 10px; }

  /* Recent Captures */
  .cap-row {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px;
    padding: 6px 4px; border-top: 1px solid var(--line); font-size: 12.5px;
  }
  .cap-row.go { cursor: pointer; border-radius: 4px; }
  .cap-row.go:hover { background: var(--surface-2); }
  .cap-when { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 36px; }
  .cap-note { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .cap-why { color: var(--muted); flex: 1 1 160px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap-row select {
    background: var(--bg); color: var(--text-2); border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm); padding: 3px 6px; font-size: 12px; max-width: 210px;
  }

  /* ---------------- Links View (3-Column Relationship Map, Responsive at 900px) ---------------- */
  .links-wrap { max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .wmap {
    position: relative;
    display: grid;
    grid-template-columns: minmax(210px, 1fr) minmax(260px, 1.35fr) minmax(180px, 0.9fr);
    column-gap: clamp(32px, 5vw, 96px);
    align-items: start;
  }
  .wmap svg.links { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .wmap path { fill: none; opacity: 0.16; transition: opacity 140ms ease; }
  .wmap.focused path { opacity: 0.04; }
  .wmap.focused path.on { opacity: 0.95; }
  .wmap.focused [data-key]:not(.on) { opacity: 0.28; }
  .wmap .pinned { box-shadow: 0 0 0 2px var(--working); }

  .dcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .dhead { font-size: 12.5px; font-weight: 600; color: var(--muted); padding-bottom: 2px; }
  .dbox {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 8px 10px; transition: opacity 140ms ease, border-color 140ms ease;
  }
  .dbox.drop { border-color: var(--working); box-shadow: 0 0 0 1px var(--working); }
  .dtitle { display: flex; gap: 7px; align-items: center; font-weight: 600; margin-bottom: 4px; min-width: 0; }
  .dtitle .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dtitle .cnt { color: var(--muted); font-weight: 450; font-size: 12px; flex: none; }

  .mtab {
    display: flex; gap: 7px; align-items: center; padding: 4px 6px; border-radius: 5px;
    background: none; border: 0; width: 100%; text-align: left;
    transition: background 120ms ease, opacity 120ms ease;
  }
  .mtab:hover { background: var(--surface-2); }
  .mtab .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
  .mtab .meta { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mtab.loose .name { color: var(--muted); font-style: italic; }
  .mtab.waiting .name { color: var(--waiting); font-weight: 600; }

  .mitem, .mgoal {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 8px 10px; transition: opacity 140ms ease, border-color 140ms ease;
  }
  .mitem.needs { border-color: var(--waiting-line); background: rgba(245, 165, 36, 0.045); }
  .mitem.parked { opacity: 0.8; border-style: dashed; }
  .mitem.drop, .mgoal.drop { border-color: var(--working); box-shadow: 0 0 0 1px var(--working); }
  .mitem .dtitle, .mgoal .dtitle { margin: 0; cursor: grab; }
  .mnext { margin-top: 4px; color: var(--text); font-size: 12.5px; line-height: 1.4; overflow-wrap: anywhere; }
  .masked { margin-top: 3px; color: var(--muted); font-size: 12px; }
  .masked b { color: var(--text-2); font-weight: 600; }
  /* Always-present compact action row so hover never shifts vertical layout or detaches SVG lines */
  .macts { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; align-items: center; }
  .outbox { border-style: dashed; color: var(--muted); text-align: center; font-size: 12.5px; padding: 12px; }

  /* Seed Review Diff */
  .wpanel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px; max-width: 1240px; }
  .seedbar {
    position: sticky; top: 60px; z-index: 4; background: var(--surface-2);
    border: 1px solid var(--waiting-line); border-radius: var(--radius-md);
    padding: 12px 14px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
  }
  .diff { position: relative; display: grid; grid-template-columns: minmax(240px, 360px) minmax(300px, 1fr); column-gap: clamp(48px, 8vw, 140px); margin-top: 8px; }
  .diff svg.links { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .diff path { fill: none; stroke-width: 2; opacity: 0.65; transition: opacity 120ms ease; }
  .dtab { display: flex; gap: 7px; align-items: center; padding: 4px 6px; border-radius: 4px; cursor: grab; }
  .dtab:hover { background: var(--surface-2); }
  .dtab .sw { width: 9px; height: 9px; border-radius: 3px; background: var(--h); flex: none; }
  .dtab.gone { color: var(--muted); text-decoration: line-through; }
  .diff.focused .dtab:not(.on), .diff.focused .item2:not(.on) { opacity: 0.25; }
  .diff.focused path { opacity: 0.06; }
  .diff.focused path.on { opacity: 1; stroke-width: 3; }

  /* ---------------- Galaxy View (Clean Uncluttered Spatial Map) ---------------- */
  .galaxy {
    position: relative;
    height: calc(100vh - var(--hh, 53px));
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, #171a27 0%, var(--bg) 72%);
  }
  .gstars { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .gsvg { position: relative; width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
  .gsvg.panning { cursor: grabbing; }
  .nebula, .shade, .corona, .tex, .atmo, .pring, .belt, .flare { pointer-events: none; }
  .nebula { transition: opacity 250ms ease; }

  .orbit { fill: none; stroke: rgba(200, 210, 255, 0.06); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .belt { fill: none; stroke: #9aa0c0; stroke-opacity: 0.25; stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-dasharray: 1 10; stroke-linecap: round; }
  .belt.b1 { stroke-dasharray: 2 15; stroke-opacity: 0.18; }
  .belt.b2 { stroke-dasharray: 1 18; }
  .atmo { fill: none; stroke: #bfe6ff; stroke-opacity: 0.35; stroke-width: 2; vector-effect: non-scaling-stroke; }
  .gplanet:not(.live) .pring { display: none; }
  .pring { fill: none; stroke: hsl(var(--h) 30% 76%); stroke-opacity: 0.55; }

  .sun { fill: #2a2416; stroke: var(--sc, #f5c56b); stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: pointer; filter: drop-shadow(0 0 16px rgba(245, 197, 107, 0.28)); }
  .sun.nogoal { fill: #1c1f2e; stroke: var(--idle); filter: none; }
  .gsys.quiet-sys .sun { opacity: 0.45; filter: none; }
  .gsys.quiet-sys .corona { opacity: 0.2; }
  .gsys:hover .sun, .gsys:focus-visible .sun { stroke-width: 3; }

  .slabel {
    fill: var(--text); font-weight: 650; font-size: calc(14.5px / var(--k, 1)); letter-spacing: 0.01em;
    pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: calc(3.5px / var(--k, 1));
  }
  .scount {
    fill: var(--muted); font-size: calc(12px / var(--k, 1)); pointer-events: none;
    paint-order: stroke; stroke: var(--bg); stroke-width: calc(3px / var(--k, 1));
  }
  .gsys.alert .flare { stroke: var(--waiting); animation: beacon 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .gsys.alert .sun { stroke: var(--waiting); }
  .gsys.alert .scount { fill: var(--waiting); font-weight: 600; }
  .gsvg.insys .gsys:not(.away) .slabel, .gsvg.insys .gsys:not(.away) .scount { display: none; }

  .gplanet { cursor: pointer; }
  .gplanet .body { fill: hsl(var(--h, 240) 16% 42%); stroke: var(--bg); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .gplanet .halo { fill: none; stroke: transparent; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
  .gplanet.live .body { fill: hsl(var(--h, 240) 24% 58%); }
  .gplanet.st-working .body { fill: var(--working); filter: drop-shadow(0 0 6px rgba(96, 165, 250, 0.5)); }
  .gplanet.st-done .body { fill: var(--done); }
  .gplanet.needs .body { fill: var(--waiting); filter: drop-shadow(0 0 7px rgba(245, 165, 36, 0.55)); }
  .gplanet.needs .halo { stroke: var(--waiting); animation: beacon 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes beacon { 0% { opacity: 0.9; transform: scale(0.88); } 100% { opacity: 0; transform: scale(1.55); } }
  .gplanet.dormant:not(.needs) { opacity: 0.55; }
  .gplanet.dormant .body { fill: #555b75; }
  .gplanet:hover .body, .gplanet.pin .body, .gplanet:focus-visible .body { stroke: var(--text); stroke-width: 2.5; }

  /* Fixed label culling: NO !important so gLabelCull() cleanly prevents all collisions */
  .plabel {
    fill: var(--text); font-size: calc(12px / var(--k, 1)); pointer-events: none;
    paint-order: stroke; stroke: var(--bg); stroke-width: calc(3.5px / var(--k, 1));
  }
  .gplanet.needs .plabel { fill: var(--waiting); font-weight: 600; }
  .gsvg.far .plabel { display: none; }
  .gsvg:not(.incity) .gplanet.needs:not(.away) .plabel { display: inline; }
  .gsvg.insys .gplanet:not(.away):not(.dormant) .plabel { display: inline; }
  .gsvg:not(.close):not(.insys) .gplanet:not(.needs):not(.st-working):not(.near):not(.pin):not(.hit) .plabel { display: none; }
  .gplanet.dormant:not(.needs):not(.near):not(.pin) .plabel, .gplanet.dormant .pcount { display: none; }
  .plabel.lhide { visibility: hidden; }
  .gplanet:hover .plabel.lhide, .gplanet.pin .plabel.lhide, .gplanet:focus-visible .plabel.lhide { visibility: visible; display: inline; }

  /* Fixed pcount: scales cleanly with zoom + dark halo stroke for >=10:1 contrast on any fill */
  .pcount {
    fill: var(--text); font-size: calc(11px / var(--k, 1)); font-weight: 700; pointer-events: none;
    paint-order: stroke; stroke: var(--bg); stroke-width: calc(3px / var(--k, 1));
  }
  .gsvg.far .pcount { display: none; }

  .gsvg.insys .gplanet.away, .gsvg.insys .gsys.away, .gsvg.insys .nebula.away, .gsvg.insys .glink.away { opacity: 0.08; }
  .gsvg.insys .gplanet.away .plabel { display: none; }
  .gsvg.incity .gplanet:not(.pin) { opacity: 0.1; }
  .gsvg.incity .ghubs, .gsvg.incity .glinks, .gsvg.incity .gsys { opacity: 0.12; }

  .ghub polygon { fill: #202436; stroke: #9aa0c0; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .ghub.near polygon { stroke: var(--text); fill: #2f3552; }
  .hlabel { fill: var(--text-2); font-size: calc(12px / var(--k, 1)); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: calc(3px / var(--k, 1)); }
  .groad { fill: none; stroke: #7b82a3; stroke-width: 1.2; vector-effect: non-scaling-stroke; stroke-dasharray: 4 4; opacity: 0.45; pointer-events: none; }
  .groad.on { opacity: 1; stroke: #c3c8e6; stroke-width: 2; }
  .groad.hidden, .ghub.hidden, .glink.hidden { display: none; }
  .gsvg.far .ghubs { display: none; }
  .gsvg.focusing .groad:not(.on), .gsvg.focusing .glink:not(.on) { opacity: 0.07; }
  .gsvg.focusing .ghub:not(.near), .gsvg.hubfocus .ghub:not(.near) { opacity: 0.25; }
  .gsvg.focusing .gplanet:not(.near), .gsvg.hubfocus .gplanet:not(.near) { opacity: 0.18; }
  .gsvg.hubfocus .gplanet.near .plabel, .gsvg.focusing:not(.far) .gplanet.near .plabel { display: inline; }

  .glink { fill: none; stroke-width: 1.5; vector-effect: non-scaling-stroke; opacity: 0.5; pointer-events: none; }
  .gsvg.focusing .glink.on { opacity: 1; stroke-width: 2.3; }
  .k-spinoff { stroke: var(--tool); --sw: var(--tool); }
  .k-thread { stroke: #4fd1c5; --sw: #4fd1c5; }
  .k-file { stroke: #cfd4ea; --sw: #cfd4ea; }
  .k-project { stroke: #8087a3; stroke-dasharray: 5 4; --sw: #8087a3; }
  .k-person { stroke: #ff9fb3; stroke-dasharray: 1 4; --sw: #ff9fb3; }
  .garrowhead { fill: var(--tool); }

  .cityring { fill: rgba(96, 165, 250, 0.04); stroke: var(--line-strong); stroke-dasharray: 3 5; vector-effect: non-scaling-stroke; }
  .spoke { stroke: #444b66; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .cityroad { fill: none; stroke: var(--tool); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .gcity .body { fill: #4a506a; stroke: var(--bg); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .gcity .halo { fill: none; stroke: transparent; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
  .gcity.live, .gcity.reopen { cursor: pointer; }
  .gcity.live .body { fill: #9299b5; }
  .gcity.st-working .body { fill: var(--working); }
  .gcity.st-done .body { fill: var(--done); }
  .gcity.st-waiting .body { fill: var(--waiting); }
  .gcity.st-waiting .halo { stroke: var(--waiting); animation: beacon 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .gcity.live:hover .body { stroke: var(--text); }
  .gcity.reopen:hover .body { stroke: var(--text-2); stroke-dasharray: 2 2; }
  .clabel { fill: var(--text); font-size: calc(12px / var(--k, 1)); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: calc(3px / var(--k, 1)); }

  /* Galaxy HUD (clean, non-overlapping, fixed search dropdown) */
  .gcrumbs {
    position: absolute; top: 12px; left: 14px; z-index: 4;
    max-width: calc(100% - 28px);
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    background: rgba(15, 17, 23, 0.9); border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 10px;
  }
  .galaxy.has-panel .gcrumbs { max-width: calc(100% - min(540px, 46vw) - 28px); }
  .gcrumbs .crumb-link { background: none; border: 0; color: var(--working); padding: 1px 3px; border-radius: 4px; }
  .gcrumbs .crumb-link:hover { background: var(--surface-2); }
  .gcrumbs .cur { color: var(--text); font-weight: 600; }
  .gcrumbs .sep { color: var(--muted); }
  .gcrumbs .gcount { color: var(--muted); font-size: 12px; }
  .gcrumbs .gcount.alert { color: var(--waiting); font-weight: 600; }

  .gdock {
    display: inline-flex; gap: 6px; align-items: center; padding: 1px 6px 1px 8px;
    border: 1px solid var(--working); border-radius: 5px; color: var(--text); font-size: 12px;
  }
  .gdock button { background: none; border: 0; color: var(--working); padding: 1px 4px; font-weight: 600; }

  /* Fixed search box: dropdown is position:absolute so input NEVER shifts */
  .gsearch {
    position: absolute; top: 56px; left: 14px; z-index: 5;
    display: flex; align-items: center; gap: 8px;
  }
  .gsearch input {
    width: 260px; background: rgba(15, 17, 23, 0.92); border: 1px solid var(--line-strong);
    border-radius: 8px; color: var(--text); padding: 6px 10px; font-size: 12.5px;
  }
  .gsearch input:focus { border-color: var(--working); }
  .gscount {
    color: var(--muted); font-size: 12px; background: rgba(15, 17, 23, 0.85);
    border-radius: 5px; padding: 2px 7px; white-space: nowrap;
  }
  .gscount:empty { display: none; }
  .gslist {
    position: absolute; top: calc(100% + 6px); left: 0;
    width: min(380px, calc(100vw - 32px)); max-height: min(50vh, 420px);
    overflow-y: auto; background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 8px; box-shadow: var(--shadow-pop); padding: 4px;
  }
  .gslist[hidden] { display: none; }
  .gsrow {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    border-radius: 6px; color: var(--text); padding: 7px 9px;
  }
  .gsrow:hover, .gsrow.sel { background: var(--surface-3); }
  .gsr-top { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
  .gsr-top b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gsr-goal { color: var(--muted); font-size: 12px; }
  .gsr-snip { color: var(--text-2); font-size: 12px; line-height: 1.4; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .gsr-snip mark, .gbubble mark { background: rgba(96, 165, 250, 0.35); color: var(--text); border-radius: 2px; padding: 0 2px; }

  /* Optional collapsible Needs-You drawer in Galaxy (starts closed) */
  .gneeds-drawer {
    position: absolute; top: 98px; left: 14px; z-index: 4;
    width: min(360px, calc(100vw - 28px)); max-height: calc(100% - 156px);
    overflow-y: auto; background: rgba(22, 25, 35, 0.96);
    border: 1px solid var(--line-strong); border-radius: var(--radius-md);
    box-shadow: var(--shadow-pop); padding: 8px 0;
  }
  .gneeds-drawer[hidden] { display: none; }
  .gneeds-head { display: flex; align-items: center; justify-content: space-between; padding: 0 12px 6px; border-bottom: 1px solid var(--line); }
  .gnrow { padding: 7px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .gnrow:last-child { border-bottom: 0; }
  .gnrow:hover { background: var(--surface-2); }
  .gntop { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .gntop b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .gnask { font-size: 12px; line-height: 1.4; color: var(--text-2); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .gbubbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
  .gbubble {
    position: absolute; left: 0; top: 0; max-width: 210px; pointer-events: auto; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 5px 8px; font-size: 12px; line-height: 1.4; box-shadow: var(--shadow-pop); opacity: 0.94;
  }
  .gbubble.crowded { visibility: hidden; }
  .gbubble .gbline { display: none; }
  .gbubble:hover { z-index: 3; opacity: 1; max-width: 300px; }
  .gbubble:hover .gbline { display: block; }
  .gbubble b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gsvg.searching .gplanet:not(.hit):not(.near):not(.needs) { opacity: 0.14; }
  .gsvg.searching .gplanet.hit .halo { stroke: #ffffff; }

  .glegend {
    position: absolute; left: 14px; bottom: 14px; z-index: 4;
    display: flex; flex-direction: column; gap: 5px;
    background: rgba(15, 17, 23, 0.92); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 11px; color: var(--text-2); max-width: 360px; font-size: 12px;
  }
  .glegend:not(.open) > :not(.glhead) { display: none; }
  .glegend .glhead { background: none; border: 0; color: var(--text-2); text-align: left; padding: 0; font-weight: 600; font-size: 12.5px; }
  .glegend .glhead::before { content: "▸ "; color: var(--muted); }
  .glegend.open .glhead::before { content: "▾ "; }
  .glegend label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .glegend .swatch { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--sw); }
  .glegend .k-project .swatch, .glegend .k-person .swatch { border-top-style: dashed; }
  .glegend hr { border: 0; border-top: 1px solid var(--line); width: 100%; margin: 2px 0; }
  .gshapes text { fill: var(--text-2); font-size: 12px; }

  .gmini {
    position: absolute; bottom: 14px; right: 14px; z-index: 4;
    width: 186px; height: 124px; background: rgba(15, 17, 23, 0.9);
    border: 1px solid var(--line); border-radius: 8px; padding: 4px;
    cursor: crosshair; opacity: 0; pointer-events: none; transition: opacity 180ms ease;
  }
  .gmini.on { opacity: 1; pointer-events: auto; }
  .gmini svg { width: 100%; height: 100%; display: block; }
  .gmini .msun { fill: rgba(200, 210, 255, 0.04); stroke: rgba(200, 210, 255, 0.24); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .gmini .mdot { fill: #7c84a2; }
  .gmini .mdot.working { fill: var(--working); }
  .gmini .mdot.needs { fill: var(--waiting); animation: pulse 1.4s ease-in-out infinite; }
  .gmini .mview { fill: rgba(255, 255, 255, 0.08); stroke: var(--text); stroke-width: 1.5; vector-effect: non-scaling-stroke; }

  .gtip {
    position: absolute; z-index: 6; max-width: 330px;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 8px 11px; pointer-events: none; display: flex; flex-direction: column; gap: 4px;
    box-shadow: var(--shadow-pop); font-size: 12.5px; line-height: 1.4;
  }
  .gtip[hidden] { display: none; }
  .gtip .gtiphit { color: var(--waiting); }

  /* Galaxy Item Detail Panel */
  #gplanet {
    position: fixed; top: var(--hh, 53px); right: 0; bottom: 0;
    width: min(540px, 46vw); background: var(--surface);
    border-left: 1px solid var(--line); overflow-y: auto;
    padding: 16px 18px 40px; z-index: 15; box-shadow: var(--shadow-drawer);
  }
  #gplanet[hidden], #gplanet.tucked { display: none; }
  .gp-head { display: flex; align-items: center; gap: 10px; }

  .chip {

  .chip.st-waiting { color: var(--waiting); border-color: var(--waiting-line); background: var(--waiting-bg); }
  .chip.st-working { color: var(--working); border-color: rgba(96, 165, 250, 0.35); background: var(--working-bg); }

  /* Galaxy History Timeline SVG */

  .grtick { stroke: var(--text); stroke-width: 1; opacity: 0.6; }

  /* ---------------- Universal Session Sheet (Reply + 5-Tab Diagnostics) ---------------- */
  .modal-scrim {

  .sheet {

  .sheet-sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px; margin-top: 2px; flex-wrap: wrap; }
  .sheet-acts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .sheet-tabs {

  }

  .sheet-body {

  /* Reply Tab */

  .peek-msg {
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-md);

  }
  .md > * { margin: 0 0 11px; max-width: 74ch; }

  .md > :last-child { margin-bottom: 0; }

  .md blockquote { border-left: 2px solid var(--line-strong); padding-left: 12px; color: var(--text-2); margin-left: 0; }
  .md .tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }

  .md th { background: var(--surface-2); text-align: left; font-weight: 600; white-space: nowrap; }
  .md th, .md td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }

  .composer {
    border-top: 1px solid var(--line); padding: 12px 16px; background: var(--surface-2);
    display: flex; flex-direction: column; gap: 8px;
  }
  .composer textarea {
    width: 100%; resize: vertical; min-height: 64px;
    background: var(--bg); color: var(--text); border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; line-height: 1.45;
  }

  /* Diagnostics Tabs inside Sheet */
  .tl-prompt { color: var(--text-2); font-size: 13px; line-height: 1.45; }
  .tl-sum { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; }
  .tl-sum .k { color: var(--muted); }
  .tl-slow { margin: 0; padding: 0; list-style: none; }
  .tl-slow li { display: flex; gap: 10px; padding: 3px 0; font-size: 12.5px; }
  .tl-slow .d { width: 56px; text-align: right; font-weight: 600; }
  .tl-slow .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-slow .w { color: var(--muted); white-space: nowrap; max-width: 38%; overflow: hidden; text-overflow: ellipsis; }
  .tl-grid { display: grid; grid-template-columns: 200px 1fr; row-gap: 7px; align-items: center; }
  .tl-name { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; }
  .tl-name b { color: var(--text); font-weight: 600; }
  .tl-track { position: relative; height: 16px; background: var(--bg); border-radius: 3px; }
  .tl-axis { position: relative; height: 18px; font-size: 12px; color: var(--muted); }
  .tl-axis span { position: absolute; transform: translateX(-50%); }
  .tl-axis span:first-child { transform: none; }
  .seg { position: absolute; top: 2px; bottom: 2px; min-width: 2px; border-radius: 2px; }
  .seg.model { background: var(--working); }
  .seg.tool { background: var(--tool); top: 0; bottom: 0; }
  .seg.you { background: var(--waiting); opacity: 0.65; }
  .seg.agents { background: rgba(128, 135, 163, 0.22); border: 1px dashed var(--idle); }
  .seg.open { animation: pulse 1.4s ease-in-out infinite; }
  .tl-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 12px; }
  .tl-legend i { display: inline-block; width: 16px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

  .tl-scope { display: flex; gap: 6px; }
  .wf { display: grid; grid-template-columns: minmax(200px, 34%) 1fr 58px 96px 64px; column-gap: 8px; row-gap: 3px; align-items: center; }
  .wf-h { font-size: 12px; color: var(--muted); font-weight: 600; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .wf-h.r, .wf .r { text-align: right; }
  .wf-row { display: contents; cursor: pointer; }
  .wf-row:hover > div { background: rgba(255, 255, 255, 0.04); }
  .wf-name { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 3px 0; }
  .wf-name .caret { display: inline-block; width: 13px; color: var(--muted); }
  .wf-name .k { color: var(--muted); }
  .wf-name.agent { font-weight: 600; }
  .wf-num { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .wf-bar { position: relative; height: 14px; }
  .wf-bar i { position: absolute; top: 3px; bottom: 3px; min-width: 2px; border-radius: 2px; }
  .wf-bar i.llm { background: var(--working); }
  .wf-bar i.tool { background: var(--tool); }

  .at { list-style: none; margin: 0; padding: 0; }

  .at-card { display: grid; grid-template-columns: 16px 1fr auto; gap: 3px 8px; align-items: baseline; padding: 8px 10px; margin: 5px 0; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .at-card .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .at-card .c { font-weight: 600; white-space: nowrap; }
  .at-card .m { grid-column: 2 / -1; color: var(--muted); font-size: 12px; }

  .cm-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
  .cm-head select { background: var(--bg); color: var(--text); border: 1px solid var(--line-strong); border-radius: 6px; padding: 3px 8px; max-width: 320px; }
  .cm-meter { height: 7px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .cm-meter i { display: block; height: 100%; background: var(--working); }
  .cm-map { position: relative; height: 420px; }
  .cm-cat { position: absolute; border: 1px solid var(--surface); overflow: hidden; }

  .cm-item span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cm-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-2); }
  .cm-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

  .ho { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .ho-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .ho-badge { font-size: 12px; color: var(--text-2); border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .ho details { margin-top: 6px; }

  .ho pre { margin: 5px 0 0; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 12px/1.45 var(--font-mono); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .chip.lost { border-style: dashed; border-color: var(--danger); color: var(--danger); text-decoration: line-through; }
  .chip.src { color: var(--working); border-color: rgba(96, 165, 250, 0.4); }

  /* ---------------- Global Command / Search Palette & Inbox & Help Modal ---------------- */
  .palette {
    width: min(720px, 100%); max-height: calc(100vh - 80px);
    display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); overflow: hidden;
  }
  .pal-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }

  .pal-list { overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .pal-row {
    display: flex; flex-direction: column; gap: 2px; text-align: left; width: 100%;
    background: none; border: 0; border-radius: 6px; padding: 8px 10px;

  .pal-row:hover, .pal-row.sel { background: var(--surface-3); }

  .pal-row-sub { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .ib { width: min(860px, 100%); max-height: calc(100vh - 64px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-pop); }

  .ib-row { border-top: 1px solid var(--line); padding: 9px 4px; }
  .ib-row:first-child { border-top: 0; }

  .ib-top-btn:hover { background: var(--surface-2); }
  .ib-top-btn b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ib-top-btn .meta { color: var(--muted); font-size: 12px; white-space: nowrap; margin-left: auto; font-variant-numeric: tabular-nums; }
  .ib-line { color: var(--text-2); font-size: 12.5px; line-height: 1.4; margin: 3px 0 0 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .ib-row.waiting .ib-line { color: var(--text); }
  .ib-steps { list-style: none; margin: 8px 0 0 18px; padding: 0; font-size: 12px; }
  .ib-steps li { display: flex; gap: 8px; padding: 2px 0; color: var(--muted); }

  .ib-acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px 18px; }

  /* Shortcuts Help Grid */
  .help-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding: 14px 16px; overflow-y: auto; }
  .help-sec h3 { margin-bottom: 8px; color: var(--text); }
  .help-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }

  .float-bar {

    max-width: 960px; margin: 0 auto;
    background: var(--surface-2); border: 1px solid var(--working);
    border-radius: var(--radius-md); padding: 12px 14px; box-shadow: var(--shadow-pop);

  }
  .float-bar textarea { width: 100%; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 9px; }

  /* Live Toast Region */
  #toasts {
    position: fixed; right: 16px; bottom: 16px; z-index: 40;
    display: flex; flex-direction: column; gap: 8px; max-width: 420px; pointer-events: none;

  .err-banner { padding: 16px; color: var(--danger); background: var(--danger-bg); border: 1px solid var(--danger); border-radius: var(--radius-md); }

  .action-pill {
    display: inline-block; padding: 2px 8px; border-radius: 5px;

  @media (max-width: 960px) {
    header { padding: 7px 10px; gap: 6px 8px; flex-wrap: nowrap; }
    h1 { font-size: 17px; }
    .tally { gap: 8px; font-size: 12px; }
    .tally .stat-live { display: none; }

    }
