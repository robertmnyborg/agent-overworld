  const W = Math.max(260, (peekEl.clientWidth || 460) - 42), LBL = W < 380 ? 114 : 146, PAD = 12, ROW = 28, H = S.length * ROW + 28;
  const trackW = Math.max(80, W - LBL - PAD * 2);
  const x = t => LBL + PAD + ((t - t0) / Math.max(1, t1 - t0)) * trackW;
  const svg = svgEl("svg", { class: "ghist", width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  const days = Math.max(1, (t1 - t0) / 86400);
  const maxTicks = Math.max(2, Math.floor(trackW / 72)), step = Math.max(1, Math.ceil(days / maxTicks));
  const d0 = new Date(t0 * 1000); d0.setHours(0, 0, 0, 0);
  let lastTickX = -999;
  for (let t = d0.getTime() / 1000 + 86400; t < t1; t += 86400 * step) {
    const px = x(t);
    if (px - lastTickX < 58 || px > W - 26) continue;
    lastTickX = px;
    svg.append(svgEl("line", { class: "gday", x1: px, x2: px, y1: 0, y2: H - 18 }));
    const tx = svgEl("text", { class: "gdaylabel", x: px, y: H - 3, "text-anchor": "middle" });
    tx.textContent = new Date(t * 1000).toLocaleDateString([], { month: "short", day: "numeric" }); svg.append(tx);
  }
  const rowOf = Object.fromEntries(S.map((s, i) => [s.transcript, i]));
  const maxChars = W < 380 ? 15 : 19;
  S.forEach((s, i) => {
    const y = i * ROW + 14, g = svgEl("g", { class: "grow" + (s.live ? " live st-" + s.status : "") });
    const label = svgEl("text", { class: "grlabel", x: 2, y: y + 4 });
    label.textContent = s.title.length > maxChars ? s.title.slice(0, maxChars - 1) + "…" : s.title;
    g.append(label);
    const xa = x(s.first), xb = Math.max(xa + 3, x(s.live ? now : s.last));
    g.append(svgEl("rect", { class: "grbar", x: xa, y: y - 5, width: xb - xa, height: 10, rx: 5 }));
    (s.prompts || []).forEach(t => g.append(svgEl("line", { class: "grtick", x1: x(t), x2: x(t), y1: y - 6, y2: y + 6 })));
    if (s.subagents && xb + 28 < W) { const a = svgEl("text", { class: "grsub", x: xb + 6, y: y + 4 }); a.textContent = `+${s.subagents}`; g.append(a); }
    if (s.live) {
      g.setAttribute("tabindex", "0"); g.setAttribute("role", "button");
      g.onclick = () => openSessionPeek(s.live, "overview");
    }
    svg.append(g);
    if (s.parent && s.parent in rowOf) {
      const py = rowOf[s.parent] * ROW + 14;
      svg.append(svgEl("path", { class: "grspin", d: `M${xa},${py + 6} C${xa},${(py + y) / 2} ${xa},${(py + y) / 2} ${xa + 2},${y - 6}`, "marker-end": "url(#garrow)" }));
    }
  });
  const wrap = el("div", "ghistwrap");
  wrap.append(svg);
  return wrap;
}

function renderGalaxy(state) {
  map.classList.add("no-scroll");
  galaxyFetch(false);
  if (!G.data) { map.replaceChildren(el("div", "spaces-wrap", "Mapping the galaxy...")); return; }
  const live = Object.fromEntries((state.work ? state.work.items : []).map(i => [i.id, i]));
  G.data.planets.forEach(p => { const v = live[p.id]; if (v) Object.assign(p, { status: v.status, needs: v.needs, next: v.next, tabs: v.tabs }); });
  if (!G.wrap || !map.contains(G.wrap)) {
    if (!G.wrap) gBuild();
    map.replaceChildren(G.wrap);
    if (!G.cam) { if (G.sys != null && G.suns[G.sys]) gFitSystem(G.sys, false); else gFitAll(false); }
    gApply();
  }
  if (G.pendingFit && G.wrap.clientWidth >= 200) gFit(G.pendingFit[0], G.pendingFit[1], false);
  G.data.planets.forEach(gStatusPatch);
  gSunPatch();
  gRefreshCrumbs();
  if (G.planet && G.detail && !G.single && G.cityLayer && !G.cityLayer.childNodes.length) gDrawCities();
  gFocus(G.pinned || G.planet);
}

window.addEventListener("mousemove", e => {
  if (!G.drag) return;
  const dx = e.clientX - G.drag.x, dy = e.clientY - G.drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { G.moved = true; G.svg.classList.add("panning"); }
  if (G.moved) { G.cam.x = G.drag.cx + dx; G.cam.y = G.drag.cy + dy; gApply(); }
  const d = G.drag, now = performance.now(), dt = Math.max(1, now - d.pt);
  d.vx = 0.7 * d.vx + 0.3 * ((e.clientX - d.px) / dt); d.vy = 0.7 * d.vy + 0.3 * ((e.clientY - d.py) / dt);
  d.px = e.clientX; d.py = e.clientY; d.pt = now;
});
window.addEventListener("mouseup", () => {
  if (!G.drag) return;
  if (G.moved && performance.now() - G.drag.pt < 80) gGlide(G.drag.vx, G.drag.vy);
  G.drag = null; if (G.svg) G.svg.classList.remove("panning"); setTimeout(() => (G.moved = false), 0);
});

/* ---------------- TAB 2: SPACES (Bird's-Eye Map with Diffed DOM Patching) ---------------- */
const COL_MIN = 310, GAP = 12;

function renderSpaces(state) {
  map.classList.remove("no-scroll");
  if (spacesMode === "workspace") {
    const regions = state.regions.map(r => {
      const sessions = r.sessions.filter(t => showShells || effectiveStatus(t) !== "shell");
      const rank = Math.min(...sessions.map(t => ORDER[effectiveStatus(t)] ?? 9), 9);
      return { ...r, sessions, rank };
    }).filter(r => r.sessions.length || r.scratch).sort((a, b) => a.rank - b.rank);

    // Structural signature: if identical, patch every town in place without rebuilding DOM!
    const sig = JSON.stringify([
      spacesMode, spotlight, showShells, armed, naming, ticked.size, !!pendingMerge,
      (state.groups || []).map(g => [g.id, g.name]),
      regions.map(r => [r.id, r.title, r.group, r.scratch, r.sessions.map(t => t.id)]),
      Math.floor((map.clientWidth || innerWidth) / 140)
    ]);
    if (sig === spacesSig && map.querySelector(".spaces-wrap")) {
      patchSpacesWorkspaceInPlace(regions);
      return;
    }
    spacesSig = sig;
    const keepScroll = map.scrollTop;
    const wrap = el("div", "spaces-wrap");
    wrap.append(buildSpacesBar(state), buildWorkspaceBoard(state, regions));
    if (ticked.size) wrap.append(buildTickBanner());
    if (pendingMerge) wrap.append(mergeBar());
    map.replaceChildren(wrap);
    map.scrollTop = keepScroll;
    return;
  }

  // Goal or Wiring sub-modes
  const keepScroll = map.scrollTop;
  const wrap = el("div", "spaces-wrap");
  wrap.append(buildSpacesBar(state));
  if (spacesMode === "goal") wrap.append(buildGoalBoard(state));
  else wrap.append(buildWiringBoard(state));
  if (ticked.size) wrap.append(buildTickBanner());
  if (pendingMerge) wrap.append(mergeBar());
  map.replaceChildren(wrap);
  map.scrollTop = keepScroll;
  if (spacesMode === "wiring") {
    const wm = wrap.querySelector(".wmap");
    if (wm) requestAnimationFrame(() => drawMap(wm));
  }
}

function patchSpacesWorkspaceInPlace(regions) {
  regions.forEach(r => {
    const box = map.querySelector(`.region[data-region-id="${CSS.escape(r.id)}"]`);
    if (box) {
      const hasNeed = r.sessions.some(t => effectiveStatus(t) === "waiting");
      box.classList.toggle("dimmed", spotlight && !hasNeed && !r.scratch);
    }
    r.sessions.forEach(t => {
      const row = map.querySelector(`.town[data-town-id="${CSS.escape(t.id)}"]`);
      if (!row) return;
      const st = effectiveStatus(t);
      const isChild = row.classList.contains("child");
      const dim = spotlight && st !== "waiting";
      row.className = "town " + st + (isChild ? " child" : "") + (sel === t.id ? " sel" : "")
        + (PEEK.kind === "session" && PEEK.sessionId === t.id ? " on" : "")
        + (ticked.has(t.id) ? " ticked" : "") + (dim ? " dimmed" : "");
      const dot = row.querySelector(":scope > .town-top > .dot");
      if (dot) dot.className = "dot " + st;
      const titleEl = row.querySelector(":scope > .town-top > .town-title");
      const nextTitle = (isChild ? "↳ " : "") + t.title;
      if (titleEl && titleEl.textContent !== nextTitle) titleEl.textContent = nextTitle;
      const ageEl = row.querySelector(":scope > .town-top > .town-age");
      const bg = (t.subagents || []).filter(a => a.status === "running").length;
      const nextAge = [ago(t.since || (t.updated ? new Date(t.updated * 1000).toISOString() : null)), bg ? `+${bg}` : ""].filter(Boolean).join(" · ");
      if (ageEl && ageEl.textContent !== nextAge) ageEl.textContent = nextAge;
      const askEl = row.querySelector(":scope > .town-ask");
      const nextAsk = (st === "waiting" ? askTextOf(t) : t.recap) || "";
      if (askEl && askEl.textContent !== nextAsk) askEl.textContent = nextAsk;
      const subSig = JSON.stringify(t.subagents || []);
      if (row.dataset.subSig !== subSig) {
        row.dataset.subSig = subSig;
        const oldLane = row.querySelector(":scope > .lane");
        if (oldLane) oldLane.remove();
        if ((t.subagents || []).length) row.append(makeSubLane(t));
      }
    });
  });
}

function buildSpacesBar(state) {
  const bar = el("div", "spaces-bar");
  const modePill = el("div", "spot-pill");
  modePill.setAttribute("role", "tablist");
  modePill.setAttribute("aria-label", "Spaces layout");
  [["workspace", "By workspace"], ["goal", "By goal"], ["wiring", "Wiring"]].forEach(([k, lbl]) => {
    const b = el("button", spacesMode === k ? "on" : "", lbl);
    b.setAttribute("role", "tab"); b.setAttribute("aria-selected", String(spacesMode === k));
    b.onclick = () => { spacesMode = k; remember("ow.spacesMode", k); invalidateViews(); render(last); };
    modePill.append(b);
  });
  bar.append(modePill);

  const right = el("div", "right");
  if (spacesMode === "workspace") {
    const shLab = el("label", "chk-label");
    const shCb = el("input"); shCb.type = "checkbox"; shCb.checked = showShells;
    shCb.onchange = () => { showShells = shCb.checked; remember("ow.shells", showShells ? "1" : "0"); invalidateViews(); render(last); };
    shLab.append(shCb, document.createTextNode("Show shells"));
    right.append(shLab);

    const newGrp = el("button", "btn ghost sm", ""); newGrp.append(icon("plus"), document.createTextNode("New group"));
    newGrp.onclick = () => post("/api/new-group", {}, "Created new workspace group");
    right.append(newGrp);

    const autoBtn = el("button", "btn ghost sm" + (armed === "autoname-all" ? " armed" : ""), "");
    autoBtn.append(icon("sparkle"), document.createTextNode(naming === "all" ? "Naming..." : armed === "autoname-all" ? "Rename all?" : "Auto-name"));
    autoBtn.disabled = !!naming;
    autoBtn.onclick = () => armAction("autoname-all", () => autoname());
    right.append(autoBtn);
  } else if (state.work && state.work.seeded) {
    if (spacesMode === "wiring") {
      const inactiveCount = state.work.items.filter(i => i.state !== "done" && !i.needs && !i.tabs.length).length;
      if (inactiveCount > 0) {
        const tog = el("button", "btn ghost sm", linksShowInactive ? "Hide dormant" : `Show dormant (${inactiveCount})`);
        tog.onclick = () => { linksShowInactive = !linksShowInactive; remember("ow.linksInactive", linksShowInactive ? "1" : "0"); invalidateViews(); render(last); };
        right.append(tog);
      }
    }
    const reg = el("button", "btn ghost sm" + (armed === "regroup-goals" ? " armed" : ""), groupBusy ? "Grouping..." : armed === "regroup-goals" ? "Overwrite goals?" : "Regroup by goal");
    reg.disabled = groupBusy;
    reg.onclick = () => armAction("regroup-goals", proposeGroups);
    right.append(reg);
  }
  bar.append(right);
  return bar;
}

function buildWorkspaceBoard(state, regions) {
  const frag = document.createDocumentFragment();
  const parentOf = Object.fromEntries((state.edges || []).map(e => [e.child, e.parent]));

  const makeBox = r => {
    const hasNeed = r.sessions.some(t => effectiveStatus(t) === "waiting");
    const box = el("section", "region" + (r.scratch ? " scratch" : "") + (spotlight && !hasNeed && !r.scratch ? " dimmed" : ""));
    box.dataset.regionId = r.id;
    box.dataset.group = r.scratch ? "scratch" : r.group || "";

    const h = el("div", "rhead");
    h.draggable = !r.scratch;
    h.ondragstart = e => { draggingRegion = r; e.dataTransfer.setData("text/plain", r.id); box.classList.add("dragging"); };
    h.ondragend = () => { draggingRegion = null; box.classList.remove("dragging"); document.querySelectorAll(".drop").forEach(g => g.classList.remove("drop")); };

    const nameEl = el("h3", "", r.title); nameEl.title = r.title;
    h.append(nameEl);
    if (r.scratch) {
      h.append(el("span", "rcount", "One-off sessions · drag to a group to promote"));
    } else {
      const racts = el("div", "racts" + (armed === "auto:" + r.id ? " armed" : ""));
      const ren = el("button", "btn icon sm", ""); ren.setAttribute("aria-label", `Rename ${r.title}`); ren.title = "Rename"; ren.append(icon("edit"));
      ren.onclick = e => { e.stopPropagation(); startRename(nameEl, r.title, title => post("/api/rename", { workspace: r.id, title })); };
      const autoKey = "auto:" + r.id;
      const auto = el("button", "btn icon sm" + (armed === autoKey ? " armed" : ""), armed === autoKey ? "Name?" : "");
      if (armed !== autoKey) auto.append(icon("sparkle"));
      auto.setAttribute("aria-label", `Auto-name ${r.title}`); auto.title = "Auto-name (2 clicks)"; auto.disabled = !!naming;
      auto.onclick = e => { e.stopPropagation(); armAction(autoKey, () => autoname(r.id)); };
      const addBtn = el("button", "btn icon sm", ""); addBtn.setAttribute("aria-label", `New session in ${r.title}`); addBtn.title = "New Claude session"; addBtn.append(icon("plus"));
      addBtn.onclick = e => { e.stopPropagation(); post("/api/new", { workspace: r.id }, `Started new session in ${r.title}`); };
      racts.append(ren, auto, addBtn);
      h.append(racts);
    }
    h.append(el("span", "rcount", String(r.sessions.length)));
    if (r.scratch) {
      const addBtn = el("button", "btn icon sm", ""); addBtn.setAttribute("aria-label", "New session in Scratch"); addBtn.append(icon("plus"));
      addBtn.onclick = () => post("/api/new", { workspace: r.id }, "Started new session in Scratch");
      h.append(addBtn);
    }
    box.append(h);

    box.ondragover = e => { if (!dragging) return; e.stopPropagation(); if (dragging.workspace !== r.id) { e.preventDefault(); box.classList.add("drop"); } };
    box.ondragleave = e => { if (!box.contains(e.relatedTarget)) box.classList.remove("drop"); };
    box.ondrop = e => { if (!dragging) return; e.preventDefault(); e.stopPropagation(); if (dragging.workspace === r.id) return; box.classList.remove("drop"); post("/api/move", { workspace: r.id, surface: dragging.id }); };

    const listHost = r.scratch ? el("div", "scratch-grid") : box;
    const ids = new Set(r.sessions.map(t => t.id));
    const byRank = [...r.sessions].sort((a, b) => (ORDER[effectiveStatus(a)] ?? 9) - (ORDER[effectiveStatus(b)] ?? 9) || (Date.parse(b.since || 0) - Date.parse(a.since || 0)));
    const roots = byRank.filter(t => !ids.has(parentOf[t.id]));
    const addTree = (t, depth) => {
      listHost.append(buildTownRow(t, depth > 0));
      byRank.filter(c => parentOf[c.id] === t.id).forEach(c => addTree(c, depth + 1));
    };
    roots.forEach(t => addTree(t, 0));
    if (r.scratch) box.append(listHost);
    return box;
  };

  const boxes = regions.map(makeBox);
  const scratch = boxes.find(b => b.dataset.group === "scratch");
  if (scratch) frag.append(scratch);

  const groupsWrap = el("div", "ws-groups");
  const groups = [...(state.groups || []), { id: "", name: "Ungrouped" }]
    .map(g => ({ g, mine: boxes.filter(b => b.dataset.group === g.id) }))
    .filter(x => x.g.id || x.mine.length);

  const availW = Math.max(320, (map.clientWidth || innerWidth) - 44);
  const totalCols = Math.max(1, Math.floor((availW + GAP) / (COL_MIN + GAP)));
  groups.forEach(x => { x.n = 1; });
  for (let spare = totalCols - groups.length; spare > 0; spare--) {
    const open = groups.filter(x => x.n < x.mine.length);
    if (!open.length) break;
    open.reduce((a, b) => (b.mine.length / b.n > a.mine.length / a.n ? b : a)).n++;
  }

  groups.forEach(({ g, mine, n }) => {
    const sec = el("section", "group");
    sec.style.flex = String(n);
    const gh = el("div", "g-hdr");
    const gname = el("h3", "", g.name);
    gh.append(gname, el("span", "rcount", String(mine.length)));
    const gacts = el("div", "gacts" + (armed === "delgrp:" + g.id ? " armed" : ""));
    if (g.id) {
      const ren = el("button", "btn icon sm", ""); ren.setAttribute("aria-label", `Rename group ${g.name}`); ren.append(icon("edit"));
      ren.onclick = () => startRename(gname, g.name, name => post("/api/rename-group", { group: g.id, name }));
      gacts.append(ren);
    }
    const plus = el("button", "btn icon sm", ""); plus.setAttribute("aria-label", `New workspace in ${g.name}`); plus.append(icon("plus"));
    plus.onclick = () => post("/api/new-workspace", { group: g.id || null }, `Created workspace in ${g.name}`);
    gacts.append(plus);
    if (g.id) {
      const del = el("button", "btn icon sm" + (armed === "delgrp:" + g.id ? " armed" : ""), armed === "delgrp:" + g.id ? "Delete?" : "");
      if (armed !== "delgrp:" + g.id) del.append(icon("close"));
      del.setAttribute("aria-label", `Delete group ${g.name}`);
      del.onclick = () => armAction("delgrp:" + g.id, () => post("/api/delete-group", { group: g.id }, `Removed group ${g.name}`));
      gacts.append(del);
    }
    gh.append(gacts);

    const zone = el("div", "newzone", "Drop a session here to give it its own workspace");
    const canSplit = () => { const src = last.regions.find(r => r.id === dragging.workspace); return !(src && src.sessions.length === 1 && (src.group || "") === g.id); };
    const doSplit = () => post("/api/split", { surface: dragging.id, workspace: dragging.workspace, title: dragging.title, group: g.id || null });
    zone.ondragover = e => { if (dragging && canSplit()) { e.preventDefault(); e.stopPropagation(); zone.classList.add("drop"); } };
    zone.ondragleave = () => zone.classList.remove("drop");
    zone.ondrop = e => { if (!dragging) return; e.preventDefault(); e.stopPropagation(); zone.classList.remove("drop"); sec.classList.remove("drop"); doSplit(); };

    const cols = el("div", "cols");
    const colEls = Array.from({ length: n }, () => el("div", "col"));
    mine.forEach((box, idx) => colEls[idx % n].append(box));
    cols.append(...colEls);
    sec.append(gh, zone, cols);

    sec.ondragover = e => { if ((draggingRegion && (draggingRegion.group || "") !== g.id) || (dragging && canSplit())) { e.preventDefault(); sec.classList.add("drop"); } };
    sec.ondragleave = e => { if (!sec.contains(e.relatedTarget)) sec.classList.remove("drop"); };
    sec.ondrop = e => {
      e.preventDefault(); sec.classList.remove("drop");
      if (draggingRegion) post("/api/group", { workspace: draggingRegion.id, group: g.id || null });
      else if (dragging) doSplit();
    };
    groupsWrap.append(sec);
  });

  frag.append(groupsWrap);
  return frag;
}

function makeSubLane(t) {
  const lane = el("div", "lane");
  lane.tabIndex = 0; lane.setAttribute("role", "button");
  lane.setAttribute("aria-label", `Inspect ${t.subagents.length} subagents`);
  t.subagents.forEach(a => {
    const row = el("div", "sub " + a.status), top = el("div", "town-top");
    const end = a.status === "running" ? new Date().toISOString() : a.ended;
    top.append(el("span", "dot"), el("span", "what", `${a.type} · ${a.label}`), el("span", "", [a.status, spanBetween(a.started, end)].filter(Boolean).join(" · ")));
    row.append(top);
    if (a.detail) row.append(el("div", "detail", a.detail));
    lane.append(row);
  });
  if (t.subagents_more) lane.append(el("div", "sub", `+${t.subagents_more} more`));
  lane.onclick = e => { e.stopPropagation(); openSessionPeek(t.id, "timeline"); };
  return lane;
}

function buildTownRow(t, isChild) {
  const st = effectiveStatus(t);
  const dim = spotlight && st !== "waiting";
  const b = el("div", "town " + st + (isChild ? " child" : "") + (sel === t.id ? " sel" : "")
    + (PEEK.kind === "session" && PEEK.sessionId === t.id ? " on" : "")
    + (ticked.has(t.id) ? " ticked" : "") + (dim ? " dimmed" : ""));
  b.dataset.townId = t.id;
  b.dataset.id = t.id;
  b.dataset.subSig = JSON.stringify(t.subagents || []);
  b.tabIndex = 0;
  b.setAttribute("role", "button");
  b.setAttribute("aria-label", `${t.title}, ${STATUS_LABEL[st] || st}`);
  b.draggable = true;
  b.ondragstart = e => { dragging = t; e.dataTransfer.setData("text/plain", t.id); b.classList.add("dragging"); document.body.classList.add("dragging-session"); };
  b.ondragend = () => { dragging = null; b.classList.remove("dragging"); document.body.classList.remove("dragging-session"); document.querySelectorAll(".drop").forEach(r => r.classList.remove("drop")); };

  const top = el("div", "town-top");
  top.append(el("span", "dot " + st));
  const titleEl = el("span", "town-title", (isChild ? "↳ " : "") + t.title);
  titleEl.title = t.title;
  top.append(titleEl);
  if (t.agent && t.agent !== "claude") top.append(el("span", "agent-tag", t.agent));
  const bg = (t.subagents || []).filter(a => a.status === "running").length;
  const age = [ago(t.since || (t.updated ? new Date(t.updated * 1000).toISOString() : null)), bg ? `+${bg}` : ""].filter(Boolean).join(" · ");
  top.append(el("span", "town-age", age));
  b.append(top);

  // Subtle hover action strip (zero clutter at rest)
  const acts = el("div", "town-acts" + (armed === "close:" + t.id ? " armed" : ""));
  const openBtn = el("button", "", ""); openBtn.setAttribute("aria-label", `Focus ${t.title} in cmux`); openBtn.title = "Open tab in cmux"; openBtn.append(icon("open"));
  openBtn.onclick = e => { e.stopPropagation(); post("/api/focus", { workspace: t.workspace, surface: t.id }); };
  acts.append(openBtn);
  const ren = el("button", "", ""); ren.setAttribute("aria-label", `Rename ${t.title}`); ren.title = "Rename"; ren.append(icon("edit"));
  ren.onclick = e => { e.stopPropagation(); startRename(titleEl, t.title, title => post("/api/rename", { workspace: t.workspace, surface: t.id, title })); };
  acts.append(ren);

  const prevRailScroll = map.querySelector(".inbox-rail-list")?.scrollTop || 0;
  const split = el("div", "inbox-split");

/* ---------------- Broadcast Bar ---------------- */
function openBroadcast() {
  const targets = [...ticked].map(sessionById).filter(t => t && t.agent && effectiveStatus(t) !== "ended");
  if (!targets.length) return;
  editing = true;
  document.getElementById("bcast")?.remove();
  const bar = el("div", "float-bar"); bar.id = "bcast";
  const input = el("textarea"); input.rows = 2; input.placeholder = `Message all ${targets.length} selected sessions...`;
  const row = el("div", "comp-foot"); row.style.marginTop = "0";
  const hint = el("span", "comp-hint", `To ${targets.length}: ${targets.map(t => t.title).join(", ")}`);
  const btns = el("div", "peek-acts");
  const close = () => { bar.remove(); editing = false; invalidateViews(); render(last); };
  const cancel = el("button", "btn sm", "Cancel"); cancel.onclick = close;
  const send = el("button", "btn sm primary", `Send to ${targets.length}`);
  const doSend = async () => {
    const text = input.value.trim(); if (!text) return;
    input.disabled = true; send.disabled = true; send.textContent = "Sending...";
    const errs = await Promise.all(targets.map(t => sendTo(t, text)));
    const failed = targets.filter((t, i) => errs[i]);
    targets.forEach((t, i) => { if (!errs[i]) ticked.delete(t.id); });
    if (!failed.length) { showToast(`Sent to ${targets.length} sessions`, "ok"); close(); setTimeout(tick, 450); return; }
    input.disabled = false; send.disabled = false; send.textContent = "Retry failed";
    hint.classList.add("fail"); hint.textContent = `Failed for: ${failed.map(t => t.title).join(", ")}`;
  };
  send.onclick = doSend;
  input.onkeydown = e => { if (e.key === "Escape") { e.stopPropagation(); close(); } else if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.stopPropagation(); doSend(); } };
  btns.append(cancel, send); row.append(hint, btns); bar.append(input, row);
  document.body.append(bar); input.focus();
}

/* ---------------- Single Prioritized Keyboard Dispatcher ---------------- */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (!helpScrim.hidden) { e.preventDefault(); return closeHelp(); }
    if (document.getElementById("bcast")) { e.preventDefault(); document.getElementById("bcast").remove(); editing = false; return; }
    if (!searchScrim.hidden) { e.preventDefault(); return closeSearchPalette(); }
    if (pendingMerge) { e.preventDefault(); pendingMerge = null; invalidateViews(); return render(last); }
    if (!peekEl.hidden) { e.preventDefault(); return closePeek(); }
    if (view === "galaxy") {
      if (G.legendOpen) { e.preventDefault(); G.legendOpen = false; return gRefreshControls(); }
      if (G.sys != null) { e.preventDefault(); return gGoGalaxy(); }
    }
    if (view === "spaces" && spacesMode === "wiring" && mapPin) { e.preventDefault(); mapPin = null; const w = document.querySelector(".wmap"); if (w) mapApply(w, w._chain); return; }
    if (sel || ticked.size || armed) { sel = null; ticked.clear(); sent.clear(); armed = null; invalidateViews(); return render(last); }
    return;
  }

  if (e.metaKey || e.ctrlKey || e.altKey || editing || ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;

  if (e.key === "?") { e.preventDefault(); return openHelp(); }
  if (e.key === "/") { e.preventDefault(); return openSearchPalette(); }
  if (e.key === "t") { e.preventDefault(); return applyTheme(theme === "dark" ? "light" : "dark"); }
  if (e.key === "1" || e.key === "g") { e.preventDefault(); return setView("galaxy"); }
  if (e.key === "2" || e.key === "s") { e.preventDefault(); return setView("spaces"); }
  if (e.key === "3" || e.key === "i") { e.preventDefault(); return setView("inbox"); }

  if (e.key === "r") {
    e.preventDefault();
    if (ticked.size) return openBroadcast();
    const id = (view === "inbox" ? inboxActiveId : sel) || (liveNeedsSessions()[0] && liveNeedsSessions()[0].id);
    if (view === "inbox") { const ta = map.querySelector("textarea"); if (ta) ta.focus(); }
    else if (id) openSessionPeek(id, "overview");
    return;
  }

  if (view === "galaxy") {
    if (e.key === "n") { e.preventDefault(); return gNextNeeds(); }
    if (e.key === "0") { e.preventDefault(); return gGoGalaxy(); }
    if (e.key === "=" || e.key === "+" || e.key === "-") {
      e.preventDefault();
      if (G.wrap) gZoomBy(e.key === "-" ? 0.8 : 1.25, G.wrap.clientWidth / 2, G.wrap.clientHeight / 2);
    }
    return;
  }

  if (view === "inbox") {
    const list = inboxListForFilter();
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && list.length) {
      e.preventDefault();
      const idx = list.findIndex(x => x.id === inboxActiveId);
      const next = list[(idx + (e.key === "ArrowDown" ? 1 : -1) + list.length) % list.length];
      inboxActiveId = next.id; inboxDiagTab = "overview"; invalidateViews(); render(last);
    } else if (e.key === "d" && inboxActiveId) {
      const t = sessionById(inboxActiveId);
      if (t && t.needs && !isDismissed(t)) { e.preventDefault(); dismissSession(t); }
    } else if (e.key === "Enter" && inboxActiveId) {
      const t = sessionById(inboxActiveId);
      if (t) post("/api/focus", { workspace: t.workspace, surface: t.id });
    }
  }
});

const usageBox = document.getElementById("usage");
function sparkline(history, start, end, now) {
  const W = 54, H = 14, top = Math.max(10, ...history.map(h => h[1])) * 1.25;
  const x = t => ((t - start) / (end - start)) * W, y = p => H - (p / top) * H;
  const g = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, "aria-hidden": "true" });
  g.append(svgEl("line", { x1: x(now), y1: 0, x2: x(now), y2: H, stroke: "var(--hairline-strong)", "stroke-dasharray": "2 2" }));
  if (history.length) g.append(svgEl("polyline", { points: history.map(([t, p]) => `${x(t).toFixed(1)},${y(p).toFixed(1)}`).join(" "), fill: "none", stroke: "var(--blue)", "stroke-width": 1.4 }));
  return g;
}
async function loadUsage() {

  catch (e) { usageBox.replaceChildren(el("span", "pace over", "Usage offline")); return; }

  if (!main) {
    usageBox.className = "usage";
    usageBox.replaceChildren(el("span", u.error ? "pace over" : "muted", u.error ? "Usage error" : "Usage..."));
    if (u.error) usageBox.title = u.error;
    return;
  }
  const now = Date.now() / 1000, end = Math.round(new Date(main.resets_at).getTime() / 60000) * 60, start = end - 7 * 86400;
  const elapsed = Math.min(1, Math.max(0, (now - start) / (end - start)));
  const projected = elapsed > 0.02 ? Math.round(main.percent / elapsed) : null;
  usageBox.className = "usage" + (main.percent >= 90 ? " over" : main.percent >= 70 ? " warn" : "");
  const bar = el("div", "bar"), fill = el("div", "fill"); fill.style.width = Math.min(100, main.percent) + "%"; bar.append(fill);
  let pace = el("span", "pace", projected == null ? "" : `${projected}% pace`);
  if (projected >= 100 && main.percent > 0) pace = el("span", "pace over", `out ${when(start + (100 / main.percent) * (now - start))}`);
  else if (projected >= 80) pace.className = "pace warn";
  usageBox.replaceChildren(bar, el("span", "pct", main.percent + "%"), pace, sparkline(u.history || [], start, end, now));
  usageBox.title = `Weekly limit: ${main.percent}% used. Resets ${when(end)} (${fmtSpan(end - now)} left).`;
}
loadUsage();
setInterval(loadUsage, 60000);
</script>
</body>
