<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Overworld</title>
<style>
  :root {
    --bg: #12131a; --panel: #1b1d27; --line: #2a2d3b; --text: #e6e7ee; --muted: #8a8ea3;
    --waiting: #f5a524; --working: #4c8dff; --done: #3ecf8e; --idle: #5b6075; --shell: #34374a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 1; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  .tally { display: flex; gap: 12px; color: var(--muted); }
  .tally b { color: var(--text); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  label { margin-left: auto; color: var(--muted); cursor: pointer; user-select: none; }
  main { display: flex; align-items: flex-start; gap: 14px; padding: 14px 16px 40px; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .region { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .region.drop { border-color: var(--working); box-shadow: 0 0 0 1px var(--working); }
  .region h2 { font-size: 13px; margin: 0; padding: 10px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  .region h2 .name { flex: 1; }
  .region h2 .count { color: var(--muted); font-weight: 400; }
  .add { background: none; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); font: inherit; line-height: 1; padding: 2px 7px; cursor: pointer; }
  .add:hover { color: var(--text); border-color: var(--muted); }
  .session { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid var(--c); color: inherit; font: inherit;
          padding: 8px 12px 8px 10px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .session.dragging { opacity: .4; }
  .x { color: var(--muted); padding: 0 2px; visibility: hidden; }
  .session:hover .x, .x.armed, .session:hover .pen, .region h2:hover .pen { visibility: visible; }
  .pen { color: var(--muted); cursor: pointer; visibility: hidden; font-weight: 400; }
  .pen:hover { color: var(--text); }
  .rename { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--working); border-radius: 4px; font: inherit; font-weight: 600; padding: 1px 5px; }
  .x:hover { color: var(--text); }
  .x.armed { color: #ff6b6b; font-weight: 600; }
  .hint { color: var(--muted); font-size: 11px; }
  .session:last-child { border-bottom: 0; }
  .session:hover { background: #232635; }
  .session.child { padding-left: 26px; }
  .session .row { display: flex; gap: 8px; align-items: baseline; }
  .session .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .session .recap { color: var(--muted); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .session.here { background: #20243a; }
  .shell .title { color: var(--muted); font-weight: 400; }
  .err { padding: 16px; color: var(--waiting); }
</style>
</head>
<body>
<header>
  <h1>Overworld</h1>
  <div class="tally" id="tally"></div>
  <span class="hint">drag a session onto another region to move it · ⌘⇧1 back to your last tab</span>
  <label><input type="checkbox" id="showShells"> show plain shells</label>
</header>
<main id="map"></main>
<script>
const ORDER = { waiting: 0, done: 1, working: 2, idle: 3, shell: 4 };
const LABEL = { waiting: "your turn", done: "finished", working: "working", idle: "idle", shell: "shell" };
const map = document.getElementById("map"), tally = document.getElementById("tally"), showShells = document.getElementById("showShells");
try { showShells.checked = localStorage.getItem("ow.shells") === "1"; } catch (e) {}
showShells.onchange = () => { try { localStorage.setItem("ow.shells", showShells.checked ? "1" : "0"); } catch (e) {} render(last); };
let last = null, dragging = null, armed = null, editing = false;

// ✎ swaps a label for an input: Enter or blur saves, Escape cancels. Renders pause while it is open.
function pencil(label, current, save) {
  const pen = el("span", "pen", "✎"); pen.title = "Rename";
  pen.onclick = e => {
    e.stopPropagation();
    editing = true;
    const input = el("input", "rename"); input.value = current;
    const done = keep => {
      if (!editing) return;
      editing = false;
      const title = input.value.trim();
      if (keep && title && title !== current) save(title);
      render(last);
    };
    input.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); };
    input.onblur = () => done(true);
    ["click", "mousedown", "dragstart"].forEach(ev => input.addEventListener(ev, e => e.stopPropagation()));
    label.replaceWith(input); input.focus(); input.select();
  };
  return pen;
}
const COL_MIN = 340, GAP = 14;
const post = (path, body) => fetch(path, { method: "POST", body: JSON.stringify(body || {}) }).then(() => setTimeout(tick, 600));
addEventListener("resize", () => render(last));

function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - Date.parse(iso)) / 1000;
  return s < 90 ? "now" : s < 5400 ? Math.round(s / 60) + "m" : s < 129600 ? Math.round(s / 3600) + "h" : Math.round(s / 86400) + "d";
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function sessionEl(t, isChild) {
  const b = el("div", "session " + t.status + (isChild ? " child" : "") + (t.here ? " here" : ""));
  b.draggable = true;
  b.ondragstart = e => { dragging = t; e.dataTransfer.setData("text/plain", t.id); b.classList.add("dragging"); };
  b.ondragend = () => { dragging = null; b.classList.remove("dragging"); document.querySelectorAll(".drop").forEach(r => r.classList.remove("drop")); };
  b.style.setProperty("--c", `var(--${t.status})`);
  const row = el("div", "row");
  const label = el("span", "title", (isChild ? "↳ " : "") + t.title);
  row.append(label);
  row.append(el("span", "meta", [LABEL[t.status], ago(t.since), t.agent].filter(Boolean).join(" · ")));
  const x = el("span", "x" + (armed === t.id ? " armed" : ""), armed === t.id ? "close?" : "×");
  x.title = "Close this session (click twice)";
  x.onclick = e => {
    e.stopPropagation();
    if (armed === t.id) { armed = null; post("/api/close", { workspace: t.workspace, surface: t.id }); }
    else { armed = t.id; setTimeout(() => { if (armed === t.id) { armed = null; render(last); } }, 3000); }
    render(last);
  };
  row.append(pencil(label, t.title, title => post("/api/rename", { workspace: t.workspace, surface: t.id, title })), x);
  b.append(row);
  if (t.recap) b.append(el("div", "recap", t.recap));
  b.onclick = () => fetch("/api/focus", { method: "POST", body: JSON.stringify({ workspace: t.workspace, surface: t.id }) });
  return b;
}

function render(state) {
  if (!state) return;
  const parentOf = Object.fromEntries(state.edges.map(e => [e.child, e.parent]));
  const counts = { waiting: 0, done: 0, working: 0 };
  const regions = state.regions.map(r => {
    const sessions = r.sessions.filter(t => showShells.checked || t.status !== "shell");
    sessions.forEach(t => { if (t.status in counts) counts[t.status]++; });
    const rank = Math.min(...sessions.map(t => ORDER[t.status]), 9);
    return { ...r, sessions, rank };
  }).filter(r => r.sessions.length).sort((a, b) => a.rank - b.rank);

  tally.replaceChildren(...["waiting", "done", "working"].map(k => {
    const s = el("span"); const d = el("span", "dot"); d.style.background = `var(--${k})`;
    s.append(d, el("b", null, counts[k]), " " + LABEL[k]); return s;
  }));

  const boxes = regions.map(r => {
    const box = el("section", "region");
    const h = el("h2");
    const addBtn = el("button", "add", "+"); addBtn.title = "New Claude session in " + r.title;
    addBtn.onclick = () => post("/api/new", { workspace: r.id });
    const name = el("span", "name", r.title);
    h.append(name, pencil(name, r.title, title => post("/api/rename", { workspace: r.id, title })), el("span", "count", r.sessions.length + (r.sessions.length === 1 ? " session" : " sessions")), addBtn);
    box.append(h);
    box.ondragover = e => { if (dragging && dragging.workspace !== r.id) { e.preventDefault(); box.classList.add("drop"); } };
    box.ondragleave = e => { if (!box.contains(e.relatedTarget)) box.classList.remove("drop"); };
    box.ondrop = e => { e.preventDefault(); box.classList.remove("drop"); if (dragging) post("/api/move", { workspace: r.id, surface: dragging.id }); };
    const ids = new Set(r.sessions.map(t => t.id));
    const byRank = [...r.sessions].sort((a, b) => ORDER[a.status] - ORDER[b.status] || (Date.parse(b.since || 0) - Date.parse(a.since || 0)));
    const roots = byRank.filter(t => !ids.has(parentOf[t.id]));
    const add = (t, depth) => { box.append(sessionEl(t, depth > 0)); byRank.filter(c => parentOf[c.id] === t.id).forEach(c => add(c, depth + 1)); };
    roots.forEach(t => add(t, 0));
    return box;
  });

  // Masonry: each region goes into the currently shortest column, so rank order still reads left to right, top to bottom.
  const n = Math.max(1, Math.floor((map.clientWidth - 32 + GAP) / (COL_MIN + GAP)));
  const cols = Array.from({ length: n }, () => el("div", "col"));
  map.replaceChildren(...cols);
  boxes.forEach(box => cols.reduce((a, b) => (b.offsetHeight < a.offsetHeight ? b : a)).append(box));
}

async function tick() {
  try {
    const state = await (await fetch("/api/state")).json();
    last = state;
    if (!dragging && !editing) render(last);  // re-rendering mid-drag or mid-rename would drop it
  } catch (e) {
    map.replaceChildren(el("div", "err", "Overworld server not reachable: " + e.message));
  }
}
tick();
setInterval(tick, 3000);
</script>
</body>
</html>
