/* ---------------- Goal Board (Inside Triage -> By goal) ---------------- */
const GOAL_HUE = n => `hsl(${(n * 67 + 205) % 360} 58% 60%)`;
let workBusy = {}, workMsg = {}, seeding = false, propEdit = null, groupBusy = false, capBusy = {}, capErr = {}, pendingMerge = null;

async function workPost(op, body) {
  const res = await fetch("/api/work/" + op, { method: "POST", body: JSON.stringify(body || {}) });
  const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
  if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
async function itemAct(it, op, label, body) {
  workBusy[it.id] = label; delete workMsg[it.id]; render(last);
  try {
    const r = await workPost(op, body || { id: it.id });
    showToast(op === "park" ? `Parked "${it.title}"` : op === "resume" ? `Reopened "${r.title || it.title}"` : "Updated", "ok");
  } catch (e) {
    showToast(`${label} failed: ${e.message}`, "err");
  }
  delete workBusy[it.id];
  tick();
}
async function editWork(body, okMsg, undoBody) {
  try {
    await workPost("edit", body);
    if (okMsg) showToast(okMsg, "ok", undoBody ? "Undo" : null, undoBody ? () => editWork(undoBody, "Reverted") : null);
    tick();
  } catch (e) {
    showToast(`Could not update work item: ${e.message}`, "err");
  }
}
async function proposeGroups() {
  groupBusy = true; render(last);
  try { await workPost("groups"); showToast("Re-grouped work items by goal", "ok"); }
  catch (e) { showToast("Grouping failed: " + e.message, "err"); }
  groupBusy = false; tick();
}

function buildGoalBoard(state) {
  const w = state.work;
  const wrap = el("div", "goal-board");
  if (!w || !w.seeded) {
    wrap.append(seedPanel(w || { seeded: false }));
    return wrap;
  }

  const caps = buildCapturesFold(state, w.items);
  if (caps) wrap.append(caps);

  const items = w.items.filter(i => i.state !== "done");
  const goals = [...(w.groups || []), { id: "", title: "No goal yet" }];
  const goalIdx = new Map((w.groups || []).map((g, n) => [g.id, n]));

  const liveItems = items.filter(i => i.needs || i.tabs.length > 0);
  const inactiveItems = items.filter(i => !i.needs && i.tabs.length === 0);

  goals.forEach(g => {
    const mine = liveItems.filter(i => g.id ? i.group === g.id : !goalIdx.has(i.group))
      .sort((a, b) => (b.needs - a.needs) || a.title.localeCompare(b.title));
    if (!mine.length && !g.id) return;
    const sec = el("section", "goal-sec");
    sec.style.setProperty("--h", g.id ? GOAL_HUE(goalIdx.get(g.id)) : "var(--idle)");
    const head = el("div", "goal-sec-head");
    head.append(el("span", "goal-swatch"));
    const titleEl = el("h3", "", g.title);
    head.append(titleEl, el("span", "count-pill", `${mine.length} active`));
    const needCnt = mine.filter(i => i.needs).length;
    if (needCnt) head.append(el("span", "count-pill warm", `${needCnt} needs you`));
    if (g.id) {
      const ren = el("button", "btn sm icon", "");
      ren.setAttribute("aria-label", `Rename goal ${g.title}`); ren.title = "Rename goal"; ren.append(icon("edit"));
      ren.onclick = () => startRename(titleEl, g.title, title => editWork({ op: "group-rename", group: g.id, title }));
      head.append(ren);
    }
    sec.append(head);

    if (mine.length) {
      const grid = el("div", "goal-items");
      mine.forEach(it => grid.append(buildWorkItemCard(it)));
      sec.append(grid);
    } else {
      sec.append(el("div", "muted", "No active tabs under this goal. Drag a work item here to assign it."));
    }

    sec.ondragover = e => { if (draggingItem) { e.preventDefault(); sec.classList.add("drop"); } };
    sec.ondragleave = e => { if (!sec.contains(e.relatedTarget)) sec.classList.remove("drop"); };
    sec.ondrop = e => { e.preventDefault(); sec.classList.remove("drop"); if (draggingItem) { const it = draggingItem; draggingItem = null; editWork({ op: "group-set", id: it.id, group: g.id }, `Moved "${it.title}" to ${g.title}`); } };
    wrap.append(sec);
  });

  if (inactiveItems.length) {
    const fold = el("details", "fold");
    const sum = el("summary", "", `Dormant or parked items with no open tab (${inactiveItems.length})`);
    fold.append(sum);
    const body = el("div", "fold-body goal-items");
    inactiveItems.sort((a, b) => a.title.localeCompare(b.title)).forEach(it => body.append(buildWorkItemCard(it)));
    fold.append(body);
    wrap.append(fold);
  }
  return wrap;
}

function buildWorkItemCard(it) {
  const parked = it.state === "parked" && it.status === "none";
  const box = el("article", "wcard" + (it.needs ? " needs" : "") + (parked ? " parked" : ""));
  const head = el("div", "wcard-head");
  head.draggable = true;
  head.ondragstart = e => { draggingItem = it; e.dataTransfer.setData("text/plain", it.id); };
  head.ondragend = () => { draggingItem = null; document.querySelectorAll(".drop").forEach(x => x.classList.remove("drop")); };

  const stKey = it.needs ? "waiting" : parked ? "shell" : it.status === "none" ? "idle" : it.status;
  head.append(el("span", "dot " + stKey));
  const nameEl = el("span", "wcard-name", it.title);
  nameEl.title = it.title;
  head.append(nameEl);
  const ren = el("button", "btn sm icon", "");
  ren.setAttribute("aria-label", `Rename ${it.title}`); ren.append(icon("edit"));
  ren.onclick = e => { e.stopPropagation(); startRename(nameEl, it.title, title => editWork({ op: "update", id: it.id, title })); };
  head.append(ren);
  box.append(head);

  const line = it.needs || parked ? (it.next || it.note) : it.note;
  if (line) box.append(el("div", "wcard-next", line));

  const meta = el("div", "wcard-meta");
  const askRec = (it.asked_by || []).slice(-1)[0];
  if (askRec) meta.append(el("span", "", `Asked by ${askRec.person} · ${ago(new Date(askRec.at * 1000).toISOString())}`));
  else if (it.people && it.people.length) meta.append(el("span", "", it.people.join(", ")));
  if (meta.childNodes.length) box.append(meta);

  const liveTabs = (it.tabs || []).map(sessionById).filter(Boolean);
  if (liveTabs.length) {
    const tlist = el("div", "wcard-tabs");
    liveTabs.forEach(t => {
      const tst = effectiveStatus(t);
      const tr = el("button", "wtab-row");
      tr.append(el("span", "dot " + tst), el("span", "wtab-name", t.title), el("span", "smeta " + tst, STATUS_LABEL[tst] || tst));
      tr.title = "Open Session Sheet (Reply & Diagnostics)";
      tr.onclick = () => openSheet(t.id, "reply");
      tlist.append(tr);
    });
    box.append(tlist);
  }

  const acts = el("div", "wcard-acts");
  if (workBusy[it.id]) {
    acts.append(el("span", "muted", workBusy[it.id] + "..."));
  } else {
    if (liveTabs.length) {
      const targetTab = liveTabs.find(t => effectiveStatus(t) === "waiting") || liveTabs[0];
      if (effectiveStatus(targetTab) !== "ended") {
        const rep = el("button", "btn sm" + (it.needs ? " warm" : ""), "");
        rep.append(icon("reply"), document.createTextNode("Reply"));
        rep.onclick = () => openSheet(targetTab.id, "reply");
        acts.append(rep);
      }
      const focus = el("button", "btn sm", "Open tab");
      focus.onclick = () => post("/api/focus", { workspace: targetTab.workspace, surface: targetTab.id });
      acts.append(focus);
    }
    if (!parked) {
      const pkKey = "park:" + it.id;
      const pk = el("button", "btn sm" + (armed === pkKey ? " armed" : ""), armed === pkKey ? `Close ${it.tabs.length} tab${it.tabs.length === 1 ? "" : "s"}?` : "Park");
      pk.onclick = () => {
        if (!it.tabs.length) itemAct(it, "park", "Parking");
        else armAction(pkKey, () => itemAct(it, "park", "Parking"));
      };
      acts.append(pk);
    }
    if (it.resumable && !it.tabs.length) {
      const res = el("button", "btn sm", "Resume");
      res.onclick = () => itemAct(it, "resume", "Reopening");
      acts.append(res);
    }
    const dn = el("button", "btn sm", "Done");
    dn.onclick = () => editWork({ op: "update", id: it.id, state: "done" }, `Marked "${it.title}" done`, { op: "update", id: it.id, state: "active" });
    acts.append(dn);
  }
  box.append(acts);

  box.ondragover = e => { if ((dragging && dragging.transcript) || (draggingItem && draggingItem.id !== it.id)) { e.preventDefault(); box.classList.add("drop"); } };
  box.ondragleave = e => { if (!box.contains(e.relatedTarget)) box.classList.remove("drop"); };
  box.ondrop = e => {
    e.preventDefault(); box.classList.remove("drop");
    if (dragging && dragging.transcript) { const tr = dragging.transcript; dragging = null; editWork({ op: "attach", transcript: tr, item: it.id }, `Attached tab to "${it.title}"`); }
    else if (draggingItem && draggingItem.id !== it.id) { pendingMerge = { from: draggingItem, into: it }; draggingItem = null; render(last); }
  };
  return box;
}

function buildCapturesFold(state, items) {
  const caps = state.captures || [];
  if (!caps.length) return null;
  const fold = el("details", "fold");
  fold.append(el("summary", "", `Recent hotkey captures (${caps.length})`));
  const body = el("div", "fold-body");
  caps.forEach(c => {
    const row = el("div", "cap-row");
    const note = c.text.replace(/https?:\/\/\S+/g, m => /slack\.com/.test(m) ? "[Slack link]" : "[link]").replace(/Screenshot: \S+/, "[screenshot]").trim();
    const where = c.routed === "new" ? "New tab" : (c.item_title || (sessionById(c.surface) || {}).title || "Session");
    row.append(
      el("span", "cap-when", ago(new Date(c.at * 1000).toISOString())),
      el("span", "cap-note", note || "(empty note)"),
      el("span", "muted", c.routed === "resumed" ? "→ reopened" : "→"),
      el("b", "", where),
      el("span", "cap-why", c.reason || "")
    );
    const pick = el("select");
    pick.setAttribute("aria-label", `Redirect capture ${note.slice(0, 30)}`);
    pick.append(el("option", null, capBusy[c.id] ? "Moving..." : "Move capture to..."));
    const nw = el("option", null, "New tab"); nw.value = "new";
    if (c.routed !== "new") pick.append(nw);
    items.filter(i => i.state !== "done" && i.id !== c.item).sort((a, b) => a.title.localeCompare(b.title))
      .forEach(i => { const o = el("option", null, i.title); o.value = i.id; pick.append(o); });
    pick.disabled = !!capBusy[c.id];
    pick.onfocus = () => { editing = true; };
    pick.onblur = () => { editing = false; };
    pick.onchange = async () => {
      editing = false; capBusy[c.id] = true; render(last);
      try {
        const res = await fetch("/api/capture/redirect", { method: "POST", body: JSON.stringify({ id: c.id, to: pick.value }) });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
        showToast("Redirected capture", "ok");
      } catch (e) { showToast("Capture redirect failed: " + e.message, "err"); }
      delete capBusy[c.id]; tick();
    };
    row.append(pick);
    const item = items.find(i => i.id === c.item);
    const tab = sessionById(c.surface) || (item && item.tabs.map(sessionById).find(Boolean));
    if (tab) {
      row.classList.add("go");
      row.onclick = e => { if (!e.target.closest("select")) post("/api/focus", { workspace: tab.workspace, surface: tab.id }); };
    }
    body.append(row);
  });
  fold.append(body);
  return fold;
}

function mergeBar() {
  const bar = el("div", "float-bar");
  bar.append(el("div", "", `Merge "${pendingMerge.from.title}" into "${pendingMerge.into.title}"? Tabs, people, and links move over.`));
  const acts = el("div", "sheet-acts");
  const yes = el("button", "btn sm primary", "Merge");
  yes.onclick = () => { const p = pendingMerge; pendingMerge = null; editWork({ op: "merge", from: p.from.id, into: p.into.id }, `Merged "${p.from.title}"`); };
  const no = el("button", "btn sm", "Cancel");

function seedPanel(w) {
  const panel = el("div", "wpanel");
  if (!w.proposal) {
    panel.append(el("h2", "", "Group tabs into work items"),
      el("p", "muted", "One model call reads your agent tabs and proposes work items. You review and edit before saving."));
    const go = el("button", "btn primary", seeding ? "Reading tabs..." : "Propose work items");
    go.disabled = seeding;
    go.onclick = async () => { seeding = true; render(last); try { await workPost("seed"); } catch (e) { showToast(e.message, "err"); } seeding = false; tick(); };
    panel.append(go);
    return panel;
  }
  if (!propEdit) propEdit = JSON.parse(JSON.stringify(w.proposal.items));
  const known = [...w.proposal.items.flatMap(p => p.tabs), ...w.proposal.unsorted];
  const itemOf = new Map(); propEdit.forEach((p, i) => p.tabs.forEach(t => itemOf.set(t.id, i)));
  const leftRegions = last.regions.map(r => ({ r, tabs: r.sessions.filter(t => known.some(k => k.id === t.id)) })).filter(x => x.tabs.length);
  const live = propEdit.map((p, i) => ({ p, i })).filter(x => x.p.tabs.length);
  const ask = el("div", "seedbar");
  ask.append(el("b", "", `${known.length} tabs → ${live.length} proposed work items.`));
  const ok = el("button", "btn sm primary", "Accept");
  ok.onclick = async () => { try { await workPost("accept", { items: propEdit.map(p => ({ title: p.title, goal: p.goal, people: p.people, tabs: p.tabs.map(x => x.transcript) })) }); propEdit = null; tick(); } catch (e) { showToast(e.message, "err"); } };
  const cancel = el("button", "btn sm", "Discard");
  cancel.onclick = () => { propEdit = null; editWork({ op: "drop-proposal" }); };
  ask.append(ok, cancel);
  panel.append(ask);
  return panel;
}

/* ---------------- Links View (3-Column Relationship Map, Responsive & Calm) ---------------- */
let mapFocus = null, mapPin = null;

function renderLinks(state) {
  const w = state.work, y = scrollY;
  const wrap = el("div", "links-wrap");
  if (!w || !w.seeded) {
    wrap.append(seedPanel(w || { seeded: false }));
    map.replaceChildren(wrap);
    return;
  }

  const items = w.items.filter(i => i.state !== "done");
  const goals = w.groups || [];
  const activeItems = items.filter(i => i.needs || i.tabs.length > 0);
  const inactiveCount = items.length - activeItems.length;
  const shownItems = linksShowInactive ? items : activeItems;

  const bar = el("div", "sec-bar");
  bar.append(el("h2", "", "Session → Work item → Goal links"), el("span", "count-pill", `${shownItems.length} shown`));
  const right = el("div", "hdr-right");
  if (inactiveCount > 0) {
    const tog = el("button", "btn sm", linksShowInactive ? "Hide items with no open tab" : `Show ${inactiveCount} dormant items`);
    tog.onclick = () => { linksShowInactive = !linksShowInactive; remember("ow.linksInactive", linksShowInactive ? "1" : "0"); render(last); };
    right.append(tog);
  }
  const reg = el("button", "btn sm" + (armed === "regroup-goals" ? " armed" : ""), groupBusy ? "Grouping..." : armed === "regroup-goals" ? "Overwrite goals?" : "Regroup by goal");
  reg.disabled = groupBusy;
  reg.onclick = () => armAction("regroup-goals", proposeGroups);
  right.append(reg);
  bar.append(right);
  wrap.append(bar);

  const caps = buildCapturesFold(state, w.items);
  if (caps) wrap.append(caps);

  const goalIdx = new Map(goals.map((g, n) => [g.id, n]));
  const hueOf = it => goalIdx.has(it.group) ? GOAL_HUE(goalIdx.get(it.group)) : "var(--idle)";
  // Needs-you items sort FIRST (above goal grouping) so urgent items sit at the top of the viewport.
  const ordered = shownItems.slice().sort((a, b) => (b.needs - a.needs) || (goalIdx.get(a.group) ?? 99) - (goalIdx.get(b.group) ?? 99) || a.title.localeCompare(b.title));
  const itemPos = new Map(ordered.map((it, n) => [it.id, n]));
  const itemOfTab = new Map(); items.forEach(it => it.tabs.forEach(t => itemOfTab.set(t, it)));

  const pos = t => itemOfTab.has(t.id) && itemPos.has(itemOfTab.get(t.id).id) ? itemPos.get(itemOfTab.get(t.id).id) : 1e3;
  const spaces = state.regions.map(r => ({ r, tabs: r.sessions.filter(t => t.agent || showShells).sort((a, b) => pos(a) - pos(b)) }))
    .filter(x => x.tabs.length)
    .map(x => ({ ...x, at: x.tabs.reduce((s, t) => s + pos(t), 0) / x.tabs.length })).sort((a, b) => a.at - b.at);

  const rel = new Map(), link = (a, b) => { (rel.get(a) || rel.set(a, new Set([a])).get(a)).add(b); (rel.get(b) || rel.set(b, new Set([b])).get(b)).add(a); };
  ordered.forEach(it => { it.tabs.forEach(t => link("t:" + t, "i:" + it.id)); if (goalIdx.has(it.group)) link("i:" + it.id, "g:" + it.group); });
  const chain = key => {
    const out = new Set([key]), [kind] = key.split(":");
    const add = k => (rel.get(k) || new Set([k])).forEach(x => out.add(x));
    add(key);
    if (kind === "t" || kind === "g") [...out].filter(k => k.startsWith("i:")).forEach(add);

  const W = Math.max(260, (G.panel.clientWidth || 460) - 36), LBL = W < 380 ? 116 : 152, PAD = 14, ROW = 30, H = S.length * ROW + 32;
  const trackW = Math.max(80, W - LBL - PAD * 2);

    const label = svgEl("text", { class: "grlabel", x: 4, y: y + 4 });

    if (s.live) {
      g.setAttribute("tabindex", "0"); g.setAttribute("role", "button"); g.setAttribute("aria-label", `Open session ${s.title}`);
      g.onclick = () => openSheet(s.live, "reply");
      g.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(s.live, "reply"); } };
    }

      svg.append(svgEl("path", { class: "grspin", d: `M${xa},${py + 6} C${xa},${(py + y) / 2} ${xa},${(py + y) / 2} ${xa + 2},${y - 6}`, "marker-end": "url(#garrow)" }));
    }
  });
  const wrap = el("div", "ghistwrap");
  wrap.append(svg, el("div", "muted", "Bars = first to last turn · ticks = prompts · click a live row to open Session Sheet."));

}

function renderSearchPalette() {

  const lbl = el("span", "sr-only", "Search sessions and work items"); lbl.id = "searchTitle";

  input.setAttribute("aria-label", "Search sessions and work items");

  head.append(lbl, input, close);

  pal.append(head, list);
  searchScrim.replaceChildren(pal);

  const activate = hit => {
    closeSearchPalette();
    if (hit.kind === "session") openSheet(hit.t.id, "reply");
    else {
      setView("galaxy");
      const tryOpen = () => { if (G.data && G.pos[hit.item.id]) gOpenPlanet(hit.item.id); else setTimeout(tryOpen, 250); };
      setTimeout(tryOpen, 200);

      const item = itemBySessionId(t.id);
      const hay = [t.title, t.ws_title, item && item.title, askTextOf(t), t.recap].filter(Boolean).join(" ").toLowerCase();

    const itemHits = words.length && last && last.work ? last.work.items.filter(it => {

      const hay = [it.title, it.goal, it.next, it.note, ...(it.people || [])].filter(Boolean).join(" ").toLowerCase();
      return words.every(w => hay.includes(w));

    list.replaceChildren(...matches.map((hit, i) => {

    else if (e.key === "ArrowDown") { e.preventDefault(); palIdx = (palIdx + 1) % Math.max(1, palResults.length); paint(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); palIdx = (palIdx - 1 + Math.max(1, palResults.length)) % Math.max(1, palResults.length); paint(); }
    else if (e.key === "Enter" && palResults[palIdx]) { e.preventDefault(); activate(palResults[palIdx]); }
  };
  paint();
  input.focus(); input.select();
}

/* ---------------- Shortcuts & Help Modal (`?`) ---------------- */
function openHelp() {
  captureFocus();
  helpScrim.hidden = false; editing = true;
  const pal = el("div", "palette");
  const head = el("div", "sheet-head");
  const h2 = el("h2", "", "Keyboard shortcuts & guide"); h2.id = "helpTitle"; h2.style.flex = "1";
  const close = el("button", "btn sm icon", ""); close.setAttribute("aria-label", "Close help"); close.append(icon("close")); close.onclick = closeHelp;
  head.append(h2, close);

  const grid = el("div", "help-grid");
  const addSec = (title, items, badgeCls = "kbd") => {
    const s = el("div", "help-sec"); s.append(el("h3", "", title));
    items.forEach(([k, desc]) => {
      const r = el("div", "help-row"); r.append(el("span", "", desc), el("span", badgeCls, k)); s.append(r);
    });
    grid.append(s);
  };
  addSec("Navigation", [
    ["1 / t", "Triage view (default)"],
    ["2 / w", "Links wiring view"],
    ["3 / g", "Galaxy spatial view"],
    ["/", "Global search palette"],
    ["i", "Quick Inbox overlay"],
    ["?", "Toggle this guide"],
    ["⌘⇧1", "Return to previous cmux tab"]
  ]);
  addSec("Triage & Board", [
    ["r", "Reply to selected or next waiting session"],
    ["d", "Dismiss highlighted Triage ask"],
    ["Arrows", "Move highlight across cards"],
    ["Space", "Select card for broadcast reply"],
    ["Enter", "Focus highlighted tab in cmux"],
    ["Esc", "Close top layer (one layer per press)"]
  ]);
  addSec("Galaxy & Links", [
    ["n", "Fly to next item needing you"],
    ["0", "Fit whole galaxy"],
    ["+ / -", "Zoom in / out"],
    ["Pinch / ⌘-scroll", "Smooth zoom"],
    ["Click box (Links)", "Pin chain · drag to re-link"]
  ]);
  addSec("Actions Guide", [
    ["Open tab", "Switches cmux focus to that workspace"],
    ["Dock beside", "Moves tab into split pane right of Overworld"],
    ["Dismiss", "Hides ask until agent sends a new reply"],
    ["Park", "Summarizes item & closes tabs (2 clicks)"]
  ], "action-pill");
  pal.append(head, grid);
  helpScrim.replaceChildren(pal);
  close.focus();
}
function closeHelp() { helpScrim.hidden = true; helpScrim.replaceChildren(); editing = false; render(last); restoreFocus(); }
helpScrim.onmousedown = e => { if (e.target === helpScrim) closeHelp(); };
document.getElementById("helpBtn").onclick = () => (helpScrim.hidden ? openHelp() : closeHelp());

/* ---------------- Broadcast Bar ---------------- */
function openBroadcast() {
  const targets = [...ticked].map(sessionById).filter(t => t && t.agent && effectiveStatus(t) !== "ended");
  if (!targets.length) return;
  editing = true;
  document.getElementById("bcast")?.remove();
  const bar = el("div", "float-bar"); bar.id = "bcast";
  const input = el("textarea"); input.rows = 2; input.placeholder = `Message all ${targets.length} selected sessions...`;
  input.setAttribute("aria-label", "Broadcast message");
  const row = el("div", "composer-bar");
  const hint = el("span", "composer-hint", `To ${targets.length}: ${targets.map(t => t.title).join(", ")}`);
  const btns = el("div", "sheet-acts");
  const close = () => { bar.remove(); editing = false; render(last); };
  const cancel = el("button", "btn sm", "Cancel"); cancel.onclick = close;
  const send = el("button", "btn sm primary", `Send to ${targets.length}`);
  const doSend = async () => {
    const text = input.value.trim(); if (!text) return;
    input.disabled = true; send.disabled = true; send.textContent = "Sending...";
    const errs = await Promise.all(targets.map(t => sendTo(t, text)));
    const failed = targets.filter((t, i) => errs[i]);
    targets.forEach((t, i) => { if (!errs[i]) ticked.delete(t.id); });
    if (!failed.length) { showToast(`Sent to ${targets.length} sessions`, "ok"); close(); setTimeout(tick, 500); return; }
    input.disabled = false; send.disabled = false; send.textContent = "Retry failed";
    hint.classList.add("fail"); hint.textContent = `Failed for: ${failed.map(t => t.title).join(", ")}`;
  };
  send.onclick = doSend;
  input.onkeydown = e => { if (e.key === "Escape") { e.stopPropagation(); close(); } else if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.stopPropagation(); doSend(); } };
  btns.append(cancel, send); row.append(hint, btns); bar.append(input, row);
  document.body.append(bar); input.focus();
}

/* ---------------- Single Prioritized Keyboard & Escape Dispatcher ---------------- */
const DIRS = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1] };
const boardCards = () => [...document.querySelectorAll(".session, .tcard")];
function neighborCard(from, [dx, dy]) {
  const a = from.getBoundingClientRect(); let best = null, bestScore = Infinity;
  for (const c of boardCards()) {
    if (c === from) continue;
    const b = c.getBoundingClientRect();
    const ahead = dx ? (dx > 0 ? b.left - a.right : a.left - b.right) : (dy > 0 ? b.top - a.bottom : a.top - b.bottom);
    if (ahead < -2) continue;
    const side = dx ? Math.max(0, b.top - a.bottom, a.top - b.bottom) : Math.max(0, b.left - a.right, a.left - b.right);
    const score = Math.max(0, ahead) + side * 3;
    if (score < bestScore) { bestScore = score; best = c; }
  }
  return best;
}
function selectCard(id) {
  sel = id;
  boardCards().forEach(c => c.classList.toggle("sel", c.dataset.id === id));
  const c = boardCards().find(c => c.dataset.id === id);
  if (c) c.scrollIntoView({ block: "nearest", inline: "nearest" });
}

document.addEventListener("keydown", e => {
  // 1. Single prioritized Escape chain: closes exactly ONE layer per press.
  if (e.key === "Escape") {
    if (!helpScrim.hidden) { e.preventDefault(); return closeHelp(); }
    if (document.getElementById("bcast")) { e.preventDefault(); document.getElementById("bcast").remove(); editing = false; return render(last); }
    if (!searchScrim.hidden) { e.preventDefault(); return closeSearchPalette(); }
    if (!sheetScrim.hidden) { e.preventDefault(); return closeSheet(); }
    if (!inboxScrim.hidden) { e.preventDefault(); return closeInbox(); }
    if (pendingMerge) { e.preventDefault(); pendingMerge = null; return render(last); }
    if (view === "galaxy") {
      if (G.showNeedsDrawer) { e.preventDefault(); G.showNeedsDrawer = false; render(last); return requestAnimationFrame(() => gFitAll(true)); }
      if (G.planet) { e.preventDefault(); gClosePlanet(); if (G.sys != null) gFitSystem(G.sys); return; }
      if (G.sys != null) { e.preventDefault(); return gGoGalaxy(); }
    }
    if (view === "links" && mapPin) { e.preventDefault(); mapPin = null; const w = document.querySelector(".wmap"); if (w) mapApply(w, w._chain); return; }
    if (sel || ticked.size || armed) { sel = null; ticked.clear(); sent.clear(); armed = null; return render(last); }
    return;
  }

  // Ignore shortcuts while typing in form controls or when a modal is open
  if (e.metaKey || e.ctrlKey || e.altKey || editing || ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;

  if (e.key === "?") { e.preventDefault(); return openHelp(); }
  if (e.key === "/") { e.preventDefault(); return openSearchPalette(); }
  if (e.key === "i") { e.preventDefault(); return openInbox(); }
  if (e.key === "1" || e.key === "t") { e.preventDefault(); return setView("triage"); }
  if (e.key === "2" || e.key === "w") { e.preventDefault(); return setView(view === "links" ? "triage" : "links"); }
  if (e.key === "3" || e.key === "g") { e.preventDefault(); return setView(view === "galaxy" ? "triage" : "galaxy"); }
  if (e.key === "r") {
    e.preventDefault();
    if (ticked.size) return openBroadcast();
    const id = sel || (liveNeedsSessions()[0] && liveNeedsSessions()[0].id);
    if (id) openSheet(id, "reply");
    return;
  }

  if (view === "galaxy") {
    if (e.key === "n") { e.preventDefault(); return gNextNeeds(); }
    if (e.key === "0") { e.preventDefault(); return gGoGalaxy(); }
    if (e.key === "=" || e.key === "+" || e.key === "-") {
      e.preventDefault();
      if (G.wrap) gZoomBy(e.key === "-" ? 0.8 : 1.25, G.wrap.clientWidth / 2, G.wrap.clientHeight / 2);
    }
    return;
  }

  if (DIRS[e.key]) {
    e.preventDefault();
    const cur = boardCards().find(c => c.dataset.id === sel);
    const next = cur ? neighborCard(cur, DIRS[e.key]) : boardCards()[0];
    if (next) selectCard(next.dataset.id);
  } else if (e.key === "d" && sel) {
    const t = sessionById(sel);
    if (t && t.needs && !isDismissed(t)) { e.preventDefault(); dismissSession(t); }
  } else if (e.key === "Enter" && sel) {
    const t = sessionById(sel);
    if (t) post("/api/focus", { workspace: t.workspace, surface: t.id });
  } else if (e.key === " " && sel) {
    e.preventDefault(); ticked.has(sel) ? ticked.delete(sel) : ticked.add(sel); render(last);
  }
});

/* ---------------- Master Render & Poll Loop ---------------- */
const pollBanner = document.getElementById("pollBanner");
function render(state) {
  if (!state) return;
  navButtons.forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === view)));
  renderTally();
  if (view === "galaxy") return renderGalaxy(state);
  if (view === "links") return renderLinks(state);
  return renderTriage(state);
}

let seenCame = 0, pageVersion = 0;
async function tick() {
  try {
    const state = await (await fetch("/api/state")).json();
    pollBanner.hidden = true;
    last = state;
    if (pageVersion && state.page && state.page !== pageVersion) return location.reload();
    pageVersion = pageVersion || state.page;
    const came = state.came_from;
    if (came && came.at > seenCame) {
      if (seenCame || Date.now() / 1000 - came.at < 60) { mapPin = "t:" + came.id; sel = came.id; }
      seenCame = came.at;
    }
    if (!dragging && !draggingRegion && !draggingItem && !editing) render(last);
    else renderTally();
    renderInbox();
  } catch (e) {
    pollBanner.hidden = false;
    const retry = el("button", "btn sm", "Retry now");
    retry.onclick = tick;
    pollBanner.replaceChildren(el("span", "", "Overworld server temporarily unreachable (" + e.message + "). Showing last known state."), retry);
  }
}

addEventListener("resize", () => {
  if (view === "galaxy" && G.wrap) {
    document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px");
    clearTimeout(G.resizeT);
    G.resizeT = setTimeout(() => { if (G.planet && G.lastReach) gFitPlanet(G.planet, G.lastReach); else if (G.sys != null) gFitSystem(G.sys); else gFitAll(true); }, 140);
  } else {
    render(last);
  }
});

tick();
setInterval(tick, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
window.addEventListener("focus", tick);

/* ---------------- Weekly Usage Meter (Calm Loading State) ---------------- */
const usageBox = document.getElementById("usage");
function sparkline(history, start, end, now) {
  const W = 76, H = 16, top = Math.max(10, ...history.map(h => h[1])) * 1.25;
  const x = t => ((t - start) / (end - start)) * W, y = p => H - (p / top) * H;
  const g = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, "aria-hidden": "true" });
  g.append(svgEl("line", { x1: 0, y1: H - 0.5, x2: W, y2: H - 0.5, stroke: "var(--line)" }));
  g.append(svgEl("line", { x1: x(now), y1: 0, x2: x(now), y2: H, stroke: "var(--muted)", "stroke-dasharray": "2 2" }));
  if (history.length) g.append(svgEl("polyline", { points: history.map(([t, p]) => `${x(t).toFixed(1)},${y(p).toFixed(1)}`).join(" "), fill: "none", stroke: "var(--working)", "stroke-width": 1.5 }));
  return g;
}
async function loadUsage() {
  let u;
  try { u = await (await fetch("/api/usage")).json(); }
  catch (e) { usageBox.replaceChildren(el("span", "pace over", "Usage offline")); return; }
  const main = (u.weekly || []).find(l => l.kind === "weekly_all");
  if (!main) {
    usageBox.className = "usage";
    usageBox.replaceChildren(el("span", u.error ? "pace over" : "muted", u.error ? "Usage error" : "Usage syncing..."));
    if (u.error) usageBox.title = u.error;
    return;
  }
  const now = Date.now() / 1000, end = Math.round(new Date(main.resets_at).getTime() / 60000) * 60, start = end - 7 * 86400;
  const elapsed = Math.min(1, Math.max(0, (now - start) / (end - start)));
  const projected = elapsed > 0.02 ? Math.round(main.percent / elapsed) : null;
  usageBox.className = "usage" + (main.percent >= 90 ? " over" : main.percent >= 70 ? " warn" : "");
  const bar = el("div", "bar"), fill = el("div", "fill"); fill.style.width = Math.min(100, main.percent) + "%"; bar.append(fill);
  let pace = el("span", "pace", projected == null ? "" : `pace ${projected}%`);
  if (projected >= 100 && main.percent > 0) pace = el("span", "pace over", `runs out ${when(start + (100 / main.percent) * (now - start))}`);
  else if (projected >= 80) pace.className = "pace warn";
  usageBox.replaceChildren(el("span", "", "Weekly"), bar, el("span", "pct", main.percent + "%"), pace, sparkline(u.history || [], start, end, now));
  usageBox.title = `Weekly limit: ${main.percent}% used. Resets ${when(end)} (${fmtSpan(end - now)} left).`;
}
loadUsage();
setInterval(loadUsage, 60000);
</script>
