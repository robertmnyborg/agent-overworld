<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Overworld</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101012;
    --bg-2: #151518;
    --surface: #18181c;
    --surface-2: #202026;
    --elevated: #26262e;
    --hover: rgba(255, 255, 255, 0.048);
    --active: rgba(255, 255, 255, 0.088);
    --hairline: rgba(255, 255, 255, 0.075);
    --hairline-strong: rgba(255, 255, 255, 0.14);
    --orbit: rgba(255, 255, 255, 0.08);
    --ink: #f4f4f5;
    --ink-2: #b4b4be;
    --ink-3: #8e8e9a;
    --amber: #f2ab44;
    --amber-dot: #f2ab44;
    --amber-soft: rgba(242, 171, 68, 0.11);
    --blue: #60a5fa;
    --blue-soft: rgba(96, 165, 250, 0.12);
    --violet: #b197fc;
    --violet-soft: rgba(177, 151, 252, 0.12);
    --green: #4ade80;
    --green-soft: rgba(74, 222, 128, 0.12);
    --teal: #4fd1c5;
    --rose: #ff9fb3;
    --danger: #ff8585;
    --danger-soft: rgba(255, 133, 133, 0.13);
    --cta-bg: #f4f4f5;
    --cta-ink: #101012;
    --scrim: rgba(8, 8, 10, 0.56);
    --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.28), 0 4px 14px rgba(0, 0, 0, 0.14);
    --peek-shadow: -12px 0 38px rgba(0, 0, 0, 0.42);
    --pop-shadow: 0 10px 32px rgba(0, 0, 0, 0.52);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }

  [data-theme="light"] {
    color-scheme: light;
    --bg: #f7f6f2;
    --bg-2: #f0eee8;
    --surface: #ffffff;
    --surface-2: #f4f3ee;
    --elevated: #e8e6de;
    --hover: rgba(24, 24, 27, 0.042);
    --active: rgba(24, 24, 27, 0.08);
    --hairline: rgba(24, 24, 27, 0.085);
    --hairline-strong: rgba(24, 24, 27, 0.16);
    --orbit: rgba(24, 24, 27, 0.095);
    --ink: #18181b;
    --ink-2: #4b4b55;
    --ink-3: #63636e;
    --amber: #9a5804;
    --amber-dot: #d4821a;
    --amber-soft: rgba(212, 130, 26, 0.10);
    --blue: #1d4ed8;
    --blue-soft: rgba(29, 78, 216, 0.10);
    --violet: #6d28d9;
    --violet-soft: rgba(109, 40, 217, 0.10);
    --green: #15803d;
    --green-soft: rgba(21, 128, 61, 0.10);
    --teal: #0f766e;
    --rose: #be185d;
    --danger: #b91c1c;
    --danger-soft: rgba(185, 28, 28, 0.10);
    --cta-bg: #18181b;
    --cta-ink: #ffffff;
    --scrim: rgba(24, 24, 27, 0.28);
    --card-shadow: 0 1px 2px rgba(24, 24, 27, 0.05), 0 4px 14px rgba(24, 24, 27, 0.04);
    --peek-shadow: -12px 0 36px rgba(24, 24, 27, 0.10);
    --pop-shadow: 0 10px 30px rgba(24, 24, 27, 0.14);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.48 var(--font);
    -webkit-font-smoothing: antialiased;
    caret-color: var(--blue);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  ::selection { background: var(--blue-soft); color: var(--ink); }
  a { color: var(--blue); text-underline-offset: 3px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  ::placeholder { color: var(--ink-3); opacity: 1; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 5px; }

  * { scrollbar-width: thin; scrollbar-color: var(--hairline-strong) transparent; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 4px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-3); }
  .ico { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; flex: none; }

  /* ---------------- Top Header (48px, Borderless, Single Row) ---------------- */
  header {
    height: 48px;
    flex: none;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 18px;
    border-bottom: 1px solid var(--hairline);
    background: var(--bg);
    z-index: 20;
  }
  .brand-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 6px; margin-left: -6px; border-radius: 7px;
    transition: background 120ms ease;
  }
  .brand-btn:hover { background: var(--hover); }
  .brand-dot {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: var(--ink-3);
    transition: background 180ms ease;
  }
  .brand-dot.urgent { background: var(--amber-dot); }
  h1 {
    font-size: 14.5px; line-height: 1.2; font-weight: 650;
    letter-spacing: -0.02em; margin: 0; color: var(--ink);
  }
  h2 { font-size: 16px; line-height: 1.3; font-weight: 650; letter-spacing: -0.015em; margin: 0; color: var(--ink); }
  h3 { font-size: 13px; line-height: 1.35; font-weight: 600; margin: 0; color: var(--ink-2); }

  nav.top-nav { display: flex; align-items: center; gap: 18px; height: 100%; }
  nav.top-nav button {
    position: relative; height: 100%; padding: 0 2px;
    font-size: 13px; font-weight: 500; color: var(--ink-3);
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    transition: color 120ms ease;
  }
  nav.top-nav button:hover { color: var(--ink-2); }
  nav.top-nav button[aria-selected="true"] { color: var(--ink); font-weight: 560; }
  nav.top-nav button[aria-selected="true"]::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 1.5px; background: var(--ink);
  }
  .nav-num {
    font-size: 12px; font-variant-numeric: tabular-nums;
    color: var(--ink-3); font-weight: 550;
  }
  .nav-num.warm { color: var(--amber); font-weight: 650; }

  .spot-pill {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 2px; border-radius: 8px; background: var(--hover);
  }
  .spot-pill button {
    padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
    color: var(--ink-3); white-space: nowrap;
    transition: background 120ms ease, color 120ms ease;
  }
  .spot-pill button:hover { color: var(--ink-2); }
  .spot-pill button.on {
    background: var(--surface); color: var(--ink); font-weight: 560;
    box-shadow: var(--card-shadow);
  }

  .hdr-right {
    margin-left: auto; display: flex; align-items: center; gap: 6px; min-width: 0;
  }

  /* Compact Weekly Usage Pill */
  .usage {
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--ink-3); font-size: 12px; white-space: nowrap;
    font-variant-numeric: tabular-nums; padding: 4px 10px;
    border-radius: 7px; background: var(--hover);
  }
  .usage .bar { width: 48px; height: 5px; border-radius: 99px; background: var(--elevated); overflow: hidden; }
  .usage .fill { height: 100%; background: var(--blue); border-radius: 99px; }
  .usage.warn .fill { background: var(--amber-dot); }
  .usage.over .fill { background: var(--danger); }
  .usage .pct { color: var(--ink); font-weight: 600; }
  .usage .pace.warn { color: var(--amber); }
  .usage .pace.over { color: var(--danger); }
  .usage svg { display: block; }

  /* Borderless & Elevated Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 5px 11px; border-radius: 7px; font-size: 12.5px; font-weight: 500;
    color: var(--ink-2); background: var(--hover); white-space: nowrap;
    transition: background 120ms ease, color 120ms ease, opacity 120ms ease;
  }
  .btn:hover:not(:disabled) { background: var(--active); color: var(--ink); }
  .btn.sm { padding: 4px 9px; font-size: 12px; }
  .btn.ghost { background: transparent; color: var(--ink-2); }
  .btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .btn.icon { padding: 5px 6px; color: var(--ink-3); background: transparent; }
  .btn.icon:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .btn.primary {
    background: var(--cta-bg); color: var(--cta-ink); font-weight: 600;
  }
  .btn.primary:hover:not(:disabled) { opacity: 0.88; background: var(--cta-bg); color: var(--cta-ink); }
  .btn.warm {
    background: var(--amber-soft); color: var(--amber); font-weight: 600;
  }
  .btn.warm:hover:not(:disabled) { background: var(--amber-dot); color: #101012; }
  .btn.armed {
    background: var(--danger-soft); color: var(--danger); font-weight: 600;
  }
  .btn.elev {
    background: var(--surface); color: var(--ink); box-shadow: var(--card-shadow);
  }
  .btn.elev:hover:not(:disabled) { background: var(--surface-2); }

  .key-cap {
    display: inline-block; font: 12px/1 var(--mono); color: var(--ink-3);
    padding: 2px 5px; border-radius: 4px; background: var(--hover);
  }

  /* Status Dots */
  .dot {
    display: inline-block; width: 6.5px; height: 6.5px; border-radius: 50%; flex: none;
    background: var(--ink-3); opacity: 0.55;
  }
  .dot.waiting { background: var(--amber-dot); opacity: 1; }
  .dot.working { background: var(--blue); opacity: 1; }
  .dot.stalled { background: transparent; opacity: 1; box-shadow: inset 0 0 0 1.5px var(--blue); }
  .dot.done { background: var(--green); opacity: 1; }
  .dot.idle { background: var(--ink-3); opacity: 0.55; }
  .dot.shell, .dot.ended { background: transparent; opacity: 0.9; box-shadow: inset 0 0 0 1.4px var(--ink-3); }

  .poll-banner {
    flex: none; background: var(--danger-soft); color: var(--danger);
    padding: 7px 18px; font-size: 12.5px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .poll-banner[hidden] { display: none; }

  /* ---------------- Main Stage + Non-Blocking Right Peek Drawer ---------------- */
  .stage {
    flex: 1; min-height: 0; position: relative;
    display: flex; overflow: hidden;
  }
  main#map {
    flex: 1; min-width: 0; height: 100%;
    overflow-y: auto; position: relative;
  }
  main#map.no-scroll { overflow: hidden; }

  /* ---------------- TAB 1: GALAXY (Default, Cartographic Atlas) ---------------- */
  .galaxy-stage {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background:
      radial-gradient(circle at 50% 44%, color-mix(in srgb, var(--amber-dot) 3.5%, transparent), transparent 62%),
      var(--bg);
  }
  .gsvg {
    position: relative; width: 100%; height: 100%; display: block;
    cursor: grab; user-select: none;
  }
  .gsvg.panning { cursor: grabbing; }

  .g-orbit { fill: none; stroke: var(--orbit); stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: none; }
  .g-belt { fill: none; stroke: var(--orbit); stroke-width: 1; stroke-dasharray: 2 7; vector-effect: non-scaling-stroke; pointer-events: none; }

  .g-sun {
    fill: var(--surface); stroke: var(--hairline-strong); stroke-width: 1.5;
    vector-effect: non-scaling-stroke; cursor: pointer; transition: stroke 140ms ease, opacity 180ms ease;
  }
  .gsys.alert .g-sun { stroke: color-mix(in srgb, var(--amber-dot) 62%, transparent); }
  .gsys.nogoal .g-sun { fill: transparent; stroke-dasharray: 3 4; }
  .gsys.quiet-sys .g-sun { opacity: 0.45; }
  .gsys:hover .g-sun, .gsys:focus-visible .g-sun { stroke: var(--ink-2); stroke-width: 2; }
  .g-flare { fill: none; stroke: transparent; stroke-width: 1.5; vector-effect: non-scaling-stroke; pointer-events: none; }
  .gsys.alert .g-flare { stroke: var(--amber-dot); opacity: 0.35; animation: beacon 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }

  .slabel {
    fill: var(--ink); font-weight: 600; font-size: calc(13.5px / var(--k, 1));
    letter-spacing: -0.01em; pointer-events: none;
    paint-order: stroke; stroke: var(--bg); stroke-width: calc(3.5px / var(--k, 1));
  }
  .scount {
    fill: var(--ink-3); font-size: calc(12px / var(--k, 1)); pointer-events: none;
    paint-order: stroke; stroke: var(--bg); stroke-width: calc(3px / var(--k, 1));
  }
  .gsys.alert .scount { fill: var(--amber); font-weight: 600; }
  .gsvg.insys .gsys:not(.away) .slabel, .gsvg.insys .gsys:not(.away) .scount { display: none; }

  .gplanet { cursor: pointer; transition: opacity 160ms ease; }
  .gplanet .body { fill: var(--ink-3); stroke: var(--bg); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .gplanet.live .body { fill: var(--ink-2); }
  .gplanet.st-working .body { fill: var(--blue); }
  .gplanet.st-done .body { fill: var(--green); }
  .gplanet.needs .body { fill: var(--amber-dot); }
  .gplanet.dormant:not(.needs) .body { fill: var(--ink-3); opacity: 0.36; }
  .gplanet .pring { fill: none; stroke: var(--ink-3); stroke-width: 1.25; opacity: 0.45; vector-effect: non-scaling-stroke; pointer-events: none; }
  .gplanet.needs .pring { stroke: var(--amber-dot); opacity: 0.55; }
  .gplanet:not(.live) .pring { display: none; }
  .gplanet .halo { fill: none; stroke: transparent; stroke-width: 1.6; vector-effect: non-scaling-stroke; pointer-events: none; }
  .gplanet.needs .halo { stroke: var(--amber-dot); animation: beacon 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes beacon { 0% { opacity: 0.72; transform: scale(0.94); } 100% { opacity: 0; transform: scale(1.85); } }
  .gplanet:hover .body, .gplanet.pin .body, .gplanet:focus-visible .body { stroke: var(--ink); stroke-width: 2.5; }
  .gplanet.spot-dim { opacity: 0.14; }

  .plabel {
    fill: var(--ink-2); font-size: calc(12px / var(--k, 1)); pointer-events: none;
    paint-order: stroke; stroke: var(--bg); stroke-width: calc(3.8px / var(--k, 1));
  }
  .gplanet.needs .plabel { fill: var(--ink); font-weight: 560; }
  .gsvg.far .plabel { display: none; }
  .gsvg:not(.incity) .gplanet.needs:not(.away) .plabel { display: inline; }
  .gsvg.insys .gplanet:not(.away):not(.dormant) .plabel { display: inline; }
  .gsvg:not(.close):not(.insys) .gplanet:not(.needs):not(.st-working):not(.near):not(.pin):not(.hit) .plabel { display: none; }
  .gplanet.dormant:not(.needs):not(.near):not(.pin) .plabel { display: none; }
  .gplanet.spot-dim .plabel { display: none; }
  .plabel.lhide { visibility: hidden; }
  .gplanet:hover .plabel.lhide, .gplanet.pin .plabel.lhide, .gplanet:focus-visible .plabel.lhide { visibility: visible; display: inline; }

  .gsvg.insys .gplanet.away, .gsvg.insys .gsys.away, .gsvg.insys .glink.away { opacity: 0.08; }
  .gsvg.insys .gplanet.away .plabel { display: none; }
  .gsvg.incity .gplanet:not(.pin) { opacity: 0.1; }
  .gsvg.incity .ghubs, .gsvg.incity .glinks, .gsvg.incity .gsys { opacity: 0.12; }

  .ghub polygon { fill: var(--surface); stroke: var(--ink-3); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
  .ghub.near polygon { stroke: var(--ink); fill: var(--surface-2); }
  .hlabel { fill: var(--ink-2); font-size: calc(12px / var(--k, 1)); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: calc(3px / var(--k, 1)); }
  .groad { fill: none; stroke: var(--ink-3); stroke-width: 1.2; vector-effect: non-scaling-stroke; stroke-dasharray: 4 4; opacity: 0.35; pointer-events: none; }
  .groad.on { opacity: 0.95; stroke: var(--ink-2); stroke-width: 1.8; }
  .groad.hidden, .ghub.hidden, .glink.hidden { display: none; }
  .gsvg.far .ghubs { display: none; }
  .gsvg.focusing .groad:not(.on), .gsvg.focusing .glink:not(.on) { opacity: 0.05; }
  .gsvg.focusing .ghub:not(.near), .gsvg.hubfocus .ghub:not(.near) { opacity: 0.22; }
  .gsvg.focusing .gplanet:not(.near), .gsvg.hubfocus .gplanet:not(.near) { opacity: 0.18; }
  .gsvg.hubfocus .gplanet.near .plabel, .gsvg.focusing:not(.far) .gplanet.near .plabel { display: inline; }

  .glink { fill: none; stroke-width: 1.3; vector-effect: non-scaling-stroke; opacity: 0.32; pointer-events: none; transition: opacity 140ms ease; }
  .gsvg.focusing .glink.on { opacity: 0.95; stroke-width: 2.1; }
  .k-spinoff { stroke: var(--violet); --sw: var(--violet); }
  .k-thread { stroke: var(--teal); --sw: var(--teal); }
  .k-file { stroke: var(--ink-3); --sw: var(--ink-3); }
  .k-project { stroke: var(--ink-3); stroke-dasharray: 5 4; --sw: var(--ink-3); }
  .k-person { stroke: var(--rose); stroke-dasharray: 1 4; --sw: var(--rose); }
  .garrowhead { fill: var(--violet); }

  /* Cities (multi-session ring around an open planet) */
  .cityring { fill: var(--blue-soft); stroke: var(--hairline-strong); stroke-dasharray: 3 5; vector-effect: non-scaling-stroke; }
  .spoke { stroke: var(--hairline-strong); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .cityroad { fill: none; stroke: var(--violet); stroke-width: 1.8; vector-effect: non-scaling-stroke; }
  .gcity .body { fill: var(--ink-3); stroke: var(--bg); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .gcity .halo { fill: none; stroke: transparent; stroke-width: 2; vector-effect: non-scaling-stroke; }
  .gcity.live, .gcity.reopen { cursor: pointer; }
  .gcity.live .body { fill: var(--ink-2); }
  .gcity.st-working .body { fill: var(--blue); }
  .gcity.st-done .body { fill: var(--green); }
  .gcity.st-waiting .body { fill: var(--amber-dot); }
  .gcity.st-waiting .halo { stroke: var(--amber-dot); animation: beacon 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .gcity.live:hover .body { stroke: var(--ink); }
  .gcity.reopen:hover .body { stroke: var(--ink-2); stroke-dasharray: 2 2; }
  .clabel { fill: var(--ink); font-size: calc(12px / var(--k, 1)); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: calc(3px / var(--k, 1)); }

  /* Minimal Floating Galaxy HUD */
  .gcrumbs {
    position: absolute; top: 14px; left: 18px; z-index: 5;
    max-width: calc(100% - 36px);
    display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(12px);
    border-radius: 10px; padding: 5px 10px;
    box-shadow: var(--card-shadow);
    font-size: 12.5px;
  }
  .gcrumbs .crumb-link { color: var(--ink-2); font-weight: 500; padding: 2px 5px; border-radius: 5px; }
  .gcrumbs .crumb-link:hover { background: var(--hover); color: var(--ink); }
  .gcrumbs .cur { color: var(--ink); font-weight: 600; }
  .gcrumbs .sep { color: var(--ink-3); }
  .gcrumbs .gcount { color: var(--ink-3); font-size: 12px; }
  .gcrumbs .gcount.alert { color: var(--amber); font-weight: 600; }
  .gdock {
    display: inline-flex; gap: 6px; align-items: center; padding: 2px 8px;
    border-radius: 6px; background: var(--blue-soft); color: var(--blue); font-size: 12px; font-weight: 550;
  }
  .gdock button { color: var(--ink); font-weight: 600; padding: 1px 5px; border-radius: 4px; background: var(--surface); }

  .g-hud-bl {
    position: absolute; bottom: 16px; left: 18px; z-index: 5;
    display: flex; align-items: center; gap: 4px;
    background: color-mix(in srgb, var(--surface) 90%, transparent);
    backdrop-filter: blur(12px);
    padding: 4px; border-radius: 10px; box-shadow: var(--card-shadow);
  }
  .g-hud-bl button {
    padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--ink-2);
    transition: background 120ms ease, color 120ms ease;
  }
  .g-hud-bl button:hover { background: var(--hover); color: var(--ink); }
  .g-hud-bl button.on { background: var(--active); color: var(--ink); font-weight: 560; }

  .glegend-pop {
    position: absolute; left: 18px; bottom: 58px; z-index: 6;
    width: 280px; background: var(--surface); border-radius: 11px;
    padding: 12px 14px; box-shadow: var(--pop-shadow);
    display: flex; flex-direction: column; gap: 7px; font-size: 12px; color: var(--ink-2);
  }
  .glegend-pop[hidden] { display: none; }
  .glegend-pop label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .glegend-pop .swatch { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--sw); }
  .glegend-pop .k-project .swatch, .glegend-pop .k-person .swatch { border-top-style: dashed; }
  .glegend-pop hr { border: 0; border-top: 1px solid var(--hairline); width: 100%; margin: 2px 0; }

  .gmini {
    position: absolute; bottom: 16px; right: 18px; z-index: 5;
    width: 176px; height: 114px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(10px);
    border-radius: 10px; padding: 5px; box-shadow: var(--card-shadow);
    cursor: crosshair; opacity: 0; pointer-events: none; transition: opacity 180ms ease;
  }
  .gmini.on { opacity: 1; pointer-events: auto; }
  .gmini svg { width: 100%; height: 100%; display: block; }
  .gmini .msun { fill: var(--hover); stroke: var(--hairline-strong); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .gmini .mdot { fill: var(--ink-3); }
  .gmini .mdot.working { fill: var(--blue); }
  .gmini .mdot.needs { fill: var(--amber-dot); }
  .gmini .mview { fill: var(--hover); stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; }

  .gtip {
    position: absolute; z-index: 8; max-width: 310px;
    background: var(--surface); border-radius: 10px;
    padding: 10px 13px; pointer-events: none;
    display: flex; flex-direction: column; gap: 3px;
    box-shadow: var(--pop-shadow); font-size: 12.5px; line-height: 1.42;
  }
  .gtip[hidden] { display: none; }
  .gtip b { font-size: 13px; font-weight: 600; color: var(--ink); }
  .gtip .gt-ask { color: var(--ink-2); margin-top: 2px; }

  /* ---------------- TAB 2: SPACES (Bird's-Eye Spatial Workspace & Goal Map) ---------------- */
  .spaces-wrap {
    padding: 18px 22px 48px;
    display: flex; flex-direction: column; gap: 16px;
    max-width: 1680px; margin: 0 auto;
  }
  .spaces-bar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px;
  }
  .spaces-bar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chk-label {
    display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3);
    font-size: 12px; cursor: pointer; user-select: none; padding: 3px 6px; border-radius: 6px;
  }
  .chk-label:hover { color: var(--ink); background: var(--hover); }

  /* Scratch Shelf */
  .region {
    background: var(--surface); border-radius: 12px;
    padding: 10px 10px 8px; box-shadow: var(--card-shadow);
    transition: opacity 150ms ease, box-shadow 150ms ease;
  }
  .region.dimmed { opacity: 0.28; }
  .region.drop { box-shadow: 0 0 0 2px var(--blue), var(--card-shadow); }
  .region.dragging { opacity: 0.45; }
  .region.scratch { padding: 11px 14px 12px; }
  .scratch-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 4px 12px;
  }

  .rhead {
    display: flex; align-items: center; gap: 8px;
    padding: 2px 6px 8px; cursor: grab;
  }
  .region.scratch .rhead { cursor: default; padding-left: 2px; padding-right: 2px; }
  .rhead h3 {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em;
  }
  .rhead .rcount { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rhead .racts {
    display: inline-flex; align-items: center; gap: 2px;
    opacity: 0; transition: opacity 120ms ease;
  }
  .region:hover .rhead .racts, .region:focus-within .rhead .racts, .rhead .racts.armed { opacity: 1; }

  .ws-groups {
    display: flex; flex-wrap: wrap; align-items: flex-start; gap: 22px;
  }
  .group { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 10px; }
  .group.drop { border-radius: 12px; box-shadow: inset 0 0 0 2px var(--blue); padding: 6px; }
  .g-hdr {
    display: flex; align-items: center; gap: 8px; padding: 0 4px;
  }
  .g-hdr h3 {
    font-size: 12px; font-weight: 600; color: var(--ink-3);
    letter-spacing: 0.03em; text-transform: uppercase;
  }
  .g-hdr .rcount { font-size: 12px; color: var(--ink-3); }
  .g-hdr .gacts { display: inline-flex; gap: 2px; opacity: 0; transition: opacity 120ms ease; }
  .group:hover .g-hdr .gacts, .group:focus-within .g-hdr .gacts, .g-hdr .gacts.armed { opacity: 1; }

  .cols { display: flex; align-items: flex-start; gap: 12px; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .newzone {
    display: none; padding: 12px; border-radius: 10px;
    border: 1px dashed var(--hairline-strong);
    color: var(--ink-3); text-align: center; font-size: 12px;
  }
  body.dragging-session .newzone { display: block; }
  .newzone.drop { border-color: var(--blue); color: var(--ink); background: var(--blue-soft); }

  /* Session Row ("Town") — zero wireframe boxes, clean hover controls */
  .town {
    position: relative; width: 100%; text-align: left;
    padding: 7px 8px; border-radius: 8px; cursor: pointer;
    display: flex; flex-direction: column; gap: 2px;
    transition: background 110ms ease, opacity 150ms ease;
  }
  .town:hover { background: var(--hover); }
  .town.on { background: var(--active); }
  .town.sel { box-shadow: inset 0 0 0 1.5px var(--blue); }
  .town.dimmed { opacity: 0.24; }
  .town.dragging { opacity: 0.35; }
  .town.child { padding-left: 20px; }
  .town.ticked .town-title::before { content: "✓ "; color: var(--green); }
  .town.shell .town-title { color: var(--ink-3); font-weight: 450; }

  .town-top { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .town-title {
    font-size: 13px; font-weight: 500; color: var(--ink-2); letter-spacing: -0.008em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0;
  }
  .town.waiting .town-title { color: var(--ink); font-weight: 560; }
  .town-age {
    font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; flex: none;
    transition: opacity 100ms ease;
  }
  .town.waiting .town-age { color: var(--amber); font-weight: 550; }
  .town.working .town-age { color: var(--blue); }
  .agent-tag {
    font-size: 12px; color: var(--violet); background: var(--violet-soft);
    border-radius: 4px; padding: 0 5px; flex: none;
  }

  .town-ask {
    padding-left: 13.5px; font-size: 12px; line-height: 1.4; color: var(--ink-3);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; overflow-wrap: anywhere;
  }
  .town.waiting .town-ask { color: var(--ink-2); }

  .town-acts {
    position: absolute; right: 6px; top: 4px;
    display: inline-flex; align-items: center; gap: 2px;
    padding: 2px 3px; border-radius: 7px;
    background: var(--surface); box-shadow: var(--card-shadow);
    opacity: 0; pointer-events: none; transition: opacity 110ms ease;
  }
  .town:hover .town-acts, .town:focus-within .town-acts, .town-acts.armed { opacity: 1; pointer-events: auto; }
  .town:hover .town-age, .town:focus-within .town-age { opacity: 0; }
  .town-acts button {
    padding: 3px 5px; border-radius: 5px; font-size: 12px; color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 3px;
  }
  .town-acts button:hover { background: var(--hover); color: var(--ink); }
  .town-acts button.armed { color: var(--danger); font-weight: 600; }

  .rename {
    flex: 1; min-width: 0; background: var(--bg); color: var(--ink);
    border: 1px solid var(--blue); border-radius: 5px; font: inherit; font-weight: 600; padding: 2px 6px;
  }

  /* Subagent Lane */
  .lane {
    margin: 5px 0 0 13px; border-left: 1px solid var(--hairline-strong); padding-left: 9px;
    display: flex; flex-direction: column; gap: 3px; cursor: pointer;
  }
  .sub { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .sub .town-top { gap: 6px; }
  .sub .what { color: var(--ink-2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub .detail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 13px; color: var(--ink-3); }
  .sub.running .dot { background: var(--blue); opacity: 1; animation: pulse 1.4s ease-in-out infinite; }
  .sub.done .dot { background: var(--green); opacity: 1; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  /* By-Goal Board inside Spaces */
  .goal-board { display: flex; flex-direction: column; gap: 18px; }
  .goal-sec {
    background: var(--surface); border-radius: 12px; padding: 14px 16px;
    box-shadow: var(--card-shadow);
  }
  .goal-sec.drop { box-shadow: 0 0 0 2px var(--blue), var(--card-shadow); }
  .goal-sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .goal-swatch { width: 9px; height: 9px; border-radius: 3px; background: var(--h, var(--ink-3)); flex: none; }
  .goal-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 10px; }
  .wcard {
    background: var(--bg-2); border-radius: 10px; padding: 11px 13px;
    display: flex; flex-direction: column; gap: 6px; cursor: pointer;
    transition: background 120ms ease;
  }
  .wcard:hover { background: var(--surface-2); }
  .wcard.needs { background: var(--amber-soft); }
  .wcard.parked { opacity: 0.78; }
  .wcard.drop { box-shadow: 0 0 0 2px var(--blue); }
  .wcard-head { display: flex; align-items: center; gap: 7px; cursor: grab; min-width: 0; }
  .wcard-name { font-weight: 600; font-size: 13px; color: var(--ink); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wcard-next { font-size: 12.5px; line-height: 1.42; color: var(--ink-2); overflow-wrap: anywhere; }
  .wcard-acts { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 2px; }

  /* Wiring (Links) Sub-view inside Spaces */
  .wmap {
    position: relative; display: grid;
    grid-template-columns: minmax(210px, 1fr) minmax(260px, 1.35fr) minmax(180px, 0.9fr);
    column-gap: clamp(32px, 5vw, 90px); align-items: start;
  }
  .wmap svg.links { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .wmap path { fill: none; opacity: 0.16; transition: opacity 140ms ease; }
  .wmap.focused path { opacity: 0.04; }
  .wmap.focused path.on { opacity: 0.92; }
  .wmap.focused [data-key]:not(.on) { opacity: 0.28; }
  .wmap .pinned { box-shadow: 0 0 0 2px var(--blue); }
  .dcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .dhead { font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.03em; padding-bottom: 2px; }
  .dbox, .mitem, .mgoal {
    background: var(--surface); border-radius: 10px; padding: 9px 11px;
    box-shadow: var(--card-shadow); transition: opacity 140ms ease;
  }
  .mitem.needs { background: var(--amber-soft); }
  .mitem.parked { opacity: 0.78; }
  .dbox.drop, .mitem.drop, .mgoal.drop { box-shadow: 0 0 0 2px var(--blue), var(--card-shadow); }
  .dtitle { display: flex; gap: 7px; align-items: center; font-weight: 600; margin-bottom: 4px; min-width: 0; }
  .dtitle .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mtab {
    display: flex; gap: 7px; align-items: center; padding: 4px 6px; border-radius: 6px;
    width: 100%; text-align: left;
  }
  .mtab:hover { background: var(--hover); }
  .mtab .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
  .mtab.waiting .name { color: var(--amber); font-weight: 600; }
  .outbox { border: 1px dashed var(--hairline-strong); background: transparent; box-shadow: none; color: var(--ink-3); text-align: center; font-size: 12px; padding: 12px; }

  /* Collapsible Disclosures */
  details.fold {
    background: var(--surface); border-radius: 11px; padding: 9px 13px; box-shadow: var(--card-shadow);
  }
  details.fold > summary {
    cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 12.5px; color: var(--ink-2);
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "▸"; color: var(--ink-3); font-size: 12px; }
  details.fold[open] > summary::before { content: "▾"; }
  details.fold .fold-body { margin-top: 10px; }

  .cap-row {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px;
    padding: 7px 4px; border-top: 1px solid var(--hairline); font-size: 12.5px;
  }
  .cap-row.go { cursor: pointer; border-radius: 6px; }
  .cap-row.go:hover { background: var(--hover); }
  .cap-row select {
    background: var(--bg-2); color: var(--ink-2); border: 0;
    border-radius: 6px; padding: 4px 8px; font-size: 12px; max-width: 210px;
  }

  /* ---------------- TAB 3: INBOX (Fast Keyboard Split) ---------------- */
  .inbox-split {
    display: grid; grid-template-columns: 356px 1fr; height: 100%; min-height: 0;
  }
  .inbox-rail {
    background: var(--bg-2); border-right: 1px solid var(--hairline);
    display: flex; flex-direction: column; min-height: 0;
  }
  .inbox-rail-top {
    padding: 10px 12px; border-bottom: 1px solid var(--hairline);
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  }
  .inbox-rail-list { flex: 1; overflow-y: auto; padding: 8px; }
  .inbox-sep {
    padding: 12px 10px 5px; font-size: 12px; font-weight: 560; color: var(--ink-3);
    display: flex; align-items: center; justify-content: space-between;
  }
  .inbox-row {
    position: relative; width: 100%; text-align: left;
    padding: 10px 11px; border-radius: 8px;
    display: flex; flex-direction: column; gap: 3px;
    transition: background 110ms ease;
  }
  .inbox-row:hover { background: var(--hover); }
  .inbox-row.on { background: var(--active); }
  .inbox-row .row-hover-acts {
    position: absolute; right: 7px; top: 7px; display: inline-flex; gap: 2px;
    background: var(--surface); border-radius: 6px; padding: 2px; box-shadow: var(--card-shadow);
    opacity: 0; pointer-events: none; transition: opacity 100ms ease;
  }
  .inbox-row:hover .row-hover-acts, .inbox-row:focus-within .row-hover-acts { opacity: 1; pointer-events: auto; }
  .inbox-row:hover .town-age { opacity: 0; }

  .inbox-detail {
    display: flex; flex-direction: column; min-height: 0; background: var(--bg);
  }
  .inbox-detail-head {
    padding: 12px 24px; border-bottom: 1px solid var(--hairline);
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .inbox-detail-scroll { flex: 1; overflow-y: auto; padding: 22px 28px 28px; }
  .inbox-inner { max-width: 740px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  /* ---------------- SHARED NON-BLOCKING RIGHT PEEK DRAWER ---------------- */
  aside#peek {
    width: 500px; max-width: 46vw; height: 100%; flex: none;
    background: var(--surface); border-left: 1px solid var(--hairline);
    box-shadow: var(--peek-shadow);
    display: flex; flex-direction: column; z-index: 15;
    animation: slideIn 170ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  aside#peek[hidden] { display: none; }
  @keyframes slideIn { from { transform: translateX(22px); opacity: 0; } to { transform: none; opacity: 1; } }

  .peek-top {
    padding: 12px 18px; border-bottom: 1px solid var(--hairline);
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none;
  }
  .peek-crumb {
    font-size: 12px; color: var(--ink-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .peek-crumb strong { color: var(--ink-2); font-weight: 560; }
  .peek-acts { display: flex; align-items: center; gap: 4px; flex: none; }

  .peek-tabs {
    display: flex; align-items: center; gap: 2px; padding: 6px 16px;
    border-bottom: 1px solid var(--hairline); flex: none; overflow-x: auto;
  }
  .peek-tabs button {
    padding: 4px 9px; border-radius: 6px; font-size: 12px; font-weight: 500;
    color: var(--ink-3); white-space: nowrap; transition: background 110ms ease, color 110ms ease;
  }
  .peek-tabs button:hover { background: var(--hover); color: var(--ink); }
  .peek-tabs button[aria-selected="true"] { background: var(--active); color: var(--ink); font-weight: 600; }

  .peek-scroll {
    flex: 1; overflow-y: auto; padding: 18px 20px 24px;
    display: flex; flex-direction: column; gap: 14px;
    font-variant-numeric: tabular-nums;
  }
  .peek-title {
    font-size: 19px; font-weight: 650; letter-spacing: -0.02em; margin: 0; line-height: 1.25; color: var(--ink);
  }
  .peek-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); }

  .dec-box {
    background: var(--amber-soft); border-radius: 10px; padding: 13px 15px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .dec-box.quiet { background: var(--bg-2); }
  .dec-lbl { font-size: 12px; font-weight: 600; color: var(--amber); }
  .dec-box.quiet .dec-lbl { color: var(--ink-3); }
  .dec-txt { font-size: 14px; font-weight: 520; line-height: 1.48; color: var(--ink); margin: 0; overflow-wrap: anywhere; }
  .qopts { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
  .qopt {
    background: var(--surface); color: var(--ink);
    padding: 5px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500;
    box-shadow: var(--card-shadow); max-width: 100%; text-align: left;
    transition: background 120ms ease;
  }
  .qopt:hover:not(:disabled) { background: var(--elevated); }

  /* Rendered Markdown */
  .md { font-size: 13.5px; line-height: 1.64; color: var(--ink-2); overflow-wrap: anywhere; }
  .md > * { margin: 0 0 11px; max-width: 72ch; }
  .md > .tbl, .md > pre { max-width: 100%; }
  .md > :last-child { margin-bottom: 0; }
  .md h3 { font-size: 14px; margin-top: 15px; color: var(--ink); }
  .md ul, .md ol { padding-left: 20px; }
  .md li { margin: 4px 0; }
  .md li.sub { margin-left: 16px; list-style-type: circle; }
  .md strong { color: var(--ink); font-weight: 600; }
  .md code { background: var(--bg-2); border-radius: 4px; padding: 1px 5px; font: 12px var(--mono); color: var(--ink); }
  .md pre { background: var(--bg-2); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font: 12px/1.5 var(--mono); color: var(--ink); }
  .md blockquote { border-left: 2px solid var(--hairline-strong); padding-left: 12px; color: var(--ink-3); margin-left: 0; }
  .md .tbl { overflow-x: auto; background: var(--bg-2); border-radius: 8px; }
  .md table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .md th { text-align: left; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .md th, .md td { padding: 7px 10px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  .md td.short { white-space: nowrap; }
  .md tr:last-child td { border-bottom: 0; }

  /* Sticky Composer */
  .peek-comp {
    flex: none; padding: 12px 18px 15px;
    border-top: 1px solid var(--hairline); background: var(--bg-2);
  }
  .comp-card {
    background: var(--surface); border-radius: 10px; padding: 10px 12px;
    box-shadow: var(--card-shadow);
  }
  .comp-card textarea {
    width: 100%; background: transparent; border: 0; outline: none; resize: none;
    font-size: 13px; line-height: 1.48; color: var(--ink); min-height: 48px;
  }
  .comp-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .comp-hint { font-size: 12px; color: var(--ink-3); }
  .comp-hint.fail { color: var(--danger); }

  /* Work Item sections inside Peek (Galaxy) */
  .gp-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .gp-sec { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--hairline); }
  .gp-links { display: flex; flex-direction: column; gap: 5px; }
  .gp-link {
    text-align: left; background: var(--bg-2); border-radius: 8px;
    color: var(--ink); padding: 8px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    transition: background 110ms ease;
  }
  .gp-link:hover { background: var(--elevated); }
  .gp-list { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 12.5px; }
  .gp-list li { margin: 3px 0; }

  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    border-radius: 99px; padding: 2px 8px; font-size: 12px;
    color: var(--ink-2); background: var(--bg-2);
  }
  .chip.st-waiting { color: var(--amber); background: var(--amber-soft); font-weight: 560; }
  .chip.st-working { color: var(--blue); background: var(--blue-soft); }
  .chip.st-done { color: var(--green); background: var(--green-soft); }
  .chip.lost { color: var(--danger); background: var(--danger-soft); text-decoration: line-through; }
  .chip.src { color: var(--blue); background: var(--blue-soft); }

  /* Galaxy History Timeline SVG */
  .ghistwrap { overflow-x: auto; }
  .ghist { display: block; }
  .gday { stroke: var(--hairline); stroke-width: 1; }
  .gdaylabel { fill: var(--ink-3); font-size: 12px; }
  .grlabel { fill: var(--ink); font-size: 12px; }
  .grbar { fill: var(--elevated); }
  .grow.live .grbar { fill: var(--ink-3); }
  .grow.live.st-working .grbar { fill: var(--blue); }
  .grow.live.st-waiting .grbar { fill: var(--amber-dot); }
  .grow.live.st-done .grbar { fill: var(--green); }
  .grow.live { cursor: pointer; }
  .grow.live:hover .grlabel { text-decoration: underline; }
  .grtick { stroke: var(--ink); stroke-width: 1; opacity: 0.55; }
  .grsub { fill: var(--violet); font-size: 12px; }
  .grspin { fill: none; stroke: var(--violet); stroke-width: 1.5; }

  /* Diagnostics Tabs (Timeline / Waterfall / Agents / Context / Handoffs) */

<body>
<header>
  <button type="button" class="brand-btn" id="homeBtn" title="Return to Galaxy overview">
    <span class="brand-dot" id="brandDot" aria-hidden="true"></span>
    <h1>Overworld</h1>
  </button>
  <nav class="top-nav" role="tablist" aria-label="Views">
    <button type="button" role="tab" id="navGalaxy" data-view="galaxy" aria-selected="true" title="Spatial map of goals, work items, and links (1 or g)">Galaxy</button>
    <button type="button" role="tab" id="navSpaces" data-view="spaces" aria-selected="false" title="Bird's-eye map of workspaces, groups, and goals (2 or s)">Spaces</button>
    <button type="button" role="tab" id="navInbox" data-view="inbox" aria-selected="false" title="Fast keyboard triage split for sessions needing you (3 or i)">
      Inbox <span class="nav-num" id="inboxCount"></span>
    </button>
  </nav>
  <div class="spot-pill" id="spotWrap" role="group" aria-label="Spotlight filter">
    <button type="button" class="on" data-spot="all">All</button>
    <button type="button" data-spot="needs">Needs you</button>
  </div>
  <div class="hdr-right">
    <div class="usage" id="usage" title="Weekly usage limit, same as the Claude desktop app">
      <span>Usage...</span>
    </div>
    <button type="button" class="btn ghost sm" id="searchBtn" aria-label="Search sessions and work items" title="Search everywhere (key: /)">
      <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <span class="search-lbl">Search</span>
      <span class="key-cap">/</span>
    </button>
    <button type="button" class="btn ghost sm" id="themeBtn" title="Switch Dark / Light theme (key: t)">Light</button>
    <button type="button" class="btn icon sm" id="helpBtn" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (key: ?)">?</button>
  </div>
</header>
<div class="poll-banner" id="pollBanner" role="alert" hidden></div>

<div class="stage">
  <main id="map" tabindex="-1"></main>
  <aside id="peek" role="region" aria-label="Session and work item details" hidden></aside>
</div>

<div class="modal-scrim" id="searchScrim" role="dialog" aria-modal="true" aria-labelledby="searchTitle" hidden></div>
<div class="modal-scrim" id="helpScrim" role="dialog" aria-modal="true" aria-labelledby="helpTitle" hidden></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ---------------- Core Helpers & Icons ---------------- */
const SVGNS = "http://www.w3.org/2000/svg";
const STALLED_MS = 20 * 60 * 1000;
const STALE_ASK_MS = 24 * 60 * 60 * 1000;
const ORDER = { waiting: 0, working: 1, stalled: 2, done: 3, idle: 4, ended: 5, shell: 6 };
const STATUS_LABEL = {
  waiting: "Needs you",
  working: "Working",
  stalled: "Stalled",
  done: "Finished",
  idle: "Idle",
  ended: "Ended",
  shell: "Shell"
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (tag === "button") e.type = "button";
  return e;
}
function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function icon(name) {
  const paths = {
    reply: '<path d="M6.5 4.5L3 8l3.5 3.5"/><path d="M3 8h6.5a3.5 3.5 0 0 1 0 7H8"/>',
    open: '<path d="M9.5 2.5h4v4"/><path d="M13.5 2.5L7.5 8.5"/><path d="M12.5 9v4a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h4"/>',
    clock: '<circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2.2 1.3"/>',
    edit: '<path d="M11 2.5l2.5 2.5-7.5 7.5H3.5V10z"/>',
    check: '<path d="M3 8.5l3.2 3.2L13 4.5"/>',
    close: '<path d="M4 4l8 8M12 4l-8 8"/>',
    sparkle: '<path d="M8 2l1.4 3.6L13 7l-3.6 1.4L8 12l-1.4-3.6L3 7l3.6-1.4z"/>',
    plus: '<path d="M8 3v10M3 8h10"/>',
    dock: '<rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M9 3v10"/>'
  };
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("class", "ico");
  s.setAttribute("viewBox", "0 0 16 16");
  s.setAttribute("fill", "none");
  s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "1.6");
  s.setAttribute("stroke-linecap", "round");
  s.setAttribute("stroke-linejoin", "round");
  s.setAttribute("aria-hidden", "true");
  s.innerHTML = paths[name] || "";
  return s;
}

function remember(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function recalled(k, fallback) { try { const v = localStorage.getItem(k); return v == null ? fallback : v; } catch (e) { return fallback; } }
function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 90) return "now";
  if (s < 5400) return Math.round(s / 60) + "m";
  if (s < 129600) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
}
function dur(s) {
  s = Math.max(0, Number(s) || 0);
  if (s < 60) return Math.round(s) + "s";
  if (s < 3600) return Math.floor(s / 60) + "m" + String(Math.round(s % 60)).padStart(2, "0");
  if (s < 172800) return (s / 3600).toFixed(1) + "h";
  return (s / 86400).toFixed(1) + "d";
}
function spanBetween(a, b) {
  const ta = Date.parse(a), tb = Date.parse(b);
  if (!Number.isFinite(ta) || !Number.isFinite(tb)) return "";
  return dur((tb - ta) / 1000);
}
function fmtSpan(d) {
  d = Math.max(0, Number(d) || 0);
  const h = Math.floor(d / 3600), m = Math.floor((d % 3600) / 60);
  return h >= 24 ? `${Math.floor(h / 24)}d ${h % 24}h` : `${h}h ${m}m`;
}
function when(t) { return new Date(t * 1000).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }); }
function gAgo(t) { return t ? ago(new Date(t * 1000).toISOString()) + (Date.now() / 1000 - t < 90 ? "" : " ago") : "never"; }

/* ---------------- Theme (Default: Obsidian Dark) ---------------- */
const themeBtn = document.getElementById("themeBtn");
let theme = recalled("ow.theme", "dark") === "light" ? "light" : "dark";
function applyTheme(next) {
  theme = next === "light" ? "light" : "dark";
  if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
  else document.documentElement.removeAttribute("data-theme");
  themeBtn.textContent = theme === "light" ? "Dark" : "Light";
  themeBtn.setAttribute("aria-label", theme === "light" ? "Switch to dark mode" : "Switch to light mode");
  remember("ow.theme", theme);
}
applyTheme(theme);
themeBtn.onclick = () => applyTheme(theme === "dark" ? "light" : "dark");

/* ---------------- Unified State & Truth Predicate ---------------- */
const map = document.getElementById("map");
const peekEl = document.getElementById("peek");
const brandDot = document.getElementById("brandDot");
const inboxCountEl = document.getElementById("inboxCount");
const spotWrap = document.getElementById("spotWrap");
const searchScrim = document.getElementById("searchScrim");
const helpScrim = document.getElementById("helpScrim");
const toastBox = document.getElementById("toasts");

let last = null;
let view = recalled("ow.view.v2", "galaxy");
if (!["galaxy", "spaces", "inbox"].includes(view)) view = "galaxy";
let spotlight = recalled("ow.spot", "all") === "needs";
let spacesMode = recalled("ow.spacesMode", "workspace");
if (!["workspace", "goal", "wiring"].includes(spacesMode)) spacesMode = "workspace";
let showShells = recalled("ow.shells", "0") === "1";
let linksShowInactive = recalled("ow.linksInactive", "0") === "1";

let dragging = null, draggingRegion = null, draggingItem = null;
let armed = null, armedTimer = null;
let editing = false, naming = null;
let sel = null;
const ticked = new Set(), sent = new Set();

// Client-side dismiss store keyed by sessionId -> ask text so a new reply automatically resurfaces the ask.
let dismissed = {};
try { dismissed = JSON.parse(localStorage.getItem("ow.dismissed") || "{}"); } catch (e) { dismissed = {}; }
function saveDismissed() { remember("ow.dismissed", JSON.stringify(dismissed)); }
function askTextOf(t) { return ((t.action && t.action.action) || t.ask || t.recap || "").trim(); }
function isDismissed(t) { return !!(dismissed[t.id] && dismissed[t.id] === askTextOf(t)); }
function dismissSession(t) {
  const prev = dismissed[t.id];
  dismissed[t.id] = askTextOf(t);
  saveDismissed();
  invalidateViews();
  render(last);
  showToast(`Dismissed "${t.title}" until it replies again`, "ok", "Undo", () => {
    if (prev == null) delete dismissed[t.id]; else dismissed[t.id] = prev;
    saveDismissed();
    invalidateViews();
    render(last);
  });
}
function restoreSession(t) {
  delete dismissed[t.id];
  saveDismissed();
  invalidateViews();
  render(last);
}

function waitedMs(t) {
  const ms = Date.parse(t.since);
  if (Number.isFinite(ms)) return ms;
  return t.updated ? t.updated * 1000 : Date.now();
}
function isExited(t) { return !!(t && (t.exited || !t.agent || t.status === "shell")); }
function isStaleAsk(t) { return Date.now() - waitedMs(t) > STALE_ASK_MS; }
function effectiveStatus(t) {
  if (!t) return "idle";
  const ended = isExited(t);
  if (t.needs && !isDismissed(t)) return ended ? "ended" : "waiting";
  if (ended) return "shell";
  if (t.status === "working") {
    const ms = Date.parse(t.since);
    if (Number.isFinite(ms) && Date.now() - ms > STALLED_MS) return "stalled";
    return "working";
  }
  return t.status || "idle";
}
function allSessions() { return last ? last.regions.flatMap(r => r.sessions) : []; }
function sessionById(id) { return allSessions().find(t => t.id === id) || null; }
function itemBySessionId(id) {
  if (!last || !last.work) return null;
  return last.work.items.find(i => i.tabs && i.tabs.includes(id)) || null;
}
function needsSessions(includeDismissed = false) {
  return allSessions()
    .filter(t => t.needs && (includeDismissed || !isDismissed(t)))
    .sort((a, b) => {
      const aEnded = isExited(a) ? 1 : 0, bEnded = isExited(b) ? 1 : 0;
      if (aEnded !== bEnded) return aEnded - bEnded;
      const aStale = isStaleAsk(a) ? 1 : 0, bStale = isStaleAsk(b) ? 1 : 0;
      if (aStale !== bStale) return aStale - bStale;
      return aStale ? (waitedMs(a) - waitedMs(b)) : (waitedMs(b) - waitedMs(a));
    });
}
function liveNeedsSessions() { return needsSessions(false).filter(t => !isExited(t)); }
function needCountOf(items) {
  const ids = new Set(needsSessions(false).map(t => t.id));
  return items.reduce((n, i) => n + (i.tabs || []).filter(id => ids.has(id)).length, 0);
}

/* ---------------- Toast Notifications ---------------- */
function showToast(msg, kind = "", actionLabel = null, actionFn = null) {
  const box = el("div", "toast" + (kind ? " " + kind : ""));
  box.append(el("span", "", msg));
  if (actionLabel && actionFn) {
    const b = el("button", "btn sm elev", actionLabel);
    b.onclick = () => { actionFn(); box.remove(); };
    box.append(b);
  }
  const close = el("button", "btn icon sm", "");
  close.setAttribute("aria-label", "Dismiss notice");
  close.append(icon("close"));
  close.onclick = () => box.remove();
  box.append(close);
  toastBox.append(box);

async function post(path, body, okMsg) {
  try {
    const res = await fetch(path, { method: "POST", body: JSON.stringify(body || {}) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
    if (okMsg) showToast(okMsg, "ok");
    setTimeout(tick, 450);
    return data;
  } catch (e) {
    showToast(`Action failed: ${e.message}`, "err");

  }
}
async function sendTo(t, text) {

    if (res.ok) return null;
    return (await res.json().catch(() => ({ error: `HTTP ${res.status}` }))).error || `HTTP ${res.status}`;
  } catch (e) { return e.message; }
}

/* ---------------- Safe Markdown Renderer (textContent only) ---------------- */
function inlineMd(text) {
  const frag = document.createDocumentFragment();
  const re = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\[[^\]]+\]\([^)\s]+\))|(https?:\/\/[^\s)]+)|(\*[^*\s][^*]*\*)/g;
  let at = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > at) frag.append(text.slice(at, m.index));
    const [tok] = m;
    if (m[1]) frag.append(el("code", null, tok.slice(1, -1)));
    else if (m[2]) { const b = el("strong"); b.append(inlineMd(tok.slice(2, -2))); frag.append(b); }
    else if (m[3]) { const [, label, href] = tok.match(/^\[([^\]]+)\]\(([^)]+)\)$/); const l = el("a", null, label); l.href = href; l.target = "_blank"; l.rel = "noopener"; frag.append(l); }
    else if (m[4]) { const l = el("a", null, tok); l.href = tok; l.target = "_blank"; l.rel = "noopener"; frag.append(l); }
    else frag.append(el("em", null, tok.slice(1, -1)));
    at = m.index + tok.length;
  }
  if (at < text.length) frag.append(text.slice(at));
  return frag;
}
const mdCells = line => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
const MD_LIST = /^(\s*)([-*\u2022]|\d+[.)])\s+(.*)$/;
function markdown(src) {
  const out = el("div", "md"), lines = src.replace(/\r/g, "").split("\n");
  let i = 0, para = [];
  const flush = () => { if (para.length) { const p = el("p"); p.append(inlineMd(para.join(" "))); out.append(p); para = []; } };
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { flush(); i++; continue; }
    if (/^\s*```/.test(line)) {
      flush(); const code = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
      i++; out.append(el("pre", null, code.join("\n"))); continue;
    }
    if (/^\s*\|/.test(line) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || "")) {
      flush(); const wrap = el("div", "tbl"), table = el("table"), head = el("tr");
      mdCells(line).forEach(c => { const th = el("th"); th.append(inlineMd(c)); head.append(th); });
      table.append(head); i += 2;
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        const tr = el("tr"); mdCells(lines[i++]).forEach(c => { const td = el("td", c.length <= 28 ? "short" : null); td.append(inlineMd(c)); tr.append(td); }); table.append(tr);
      }
      wrap.append(table); out.append(wrap); continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flush(); const e = el("h3"); e.append(inlineMd(h[2])); out.append(e); i++; continue; }
    if (/^\s*>/.test(line)) {
      flush(); const q = el("blockquote"), body = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ""));
      q.append(inlineMd(body.join(" "))); out.append(q); continue;
    }
    if (MD_LIST.test(line)) {
      flush(); const ordered = /\d/.test(line.match(MD_LIST)[2]), list = el(ordered ? "ol" : "ul");
      while (i < lines.length && (MD_LIST.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && list.lastChild))) {
        const m = lines[i].match(MD_LIST);
        if (m) { const li = el("li"); if (m[1].length >= 2) li.className = "sub"; li.append(inlineMd(m[3])); list.append(li); }
        else list.lastChild.append(" ", inlineMd(lines[i].trim()));
        i++;
      }
      out.append(list); continue;
    }
    para.push(line.trim()); i++;
  }
  flush();
  return out;
}

function appendSessionReplyBody(t, item, st, container) {
  const ended = st === "ended" || st === "shell";
  if (t.full || t.action || t.ask) {

      box.classList.toggle("quiet", a.kind === "none");
      box.replaceChildren(el("div", "dec-lbl", lbl), el("p", "dec-txt", a.action || t.ask || ""));
      if (a.options && a.options.length && !ended) {
        const opts = el("div", "qopts");
        a.options.forEach(o => {
          const ob = el("button", "qopt", o);
          ob.title = `Send "${o}" to ${t.title}`;
          ob.onclick = async () => {
            ob.disabled = true; ob.textContent = "Sending...";
            const err = await sendTo(t, o);
            if (err) { ob.disabled = false; ob.textContent = o; showToast("Not sent: " + err, "err"); return; }
            sent.add(t.id);
            showToast(`Sent to ${t.title}`, "ok");
            const nxt = nextReplyId(t.id);
            if (view === "inbox") { if (nxt) { inboxActiveId = nxt; invalidateViews(); render(last); } else setTimeout(tick, 450); }
            else if (PEEK.kind === "session" && nxt) openSessionPeek(nxt, "overview");
            else setTimeout(tick, 450);
          };
          opts.append(ob);
        });
        box.append(opts);
      }
    };
    if (t.action) fillAction(t.action);
    else if (t.full) {
      box.replaceChildren(el("div", "dec-lbl", "Working out the action..."), el("p", "dec-txt muted", t.ask || ""));
      fetch("/api/action?surface=" + encodeURIComponent(t.id)).then(r => r.json()).then(a => {
        if (!box.isConnected) return;
        if (a.action) fillAction(a);
        else box.replaceChildren(el("div", "dec-lbl", "Latest ask"), el("p", "dec-txt", t.ask || a.error || "No action detected"));
      }).catch(() => {
        if (box.isConnected) box.replaceChildren(el("div", "dec-lbl", "Latest ask"), el("p", "dec-txt", t.ask || ""));
      });
    }
    container.append(box);
  }
  const msgWrap = el("div");
  msgWrap.append(t.full ? markdown(t.full) : el("p", "muted", t.recap || "No assistant reply captured yet."));
  container.append(msgWrap);
}

function buildComposer(t, item, st, onSent) {
  const wrap = el("div", "peek-comp");
  const ended = st === "ended" || st === "shell";
  if (ended) {
    const row = el("div", "comp-foot");
    row.style.marginTop = "0";
    row.append(el("span", "comp-hint", "Agent process ended. Reopen before replying so text does not hit a shell."));
    if (item && item.resumable) {
      const res = el("button", "btn sm primary", "Resume session");
      res.onclick = async () => { res.disabled = true; res.textContent = "Reopening..."; await itemAct(item, "resume", "Opening session"); };
      row.append(res);
    }
    wrap.append(row);
    return wrap;
  }
  const card = el("div", "comp-card");
  const input = el("textarea");
  input.rows = 2;
  input.value = replyDrafts.get(t.id) || "";
  input.placeholder = `Reply to ${t.title}...`;
  input.setAttribute("aria-label", `Reply to ${t.title}`);
  const foot = el("div", "comp-foot");
  const inQueue = liveNeedsSessions().some(x => x.id === t.id);
  const left = liveNeedsSessions().filter(x => !sent.has(x.id)).length;
  const hint = el("span", "comp-hint", inQueue ? `Enter sends + next (${left} waiting)` : "Enter sends · Shift+Enter newline");
  const btns = el("div", "peek-acts");
  if (inQueue && left > 1) {
    const skip = el("button", "btn ghost sm", "Skip");
    skip.onclick = () => { sent.add(t.id); if (onSent) onSent(); };
    btns.append(skip);
  }
  const sendBtn = el("button", "btn sm primary", "Send");
  sendBtn.disabled = !input.value.trim();
  input.oninput = () => {
    if (input.value) replyDrafts.set(t.id, input.value); else replyDrafts.delete(t.id);
    sendBtn.disabled = !input.value.trim();
  };
  const doSend = async () => {
    const text = input.value.trim();
    if (!text) return;
    input.disabled = true; sendBtn.disabled = true; sendBtn.textContent = "Sending...";
    hint.classList.remove("fail");
    const err = await sendTo(t, text);
    if (err) {
      input.disabled = false; sendBtn.disabled = !input.value.trim(); sendBtn.textContent = "Send";
      hint.textContent = "Not sent: " + err; hint.classList.add("fail"); input.focus();
      return;
    }
    replyDrafts.delete(t.id);
    sent.add(t.id);
    showToast(`Sent reply to ${t.title}`, "ok");
    if (onSent) onSent(); else setTimeout(tick, 450);
  };
  sendBtn.onclick = doSend;
  input.onkeydown = e => {
    if (e.key === "Escape") { e.stopPropagation(); input.blur(); if (!peekEl.hidden) closePeek(); return; }
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.stopPropagation(); doSend(); }
  };
  btns.append(sendBtn);
  foot.append(hint, btns);
  card.append(input, foot);
  wrap.append(card);
  return wrap;
}

/* Diagnostics Loader (used in both Peek Drawer and Inbox Detail Pane) */
async function loadDiagInto(t, tab, container) {
  try {
    if (tab === "timeline") {
      const d = await (await fetch("/api/timeline?surface=" + encodeURIComponent(t.id))).json();
      if (!container.isConnected) return;
      if (d.error) { container.replaceChildren(el("div", "tl-prompt", d.error)); return; }
      container.replaceChildren(...buildTimelineNodes(d));
    } else if (tab === "waterfall" || tab === "agents") {
      const scope = tab === "waterfall" ? "turn" : tlScope;
      const d = await (await fetch(`/api/trace?surface=${encodeURIComponent(t.id)}&scope=${scope}&running=${effectiveStatus(t) === "working" ? 1 : 0}`)).json();
      if (!container.isConnected) return;
      if (d.error) { container.replaceChildren(el("div", "tl-prompt", d.error)); return; }
      const keep = container.scrollTop;
      container.replaceChildren(...(tab === "waterfall" ? buildWaterfallNodes(d, t, container) : buildAgentTreeNodes(d, t, container)));
      container.scrollTop = keep;
    } else if (tab === "context") {
      const d = await (await fetch(`/api/context?surface=${encodeURIComponent(t.id)}&agent=${encodeURIComponent(ctxAgent)}`)).json();
      if (!container.isConnected) return;
      container.replaceChildren(...buildContextNodes(d, t, container));
    } else if (tab === "handoffs") {
      const d = await (await fetch("/api/handoffs?surface=" + encodeURIComponent(t.id))).json();
      if (!container.isConnected) return;
      container.replaceChildren(...buildHandoffNodes(d, container));
    }
  } catch (e) {
    if (container.isConnected) container.replaceChildren(el("div", "err-banner", "Could not load telemetry: " + e.message));
  }
}

/* ---------------- Diagnostics Renderers ---------------- */
function buildTimelineNodes(d) {
  const end = Math.max(d.active_end, d.start + 5), width = end - d.start;
  const tail = d.lanes[0].segments.find(s => s.kind === "you" && s.open);
  const sum = el("div", "tl-sum");
  const kv = (k, v) => { const s = el("span"); s.append(el("span", "k", k + " "), el("b", null, v)); sum.append(s); };
  kv("Turn", dur((tail ? tail.start : d.now) - d.start));
  ["model", "tool", "agents"].forEach(k => { if (d.totals[k] >= 1) kv(KIND[k], dur(d.totals[k])); });
  const youDone = (d.totals.you || 0) - (tail ? d.now - tail.start : 0);
  if (youDone >= 1) kv("Waited on you mid-turn", dur(youDone));
  if (tail) kv("Waiting on you", dur(d.now - tail.start));

  const slow = el("ol", "tl-slow");
  d.slowest.forEach(s => {
    const li = el("li");
    li.append(el("span", "d", dur(s.end - s.start)), el("span", "l", (s.open ? "▶ " : "") + s.label), el("span", "w", s.lane));
    slow.append(li);
  });

  const grid = el("div", "tl-grid"), axis = el("div", "tl-axis");
  for (let i = 0; i <= 4; i++) {
    const tk = el("span", null, i ? "+" + dur(width * i / 4) : "prompt");
    tk.style.left = (i * 25) + "%";
    if (i === 4) tk.style.transform = "translateX(-100%)";
    axis.append(tk);
  }
  grid.append(el("div"), axis);

// Body-aware & title-aware collision culling: zero label-on-label or label-on-dot overlaps.
function gLabelCull() {
  if (!G.world) return;
  const hit = (a, b) => a.left - 3 < b.right && a.right + 3 > b.left && a.top - 1 < b.bottom && a.bottom + 1 > b.top;
  const taken = [];
  [...G.world.querySelectorAll(".gsys:not(.away)")].forEach(g => {
    const sl = g.querySelector(".slabel"), sc = g.querySelector(".scount");
    if (sl) { sl.setAttribute("dy", "-1.95em"); sl.style.visibility = "visible"; }
    if (sc) { sc.setAttribute("dy", "-0.45em"); sc.style.visibility = "visible"; }
    if (sl && getComputedStyle(sl).display !== "none") {
      let r = sl.getBoundingClientRect();
      for (const [sdy, cdy] of [["-1.95em", "-0.45em"], ["-3.75em", "-2.25em"], ["-5.55em", "-4.05em"]]) {
        sl.setAttribute("dy", sdy); if (sc) sc.setAttribute("dy", cdy);

      taken.push(r);

    if (sc && getComputedStyle(sc).display !== "none") {
      const r = sc.getBoundingClientRect();
      const clash = taken.some(o => hit(r, o));

      if (!clash) taken.push(r);

  const pri = n => (n.classList.contains("needs") ? 0 : n.classList.contains("st-working") ? 1 : n.classList.contains("live") ? 2 : 3);
  const nodes = [...G.world.querySelectorAll(".gplanet:not(.away):not(.spot-dim)")];
  const bodies = nodes.map(n => ({ n, r: n.querySelector(".body").getBoundingClientRect() }));
  nodes.map(n => ({ n, t: n.querySelector(".plabel") }))
    .filter(x => x.t && getComputedStyle(x.t).display !== "none")
    .sort((a, b) => pri(a.n) - pri(b.n))
    .forEach(({ n, t }) => {
      t.classList.remove("lhide");
      const r = t.getBoundingClientRect();
      const blocked = taken.some(o => hit(r, o)) || bodies.some(b => b.n !== n && hit(r, b.r));
      t.classList.toggle("lhide", blocked);
      if (!blocked) taken.push(r);
    });
}
