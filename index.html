  items.forEach(it => { it.tabs.forEach(t => link("t:" + t, "i:" + it.id)); if (goalIdx.has(it.group)) link("i:" + it.id, "g:" + it.group); });
  const chain = key => {  // tab -> its item and goal; item -> its tabs and goal; goal -> its items and their tabs
    const out = new Set([key]), [kind] = key.split(":");
    const add = k => (rel.get(k) || new Set([k])).forEach(x => out.add(x));
    add(key);
    if (kind === "t") [...out].filter(k => k.startsWith("i:")).forEach(add);
    if (kind === "g") [...out].filter(k => k.startsWith("i:")).forEach(add);
    return out;
  };

  const wrap = el("div", "wmap");
  const L = el("div", "dcol"), M = el("div", "dcol"), R = el("div", "dcol");
  L.append(el("div", "dhead", "Spaces and their tabs"));
  M.append(el("div", "dhead", "Work items"));
  R.append(el("div", "dhead", "Goals"));
  const groupName = r => r.scratch ? "" : ((state.groups || []).find(g => g.id === r.group) || {}).name || "";
  spaces.forEach(({ r, tabs }) => {
    const box = el("div", "dbox ws"), h = el("div", "dtitle", r.title);
    if (groupName(r)) h.append(el("span", "cnt", groupName(r)));
    box.append(h);
    tabs.forEach(t => {
      const it = itemOfTab.get(t.id);
      const row = el("div", "mtab " + t.status + (it ? "" : " loose"));
      row.dataset.key = "t:" + t.id;
      row.style.setProperty("--c", `var(--${t.status})`);
      row.style.setProperty("--h", it ? hueOf(it) : "var(--idle)");
      row.append(el("span", "dot"), el("span", "name", t.title), el("span", "meta", [LABEL[t.status], ago(t.since)].filter(Boolean).join(" · ")));
      row.title = (it ? "On: " + it.title : "Not on a work item yet (filed automatically within a minute)") + "\nClick to open. Drag onto a work item to move it.";
      row.onclick = () => fetch("/api/focus", { method: "POST", body: JSON.stringify({ workspace: t.workspace, surface: t.id }) });
      if (t.transcript) {
        row.draggable = true;
        row.ondragstart = e => { dragging = t; e.dataTransfer.setData("text/plain", t.id); };
        row.ondragend = () => { dragging = null; document.querySelectorAll(".drop").forEach(x => x.classList.remove("drop")); };
      }
      box.append(row);
    });
    L.append(box);
  });

  ordered.forEach(it => {
    const parked = it.state === "parked" && it.status === "none";
    const box = el("div", "mitem" + (it.needs ? " needs" : "") + (parked ? " parked" : ""));
    box.dataset.key = "i:" + it.id;
    box.style.setProperty("--h", hueOf(it));
    const h = el("div", "dtitle"), name = el("span", "name", it.title);
    h.append(name);
    const st = it.needs ? "needs you" : parked ? "parked" : it.status === "none" ? "no open tab" : LABEL[it.status] || it.status;
    h.append(el("span", "st " + (it.needs ? "waiting" : parked ? "shell" : it.status), st));
    if (it.new) h.append(el("span", "tag join", "new"));
    h.append(pencil(name, it.title, title => edit({ op: "update", id: it.id, title })));
    h.draggable = true;
    h.title = "Drag onto a goal to move it there, or onto another item to merge";
    h.ondragstart = e => { draggingItem = it; e.dataTransfer.setData("text/plain", it.id); };
    h.ondragend = () => { draggingItem = null; document.querySelectorAll(".drop").forEach(x => x.classList.remove("drop")); };
    box.append(h);
    const line = it.needs || parked ? it.next || it.note : "";
    if (line) box.append(el("div", "mnext", (parked && it.waits_on && it.waits_on !== "nobody" ? `Waits on ${it.waits_on === "Robert" ? "you" : it.waits_on}: ` : "") + line));
    const a = (it.asked_by || []).slice(-1)[0];
    if (a) { const r = el("div", "masked"); r.append(el("b", null, a.person), " " + (a.ask || "asked"), el("span", null, " · " + ago(new Date(a.at * 1000).toISOString()))); box.append(r); }
    else if (it.people.length) box.append(el("div", "masked", it.people.join(", ")));
    const acts = el("div", "macts");
    const btn = (text, fn) => { const b = el("button", null, text); b.onclick = e => { e.stopPropagation(); fn(); }; acts.append(b); };
    if (workBusy[it.id]) acts.append(el("span", "hint", workBusy[it.id] + "…"));
    else {
      if (!parked) btn(armedItem === it.id + "park" ? `close ${it.tabs.length} tab${it.tabs.length === 1 ? "" : "s"}?` : "Park", () => {
        if (!it.tabs.length || armedItem === it.id + "park") { armedItem = null; itemAct(it, "park", "Writing where it stands"); }
        else { armedItem = it.id + "park"; render(last); setTimeout(() => { if (armedItem === it.id + "park") { armedItem = null; render(last); } }, 3000); }
      });
      if (it.resumable && !it.tabs.length) btn("Resume", () => itemAct(it, "resume", "Opening its last session"));
      btn("Done", () => edit({ op: "update", id: it.id, state: "done" }));
    }
    const m = workMsg[it.id];
    if (m && m.text) acts.append(el("span", "hint" + (m.ok ? "" : " fail"), m.text));
    box.append(acts);
    box.ondragover = e => { if ((dragging && dragging.transcript) || (draggingItem && draggingItem.id !== it.id)) { e.preventDefault(); box.classList.add("drop"); } };
    box.ondragleave = e => { if (!box.contains(e.relatedTarget)) box.classList.remove("drop"); };
    box.ondrop = e => {
      e.preventDefault(); box.classList.remove("drop");
      if (dragging && dragging.transcript) { const tr = dragging.transcript; dragging = null; edit({ op: "attach", transcript: tr, item: it.id }); }
      else if (draggingItem && draggingItem.id !== it.id) { pendingMerge = { from: draggingItem, into: it }; draggingItem = null; render(last); }
    };
    M.append(box);
  });
  const zone = el("div", "dbox outbox", "Drop a tab here to make it its own work item");
  zone.ondragover = e => { if (dragging && dragging.transcript) { e.preventDefault(); zone.classList.add("drop"); } };
  zone.ondragleave = () => zone.classList.remove("drop");
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove("drop"); if (dragging && dragging.transcript) { const t = dragging; dragging = null; edit({ op: "split", transcript: t.transcript, title: t.title }); } };
  M.append(zone);

  const goalBox = g => {
    const mine = items.filter(i => g ? i.group === g.id : !goalIdx.has(i.group));
    if (!g && !mine.length) return null;
    const box = el("div", "mgoal");
    if (g) box.dataset.key = "g:" + g.id;
    box.style.setProperty("--h", g ? GOAL_HUE(goalIdx.get(g.id)) : "var(--idle)");
    const h = el("div", "dtitle"), name = el("span", "name", g ? g.title : "No goal yet");
    h.append(name);
    if (g) h.append(pencil(name, g.title, title => edit({ op: "group-rename", group: g.id, title })));
    box.append(h);
    const n = mine.filter(i => i.needs).length, open = mine.reduce((s, i) => s + i.tabs.length, 0);
    box.append(el("div", "masked", `${mine.length} item${mine.length === 1 ? "" : "s"} · ${open} open tab${open === 1 ? "" : "s"}` + (n ? ` · ${n} need you` : "")));
    box.ondragover = e => { if (draggingItem) { e.preventDefault(); box.classList.add("drop"); } };
    box.ondragleave = () => box.classList.remove("drop");
    box.ondrop = e => { e.preventDefault(); box.classList.remove("drop"); if (draggingItem) { const it = draggingItem; draggingItem = null; edit({ op: "group-set", id: it.id, group: g ? g.id : "" }); } };
    return box;
  };
  goals.forEach(g => R.append(goalBox(g)));
  const loose = goalBox(null); if (loose) R.append(loose);
  const again = el("button", "wbtn", groupBusy ? "Reading your items…" : goals.length ? "Regroup by goal" : "Group by goal");
  again.disabled = groupBusy; again.onclick = proposeGroups;
  R.append(again);
  if (groupErr) R.append(el("p", "fail", groupErr));

  const svg = document.createElementNS(SVGNS, "svg"); svg.classList.add("links");
  wrap.append(svg, L, M, R);
  wrap.onmouseover = e => { const n = e.target.closest("[data-key]"); const k = n ? n.dataset.key : null; if (k !== mapFocus) { mapFocus = k; mapApply(wrap, chain); } };
  wrap.onclick = e => {  // click a box to keep its chain lit; click it again or anywhere off a box to clear
    if (e.target.closest("button, input, select, a")) return;
    const n = e.target.closest("[data-key]"), k = n ? n.dataset.key : null;
    mapPin = k && k !== mapPin ? k : null;
    mapApply(wrap, chain);
  };
  wrap.onmouseleave = () => { mapFocus = null; mapApply(wrap, chain); };
  wrap._chain = chain;
  return wrap;
}
function mapApply(wrap, chain) {
  if (mapPin && !wrap.querySelector(`[data-key="${CSS.escape(mapPin)}"]`)) mapPin = null;  // its tab or item is gone
  const key = mapPin || mapFocus, on = key ? chain(key) : null;
  wrap.classList.toggle("focused", !!on);
  wrap.querySelectorAll("[data-key]").forEach(n => n.classList.toggle("pinned", n.dataset.key === mapPin));
  wrap.querySelectorAll("[data-key]").forEach(n => n.classList.toggle("on", !!on && on.has(n.dataset.key)));
  wrap.querySelectorAll("path").forEach(p => p.classList.toggle("on", !!on && on.has(p.dataset.a) && on.has(p.dataset.b)));
}
function drawMap(wrap) {
  if (!wrap) return;
  const svg = wrap.querySelector("svg.links"), base = wrap.getBoundingClientRect();
  svg.setAttribute("width", base.width); svg.setAttribute("height", base.height);
  svg.replaceChildren();
  const box = k => wrap.querySelector(`[data-key="${CSS.escape(k)}"]`);
  const fan = {};
  const curve = (a, b, ka, kb, width) => {
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const n = fan[kb] = (fan[kb] || 0) + 1;
    const x1 = ra.right - base.left, y1 = ra.top + Math.min(ra.height / 2, 14) - base.top;
    const x2 = rb.left - base.left, y2 = rb.top - base.top + Math.min(10 + n * 5, rb.height - 6);
    const mid = (x1 + x2) / 2;
    svg.append(svgEl("path", { d: `M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`, stroke: getComputedStyle(b).getPropertyValue("--h"),
      "stroke-width": width, "data-a": ka, "data-b": kb }));
  };
  wrap.querySelectorAll(".mitem[data-key]").forEach(it => {
    const ik = it.dataset.key;
    const g = [...wrap.querySelectorAll(".mgoal[data-key]")].find(x => wrap._chain(ik).has(x.dataset.key));
    if (g) curve(it, g, ik, g.dataset.key, 3);
  });
  wrap.querySelectorAll(".mtab[data-key]").forEach(t => {
    const tk = t.dataset.key, it = [...wrap._chain(tk)].find(k => k.startsWith("i:"));
    const b = it && box(it);
    if (b) curve(t, b, tk, it, 2);
  });
  mapApply(wrap, wrap._chain);
}

function render(state) {
  if (!state) return;
  if (tlSession) {  // keep the open drawer's status current (the waterfall reads it to tell running from finished)
    const fresh = state.regions.flatMap(r => r.sessions).find(x => x.id === tlSession.id);
    if (fresh) tlSession.status = fresh.status;
  }
  if (view === "galaxy") return renderGalaxy(state);
  if (view === "work" && state.work) return renderWork(state);
  const parentOf = Object.fromEntries(state.edges.map(e => [e.child, e.parent]));
  const counts = { waiting: 0, done: 0, working: 0 };
  let subRunning = 0;
  const regions = state.regions.map(r => {
    const sessions = r.sessions.filter(t => showShells.checked || t.status !== "shell");
    sessions.forEach(t => { if (t.status in counts) counts[t.status]++; subRunning += t.subagents.filter(a => a.status === "running").length; });
    const rank = Math.min(...sessions.map(t => ORDER[t.status]), 9);
    return { ...r, sessions, rank };
  }).filter(r => r.sessions.length || r.scratch).sort((a, b) => a.rank - b.rank);

  tally.replaceChildren(...["waiting", "done", "working"].map(k => {
    const s = el("span"); const d = el("span", "dot"); d.style.background = `var(--${k})`;
    s.append(d, el("b", null, counts[k]), " " + LABEL[k]); return s;
  }));
  if (subRunning) { const s = el("span"); s.append(el("b", null, subRunning), " subagents running"); tally.append(s); }

  const boxes = regions.map(r => {
    const box = el("section", "region" + (r.scratch ? " scratch" : ""));
    box.dataset.group = r.scratch ? "scratch" : r.group || "";
    const h = el("h2");
    h.draggable = !r.scratch;  // Scratch stays pinned outside the groups
    h.ondragstart = e => { draggingRegion = r; e.dataTransfer.setData("text/plain", r.id); box.classList.add("dragging"); };
    h.ondragend = () => { draggingRegion = null; box.classList.remove("dragging"); document.querySelectorAll(".drop").forEach(g => g.classList.remove("drop")); };
    const addBtn = el("button", "add", "+"); addBtn.title = "New Claude session in " + r.title;
    addBtn.onclick = () => post("/api/new", { workspace: r.id });
    const name = el("span", "name", r.title);
    const sparkle = el("span", "pen" + (naming === r.id ? " busy" : ""), naming === r.id ? "naming…" : "✨");
    sparkle.title = "Auto-name this workspace and its sessions";
    sparkle.onclick = e => { e.stopPropagation(); autoname(r.id); };
    if (r.scratch) h.append(name, el("span", "hint", "one-off sessions · drag one into a group to make it a workspace"));
    else h.append(name, pencil(name, r.title, title => post("/api/rename", { workspace: r.id, title })), sparkle);
    h.append(el("span", "count", r.sessions.length + (r.sessions.length === 1 ? " session" : " sessions")), addBtn);
    box.append(h);
    // Session drags stop here so the group section underneath doesn't also take them (own region = no-op).
    box.ondragover = e => { if (!dragging) return; e.stopPropagation(); if (dragging.workspace !== r.id) { e.preventDefault(); box.classList.add("drop"); } };
    box.ondragleave = e => { if (!box.contains(e.relatedTarget)) box.classList.remove("drop"); };
    box.ondrop = e => { if (!dragging) return; e.preventDefault(); e.stopPropagation(); if (dragging.workspace === r.id) return; box.classList.remove("drop"); post("/api/move", { workspace: r.id, surface: dragging.id }); };
    const ids = new Set(r.sessions.map(t => t.id));
    const byRank = [...r.sessions].sort((a, b) => ORDER[a.status] - ORDER[b.status] || (Date.parse(b.since || 0) - Date.parse(a.since || 0)));
    const roots = byRank.filter(t => !ids.has(parentOf[t.id]));
    const add = (t, depth) => { box.append(sessionEl(t, depth > 0)); byRank.filter(c => parentOf[c.id] === t.id).forEach(c => add(c, depth + 1)); };
    roots.forEach(t => add(t, 0));
    return box;
  });

  // Groups side by side (same groups as the sidebar), then Ungrouped; columns split by workspace count.
  const all = [...(state.groups || []), { id: "", name: "Ungrouped" }]
    .map(g => ({ g, mine: boxes.filter(b => b.dataset.group === g.id) }))
    .filter(x => x.g.id || x.mine.length);
  const total = Math.max(1, Math.floor((map.clientWidth - 32 + GAP) / (COL_MIN + GAP)));
  // Columns go where the height is: measure every workspace at column width, then hand each spare
  // column to the tallest group that can still split, so the page height (and scrolling) is minimal.
  const probe = el("div", "col");
  probe.style.cssText = `position:absolute;visibility:hidden;width:${(map.clientWidth - 32 - (total - 1) * GAP) / total}px`;
  document.body.append(probe);
  all.forEach(x => { probe.replaceChildren(...x.mine); x.h = x.mine.map(b => b.offsetHeight); x.n = 1; });
  probe.remove();
  const tall = x => Math.max(...x.h.reduce((cols, h) => { cols[cols.indexOf(Math.min(...cols))] += h + GAP; return cols; }, Array(x.n).fill(0)));
  for (let spare = total - all.length; spare > 0; spare--) {
    const open = all.filter(x => x.n < x.mine.length);
    if (!open.length) break;
    open.reduce((a, b) => (tall(b) > tall(a) ? b : a)).n++;
  }
  const y = scrollY;  // rebuilding collapses the page for a moment, which would snap the scroll to the top
  map.replaceChildren(...all.map(x => {
    const { g, mine } = x;
    const sec = el("section", "group"); sec.style.flex = x.n;
    const h = el("h3"); const name = el("span", null, g.name);
    h.append(name);
    if (g.id) h.append(pencil(name, g.name, n => post("/api/rename-group", { group: g.id, name: n })));
    h.append(el("span", "count", mine.length + (mine.length === 1 ? " workspace" : " workspaces")));
    const plus = el("button", "add", "+"); plus.title = "New workspace in " + g.name;
    plus.onclick = () => post("/api/new-workspace", { group: g.id || null });
    h.append(plus);
    if (g.id) {
      const x2 = el("span", "x" + (armed === g.id ? " armed" : ""), armed === g.id ? "delete group?" : "×");
      x2.title = "Delete this group (its workspaces move to Ungrouped)";
      x2.style.visibility = "visible";
      x2.onclick = () => {
        if (armed === g.id) { armed = null; post("/api/delete-group", { group: g.id }); }
        else { armed = g.id; setTimeout(() => { if (armed === g.id) { armed = null; render(last); } }, 3000); }
        render(last);
      };
      h.append(x2);
    }
    const zone = el("div", "newzone", "Drop a session here to give it its own workspace");
    // A session dropped anywhere in the group outside a workspace (the strip or blank space) becomes its own
    // workspace in this group. Skip a lone session already in this group: it would just recreate its workspace.
    const canSplit = () => { const src = last.regions.find(r => r.id === dragging.workspace);
      return !(src && src.sessions.length === 1 && (src.group || "") === g.id); };
    const split = () => post("/api/split", { surface: dragging.id, workspace: dragging.workspace, title: dragging.title, group: g.id || null });
    zone.ondragover = e => { if (dragging && canSplit()) { e.preventDefault(); e.stopPropagation(); zone.classList.add("drop"); } };
    zone.ondragleave = () => zone.classList.remove("drop");
    zone.ondrop = e => { if (!dragging) return; e.preventDefault(); e.stopPropagation(); zone.classList.remove("drop"); sec.classList.remove("drop"); split(); };
    const cols = el("div", "cols");
    sec.append(h, zone, cols);
    sec.ondragover = e => {
      if ((draggingRegion && (draggingRegion.group || "") !== g.id) || (dragging && canSplit())) { e.preventDefault(); sec.classList.add("drop"); } };
    sec.ondragleave = e => { if (!sec.contains(e.relatedTarget)) sec.classList.remove("drop"); };
    sec.ondrop = e => { e.preventDefault(); sec.classList.remove("drop");
      if (draggingRegion) post("/api/group", { workspace: draggingRegion.id, group: g.id || null });
      else if (dragging) split(); };
    x.cols = cols;
    return sec;
  }));

  const scratch = boxes.find(b => b.dataset.group === "scratch");
  if (scratch) map.prepend(scratch);

  // Masonry per group: each workspace goes into that group's currently shortest column.
  all.forEach(({ cols, mine, n }) => {
    const colEls = Array.from({ length: n }, () => el("div", "col"));
    cols.replaceChildren(...colEls);
    mine.forEach(box => colEls.reduce((a, b) => (b.offsetHeight < a.offsetHeight ? b : a)).append(box));
  });
  scrollTo(0, y);
}

let seenCame = 0, scrollPin = false;
let pageVersion = 0;
async function tick() {
  try {
    const state = await (await fetch("/api/state")).json();
    last = state;
    const came = state.came_from;  // the tab you were in when you switched to the Overworld: light it and scroll to it
    if (pageVersion && state.page && state.page !== pageVersion) return location.reload();  // index.html changed on disk: load the new page
    pageVersion = pageVersion || state.page;
    if (came && came.at > seenCame) {
      if (seenCame || Date.now() / 1000 - came.at < 60) { mapPin = "t:" + came.id; sel = came.id; scrollPin = true; if (view === "galaxy") gCameFrom(came.id); }
      seenCame = came.at;
    }
    if (!dragging && !draggingRegion && !draggingItem && !editing) render(last);  // re-rendering mid-drag or mid-rename would drop it
    if (scrollPin && view === "tabs") { scrollPin = false; select(sel); }
    renderInbox();  // no-op while the inbox is closed
  } catch (e) {
    map.replaceChildren(el("div", "err", "Overworld server not reachable: " + e.message));
  }
}
tick();
setInterval(tick, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
window.addEventListener("focus", tick);

// Weekly usage meter. Server polls Claude's usage endpoint every 5 min and logs each reading; the page refreshes every minute.
const usageBox = document.getElementById("usage");
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function span(d) { const h = Math.floor(d / 3600), m = Math.floor((d % 3600) / 60); return h >= 24 ? `${Math.floor(h / 24)}d ${h % 24}h` : `${h}h ${m}m`; }
function when(t) { return new Date(t * 1000).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }); }
function sparkline(history, start, end, now) {
  // x = the whole week, y = 0 to a bit above the peak; one step per reading, dashed tick at now
  const W = 90, H = 18, top = Math.max(10, ...history.map(h => h[1])) * 1.25;
  const x = t => ((t - start) / (end - start)) * W, y = p => H - (p / top) * H;
  const g = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  g.append(svgEl("line", { x1: 0, y1: H - 0.5, x2: W, y2: H - 0.5, stroke: "var(--line)" }));
  g.append(svgEl("line", { x1: x(now), y1: 0, x2: x(now), y2: H, stroke: "var(--muted)", "stroke-dasharray": "2 2" }));
  if (history.length) {
    const pts = history.map(([t, p]) => `${x(t).toFixed(1)},${y(p).toFixed(1)}`).join(" ");
    g.append(svgEl("polyline", { points: pts, fill: "none", stroke: "var(--working)", "stroke-width": 1.5 }));
  }
  return g;
}
async function loadUsage() {
  let u;
  try { u = await (await fetch("/api/usage")).json(); }
  catch (e) { usageBox.replaceChildren(el("span", "pace over", "usage: server not reachable")); return; }
  const main = u.weekly.find(l => l.kind === "weekly_all");
  if (!main) { usageBox.replaceChildren(el("span", "pace over", u.error ? "usage unavailable: " + u.error : "usage: waiting for first reading")); return; }
  const now = Date.now() / 1000, end = Math.round(new Date(main.resets_at).getTime() / 60000) * 60, start = end - 7 * 86400;
  const elapsed = Math.min(1, Math.max(0, (now - start) / (end - start)));
  const projected = elapsed > 0.02 ? Math.round(main.percent / elapsed) : null;  // straight-line projection to the reset
  usageBox.className = "usage" + (main.percent >= 90 ? " over" : main.percent >= 70 ? " warn" : "");
  const bar = el("div", "bar"), fill = el("div", "fill");
  fill.style.width = Math.min(100, main.percent) + "%";
  bar.append(fill);
  let pace = el("span", "pace", projected == null ? "" : `on pace for ${projected}%`);
  if (projected >= 100 && main.percent > 0) {
    const hit = start + (100 / main.percent) * (now - start);  // when the limit runs out at this week's rate
    pace = el("span", "pace over", `on pace to run out ${when(hit)}`);
  } else if (projected >= 80) pace.className = "pace warn";
  const others = u.weekly.filter(l => l !== main && l.active).map(l => el("span", null, `${l.label} ${l.percent}%`));
  usageBox.replaceChildren(el("span", null, "Weekly"), bar, el("span", "pct", main.percent + "%"),
    el("span", null, `resets ${when(end)} (${span(end - now)})`), pace, sparkline(u.history, start, end, now), ...others);
  usageBox.title = `Weekly limit, same as the Claude desktop app. ${Math.round(elapsed * 100)}% of the week gone. ` +
    `${u.history.length} readings this week. Last read ${u.at ? new Date(u.at * 1000).toLocaleTimeString() : "never"}` +
    (u.error ? `. Last poll failed: ${u.error}` : "");
}
loadUsage();
setInterval(loadUsage, 60000);
</script>
