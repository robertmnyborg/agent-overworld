<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Overworld</title>
<style>
  :root { color-scheme: dark;
    --bg: #12131a; --panel: #1b1d27; --line: #2a2d3b; --text: #e6e7ee; --muted: #8a8ea3;
    --waiting: #f5a524; --working: #4c8dff; --done: #3ecf8e; --idle: #5b6075; --shell: #34374a; --tool: #b48cff; --danger: #ff6b6b; --scrim: rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 1; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  .tally { display: flex; gap: 12px; color: var(--muted); white-space: nowrap; }
  header > button, header > label { white-space: nowrap; }
  header { flex-wrap: wrap; row-gap: 6px; }
  header > .hint { order: 1; flex-basis: 100%; }
  .tally b { color: var(--text); }
  /* Weekly usage meter: the desktop app's weekly limit bar, plus pace and this week's readings */
  .usage { display: flex; align-items: center; gap: 8px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .usage .bar { width: 100px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .usage .fill { height: 100%; background: var(--working); }
  .usage.warn .fill { background: var(--waiting); }
  .usage.over .fill { background: var(--danger); }
  .usage .pct { color: var(--text); font-weight: 600; }
  .usage .pace.warn { color: var(--waiting); }
  .usage .pace.over { color: var(--danger); }
  .usage svg { display: block; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  label { margin-left: auto; color: var(--muted); cursor: pointer; user-select: none; }
  main { padding: 6px 16px 40px; display: flex; flex-wrap: wrap; align-items: stretch; }
  /* Scratch: pinned strip above the groups; its sessions flow side by side */
  .region.scratch { flex: 0 0 100%; margin: 8px 0 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .region.scratch h2 { grid-column: 1 / -1; cursor: default; }
  .region.scratch + .group { padding-left: 0; }
  .group { min-width: 0; padding: 0 14px; border-radius: 10px; }
  .group:first-child { padding-left: 0; }
  .group:last-child { padding-right: 0; }
  .group + .group { border-left: 2px solid var(--line); }
  .group.drop { box-shadow: inset 0 0 0 1px var(--working); }
  .newzone { display: none; margin-bottom: 14px; padding: 14px; border: 1px dashed var(--muted); border-radius: 10px; color: var(--muted); text-align: center; }
  body.dragging-session .newzone { display: block; }
  .newzone.drop { border-color: var(--working); color: var(--text); }
  .group h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 8px 2px; display: flex; gap: 8px; align-items: center; }
  .group h3:hover .pen { visibility: visible; }
  .cols { display: flex; align-items: flex-start; gap: 14px; }
  .region h2 { cursor: grab; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .region { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .region.drop { border-color: var(--working); box-shadow: 0 0 0 1px var(--working); }
  .region h2 { font-size: 13px; margin: 0; padding: 10px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  .region h2 .name { flex: 1; }
  .region h2 .count { color: var(--muted); font-weight: 400; }
  .add { background: none; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); font: inherit; line-height: 1; padding: 2px 7px; cursor: pointer; }
  .add:hover { color: var(--text); border-color: var(--muted); }
  .session { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid var(--c); color: inherit; font: inherit;
          padding: 8px 12px 8px 10px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .session.dragging { opacity: .4; }
  .x { color: var(--muted); padding: 0 2px; visibility: hidden; }
  .session:hover .x, .x.armed, .session:hover .pen, .region h2:hover .pen { visibility: visible; }
  .pen { color: var(--muted); cursor: pointer; visibility: hidden; font-weight: 400; }
  .pen:hover { color: var(--text); }
  .pen.busy { visibility: visible; font-size: 11px; }
  .rename { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--working); border-radius: 4px; font: inherit; font-weight: 600; padding: 1px 5px; }
  .x:hover { color: var(--text); }
  .x.armed { color: var(--danger); font-weight: 600; }
  .hint { color: var(--muted); font-size: 11px; }
  .session:last-child { border-bottom: 0; }
  .session:hover { background: #232635; }
  .session.child { padding-left: 26px; }
  .session .row { display: flex; gap: 8px; align-items: baseline; }
  .session .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .session .recap { color: var(--muted); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .session.here { background: #20243a; }
  /* Subagent lane: the agents a session spawned, one row each */
  .lane { margin: 6px 0 0 2px; border-left: 1px solid var(--line); padding-left: 8px; display: flex; flex-direction: column; gap: 3px; }
  .sub { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sub .row { gap: 6px; }
  .sub .what { color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub .detail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 14px; }
  .sub.running .dot { background: var(--working); animation: pulse 1.4s ease-in-out infinite; }
  .sub.done .dot { background: var(--done); }
  .sub.stopped .dot { background: var(--idle); }
  .sub.done .what, .sub.stopped .what { color: var(--muted); }
  @keyframes pulse { 50% { opacity: .35; } }
  .lane { cursor: zoom-in; }
  /* Timeline drawer: one session's current turn, a bar per model stretch / tool call / wait, a row per agent */
  #tl { position: fixed; top: 0; right: 0; bottom: 0; width: min(960px, 72vw); background: var(--panel); border-left: 1px solid var(--line);
        z-index: 5; overflow-y: auto; padding: 14px 18px 30px; box-shadow: -12px 0 30px rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
  #tl[hidden] { display: none; }
  .tl-head { display: flex; gap: 10px; align-items: baseline; }
  .tl-head b { font-size: 15px; flex: 1; }
  .tl-head .x { visibility: visible; cursor: pointer; font-size: 16px; }
  .tl-prompt { color: var(--muted); margin: 4px 0 10px; }
  .tl-sum { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 8px; }
  .tl-sum .k { color: var(--muted); }
  .tl-slow { margin: 0 0 14px; padding: 0; list-style: none; }
  .tl-slow li { display: flex; gap: 8px; padding: 2px 0; }
  .tl-slow .d { width: 52px; text-align: right; font-weight: 600; }
  .tl-slow .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-slow .w { color: var(--muted); white-space: nowrap; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
  .tl-grid { display: grid; grid-template-columns: 200px 1fr; row-gap: 6px; align-items: center; }
  .tl-name { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; }
  .tl-name b { color: var(--text); font-weight: 600; }
  .tl-track { position: relative; height: 16px; background: var(--bg); border-radius: 3px; }
  .tl-axis { position: relative; height: 16px; font-size: 10px; color: var(--muted); }
  .tl-axis span { position: absolute; transform: translateX(-50%); }
  .tl-axis span:first-child { transform: none; }
  .seg { position: absolute; top: 2px; bottom: 2px; min-width: 2px; border-radius: 2px; }
  .seg.model { background: var(--working); }
  .seg.tool { background: var(--tool); top: 0; bottom: 0; }
  .seg.you { background: var(--waiting); opacity: .55; }
  .seg.agents { background: repeating-linear-gradient(135deg, var(--idle) 0 4px, transparent 4px 8px); }
  .seg.open { animation: pulse 1.4s ease-in-out infinite; }
  .tl-legend { display: flex; gap: 14px; margin-top: 14px; color: var(--muted); font-size: 11px; }
  .tl-legend i { display: inline-block; width: 18px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  /* Drawer tabs + trace views (waterfall, agent tree) */
  .tl-tabs { display: flex; gap: 4px; margin: 8px 0 10px; }
  .tl-tabs button, .tl-scope button { background: var(--bg); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; font: inherit; cursor: pointer; }
  .tl-tabs button.on, .tl-scope button.on { color: var(--text); border-color: var(--working); }
  .tl-scope { display: flex; gap: 4px; margin-bottom: 10px; }
  .wf { display: grid; grid-template-columns: minmax(220px, 34%) 1fr 58px 96px 62px; column-gap: 8px; row-gap: 2px; align-items: center; }
  .wf-h { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding-bottom: 4px; }
  .wf-h.r, .wf .r { text-align: right; }
  .wf-row { display: contents; cursor: pointer; }
  .wf-row:hover > div { background: rgba(255,255,255,.03); }
  .wf-name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 2px 0; }
  .wf-name .caret { display: inline-block; width: 12px; color: var(--muted); }
  .wf-name .k { color: var(--muted); }
  .wf-name.agent { font-weight: 600; }
  .wf-num { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .wf-bar { position: relative; height: 14px; }
  .wf-bar i { position: absolute; top: 3px; bottom: 3px; min-width: 2px; border-radius: 2px; }
  .wf-bar i.llm { background: var(--working); }
  .wf-bar i.tool { background: var(--tool); }
  .wf-bar i.fail { background: var(--danger); }
  .wf-gap { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--line); }
  .wf-bar i.agent { background: var(--done); opacity: .35; top: 1px; bottom: 1px; }
  .wf-bar i.open { animation: pulse 1.4s ease-in-out infinite; }
  .wf-slow { color: var(--waiting); font-size: 10px; margin-left: 6px; }
  .wf-detail { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 2px 0 8px; }
  .wf-detail pre { margin: 0; max-height: 260px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: 11px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  .wf-detail .hint { margin-bottom: 2px; }
  .at { list-style: none; margin: 0; padding: 0; }
  .at .at { margin-left: 18px; padding-left: 10px; border-left: 1px solid var(--line); }
  .at-card { display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 8px; align-items: baseline; padding: 6px 8px; margin: 4px 0; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .at-card .caret { color: var(--muted); }
  .at-card .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .at-card .t b { margin-right: 6px; }
  .at-card .c { font-weight: 600; white-space: nowrap; }
  .at-card .m { grid-column: 2 / -1; color: var(--muted); font-size: 11px; }
  .at-card.running .dot { background: var(--working); animation: pulse 1.4s ease-in-out infinite; }
  .at-card.done .dot { background: var(--done); }
  .at-card.stopped .dot { background: var(--idle); }
  /* Context map (treemap), handoffs, inbox */
  .cm-head { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; margin-bottom: 6px; }
  .cm-head select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font: inherit; max-width: 320px; }
  .cm-meter { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin: 6px 0 10px; }
  .cm-meter i { display: block; height: 100%; background: var(--working); }
  .cm-map { position: relative; height: 440px; margin-top: 8px; }
  .cm-cat { position: absolute; border: 1px solid var(--panel); box-sizing: border-box; overflow: hidden; transition: all .4s ease; }
  .cm-cat.free { border: 1px dashed var(--line); background: transparent; }
  .cm-cat > b { position: absolute; left: 4px; top: 2px; font-size: 11px; z-index: 1; text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap; }
  .cm-item { position: absolute; box-sizing: border-box; border: 1px solid rgba(0,0,0,.35); padding: 16px 4px 2px; font-size: 10px; overflow: hidden; color: rgba(255,255,255,.85); transition: all .4s ease; }
  .cm-item span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cm-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 11px; color: var(--muted); }
  .cm-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .ho { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .ho-top { display: flex; gap: 8px; align-items: baseline; }
  .ho-top b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ho-badge { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
  .ho details { margin-top: 6px; }
  .ho summary { cursor: pointer; color: var(--muted); font-size: 11px; }
  .ho pre { margin: 4px 0 0; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 11px/1.45 ui-monospace, Menlo, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .chip { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.lost { border-style: dashed; color: var(--danger); text-decoration: line-through; text-decoration-color: rgba(255,107,107,.5); }
  .chip.src { color: var(--working); }
  #inbox { position: fixed; inset: 0; z-index: 6; background: var(--scrim); display: flex; justify-content: center; align-items: flex-start; padding: 48px 16px; }
  #inbox[hidden] { display: none; }
  .ib { width: min(860px, 100%); max-height: calc(100vh - 96px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .ib-tabs { display: flex; gap: 4px; margin: 10px 0; }
  .ib-tabs button { background: var(--bg); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; font: inherit; cursor: pointer; }
  .ib-tabs button.on { color: var(--text); border-color: var(--working); }
  .ib-tabs b { margin-left: 4px; }
  .ib-row { border-top: 1px solid var(--line); padding: 8px 4px; }
  .ib-row .top { display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
  .ib-row .top b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ib-row .top .meta { color: var(--muted); font-size: 11px; white-space: nowrap; margin-left: auto; }
  .ib-row .line { color: var(--muted); margin: 2px 0 0 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ib-row.waiting .line { color: var(--text); }
  .ib-row .dot { background: var(--c); }
  .ib-row.sub { padding-left: 22px; }
  .ib-steps { list-style: none; margin: 8px 0 0 13px; padding: 0; font-size: 12px; }
  .ib-steps li { display: flex; gap: 8px; padding: 1px 0; color: var(--muted); }
  .ib-steps li span:last-child { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ib-acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px 13px; }
  .ib-acts button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; font: inherit; cursor: pointer; }
  .ib-acts button.opt { border-color: var(--waiting); }
  .session .recap.ask { color: var(--text); }
  /* Reply view: one session blown up over the dimmed map */
  #peek { position: fixed; inset: 0; z-index: 7; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .peek-panel { width: min(760px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 10px; background: var(--panel);
                border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 10px; padding: 14px 16px; }
  .peek-panel .row { display: flex; gap: 8px; align-items: baseline; }
  .peek-panel .title { font-size: 15px; flex: 1; }
  .peek-panel .meta { color: var(--muted); font-size: 11px; }
  .peek-panel { width: min(980px, 100%); }
  .md td.short { white-space: nowrap; }
  .peek-ask { background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--waiting); border-radius: 6px; padding: 10px 12px;
              font-size: 15px; font-weight: 600; line-height: 1.45; }
  .peek-ask.quiet { border-left-color: var(--idle); font-weight: 500; }
  .peek-ask.quiet .k { color: var(--muted); }
  .peek-ask .pending { color: var(--muted); font-weight: 400; }
  .peek-ask .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .peek-ask .opt { border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; font-size: 13px; font-weight: 500; }
  .peek-ask .k { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--waiting); margin-bottom: 3px; }
  .peek-msg { overflow-y: auto; max-height: 58vh; padding-right: 8px; font-size: 14px; line-height: 1.6; }
  .md > * { margin: 0 0 12px; }
  .md > :last-child { margin-bottom: 0; }
  .md h4 { font-size: 14px; margin-top: 18px; }
  .md ul, .md ol { padding-left: 20px; }
  .md li { margin: 4px 0; }
  .md li.sub { margin-left: 18px; list-style-type: circle; }
  .md strong { color: var(--text); font-weight: 650; }
  .md code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font: 12px ui-monospace, Menlo, monospace; }
  .md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font: 12px/1.5 ui-monospace, Menlo, monospace; }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); }
  .md a { color: var(--working); }
  .md .tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
  .md table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  .md th { background: var(--bg); text-align: left; font-weight: 600; white-space: nowrap; }
  .md th, .md td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .md tr:last-child td { border-bottom: 0; }
  .peek-panel textarea { width: 100%; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
                         padding: 6px 8px; font: inherit; }
  .peek-panel textarea:focus { outline: none; border-color: var(--working); }
  .peek-panel .hint.fail, .broadcast .hint.fail { color: var(--danger); }
  /* Keyboard: highlighted card, ticked cards, and the bottom bar that messages every ticked session */
  .session.sel { outline: 1px solid var(--text); outline-offset: -1px; }
  .session.ticked .title::before { content: "✓ "; color: var(--done); }
  .broadcast { position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 6; background: var(--panel); border: 1px solid var(--working);
               border-radius: 10px; padding: 10px 12px; }
  .broadcast textarea { width: 100%; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px;
                        padding: 5px 7px; font: inherit; }
  .broadcast textarea:focus { outline: none; border-color: var(--working); }
  .broadcast .hint { margin-top: 4px; }
  .shell .title { color: var(--muted); font-weight: 400; }
  /* Work view: work items are the unit; their tabs hang under them */
  .work { padding: 10px 16px 40px; }
  .work h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; display: flex; gap: 8px; align-items: center; }
  .work h4 .count { font-weight: 400; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; align-items: start; }
  .item { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 10px; overflow: hidden; }
  .item.drop { border-color: var(--working); box-shadow: 0 0 0 1px var(--working); }
  .item.dragging { opacity: .4; }
  .item .ihead { display: flex; gap: 8px; align-items: baseline; padding: 9px 12px 2px; cursor: grab; }
  .item .ihead .name { font-weight: 650; font-size: 14px; flex: 1; min-width: 0; }
  .item .ihead:hover .pen { visibility: visible; }
  .item .badge { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--working); border: 1px solid var(--working); border-radius: 4px; padding: 0 4px; }

<body>
<header>
  <h1>Overworld</h1>
  <div class="tally" id="tally"></div>
  <div class="usage" id="usage" title="Weekly usage limit, same as the Claude desktop app"></div>
  <button class="add" id="autoAll" title="Name every workspace and session from its conversation (key: a)">✨ Auto-name all</button>
  <button class="add" id="newGroup" title="New empty group">+ New group</button>
  <button class="add" id="inboxBtn" title="Every session and background agent in one list (key: i)">Inbox</button>
  <button class="add" id="galaxyBtn" title="Goals as star systems, work items as planets, links between them (key: g)">Galaxy</button>
  <button class="add" id="viewBtn" title="Switch between work items and tabs (key: w)">Tabs view</button>
  <span class="hint">drag a session onto another region to move it, or onto blank group space for its own workspace · keys: arrows move · r reply (to all ticked, if any) · Space tick · Enter open · Esc clear · a auto-name · i inbox · w work/tabs · g galaxy · ⌘⇧1 back</span>
  <label><input type="checkbox" id="showShells"> show plain shells</label>
</header>
<main id="map"></main>
<aside id="tl" hidden></aside>
<div id="inbox" hidden></div>
<script>
const ORDER = { waiting: 0, done: 1, working: 2, idle: 3, shell: 4 };
const LABEL = { waiting: "your turn", done: "finished", working: "working", idle: "idle", shell: "shell" };

// ---------- Galaxy view: goals are star systems, work items are planets, links are what items share. Flat; pan and zoom, no globe. ----------
// Galaxy (all goals) -> system (one goal, click its sun) -> planet (one item: its sessions as a family tree over time, in the side panel).
const GKINDS = { spinoff: "spinoff", thread: "same Slack thread", file: "same files", project: "same project", person: "same person" };
const GLINES = ["spinoff", "thread", "file", "person"];  // drawn as lines; projects are drawn as hubs with roads instead
const GDEFAULT = { spinoff: true, thread: true, file: true, project: true, person: false };  // person links show on hover only, or they'd be a tangle
const HUB_MAX = 12;  // a project folder used by more items than this is too generic to be a hub
const SLACK_DOMAIN = "piiqdev";
const G = { data: null, sig: "", fetching: false, fetchedAt: 0, cam: null, sys: null, planet: null, pinned: null,
  kinds: { ...GDEFAULT }, showDormant: true, pos: {}, suns: {}, wrap: null, svg: null, world: null, tip: null, panel: null, detail: null };
try { Object.assign(G.kinds, JSON.parse(localStorage.getItem("ow.gkinds2") || "{}")); G.showDormant = localStorage.getItem("ow.gdormant") !== "0"; } catch (e) {}

async function galaxyFetch(force) {
  if (G.fetching || (!force && Date.now() - G.fetchedAt < 30000)) return;
  G.fetching = true;
  try {
    const d = await (await fetch("/api/galaxy")).json();
    G.fetchedAt = Date.now();
    const sig = JSON.stringify([d.systems, d.planets.map(p => [p.id, p.group, p.dormant, p.sessions, p.title]), d.links]);
    G.data = d;
    if (sig !== G.sig) { G.sig = sig; G.wrap = null; }  // structure changed: rebuild; status-only changes are patched in place
    if (view === "galaxy") render(last);
  } catch (e) { console.log("[overworld] galaxy fetch failed", e.message); }
  G.fetching = false;
}

function gSystems() {
  const d = G.data, ids = new Set(d.systems.map(s => s.id));
  const systems = d.systems.map(s => ({ ...s }));
  if (d.planets.some(p => !ids.has(p.group))) systems.push({ id: "", title: "No goal yet" });
  return systems;
}
function gVisible() { return G.data.planets.filter(p => G.showDormant || !p.dormant || p.needs); }

// Planets sit on rings around their goal's sun: needs-you first, then working, then most recently active; dormant on the outer rings.
function gLayout() {
  const rank = p => (p.needs ? 0 : p.status === "working" ? 1 : p.dormant ? 3 : 2);
  const systems = gSystems(), planets = gVisible(), pos = {}, suns = {};
  const bySys = Object.fromEntries(systems.map(s => [s.id, []]));
  planets.forEach(p => (bySys[p.group] || bySys[""]).push(p));
  let maxR = 260;
  const rings = {};
  systems.forEach(s => {
    const list = bySys[s.id].sort((a, b) => rank(a) - rank(b) || b.last_active - a.last_active);
    const placed = [];
    let ring = 0, i = 0;
    while (i < list.length) {
      const r = 175 + ring * 118, cap = Math.max(6, Math.floor((2 * Math.PI * r) / 118));
      const take = list.slice(i, i + cap);
      take.forEach((p, k) => placed.push({ p, r, a: (k / take.length) * 2 * Math.PI - Math.PI / 2 + ring * 0.35 }));
      i += take.length; ring++;
    }
    rings[s.id] = placed;
    maxR = Math.max(maxR, 175 + Math.max(0, ring - 1) * 118 + 70);
  });
  // Pack systems by their own size in rows aimed at a screen-shaped (16:10) block, so a big goal doesn't make every cell big.
  const GAP = 150, reachOf = id => rings[id].reduce((m, q) => Math.max(m, q.r), 120) + 60;
  const area = systems.reduce((a, s) => a + (2 * reachOf(s.id) + GAP) ** 2, 0), rowW = Math.sqrt(area * 1.6);
  const rows = [[]];
  let wNow = 0;
  systems.forEach(s => { const d = 2 * reachOf(s.id) + GAP; if (wNow + d > rowW * 1.15 && rows[rows.length - 1].length) { rows.push([]); wNow = 0; } rows[rows.length - 1].push(s); wNow += d; });
  const widths = rows.map(r => r.reduce((a, s) => a + 2 * reachOf(s.id) + GAP, 0)), W = Math.max(...widths);
  let y = 60;
  rows.forEach((row, ri) => {
    const h = Math.max(...row.map(s => 2 * reachOf(s.id))) + GAP;
    let x = (W - widths[ri]) / 2;
    row.forEach(s => {
      const reach = reachOf(s.id), cx = x + GAP / 2 + reach, cy = y + h / 2;
      suns[s.id] = { x: cx, y: cy, r: 74, title: s.title, planets: bySys[s.id], reach };
      rings[s.id].forEach(({ p, r, a }) => { pos[p.id] = { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a), sys: s.id }; });
      x += 2 * reach + GAP;
    });
    y += h;
  });
  return { pos, suns, w: W, h: y + 20 };
}

function gRadius(p) { return Math.min(40, 17 + 6 * Math.sqrt(p.sessions)); }
function gApply() {
  G.world.setAttribute("transform", `translate(${G.cam.x},${G.cam.y}) scale(${G.cam.k})`); G.svg.style.setProperty("--k", G.cam.k);
  G.svg.classList.toggle("far", G.cam.k < 0.62);
  if (G.lastK === G.cam.k) return;
  G.lastK = G.cam.k;
  G.world.querySelectorAll(".gplanet .orb").forEach(o => { const s = Math.max(1, 10 / (+o.dataset.r * G.cam.k)); o.setAttribute("transform", s > 1 ? `scale(${s})` : ""); });
}
function gFit(box, pad = 40, animate = true, rightInset = 0) {
  const W = G.wrap.clientWidth - rightInset, H = G.wrap.clientHeight;
  if (W < 200 || H < 200) { G.pendingFit = [box, pad, rightInset]; G.cam = G.cam || { k: 0.3, x: 0, y: 0 }; return; }  // tab hidden (cmux workspace not shown): fit once it has a size
  G.pendingFit = null;
  const k = Math.min((W - pad * 2) / box.w, (H - pad * 2) / box.h, box.maxK || 2.2);
  const to = { k, x: (W - box.w * k) / 2 - box.x * k, y: (H - box.h * k) / 2 - box.y * k };
  if (!animate || !G.cam) { G.cam = to; return gApply(); }
  const from = { ...G.cam }, t0 = performance.now();
  (function step(t) {
    const u = Math.min(1, (t - t0) / 380), e = 1 - Math.pow(1 - u, 3);
    G.cam = { k: from.k + (to.k - from.k) * e, x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e };
    gApply();
    if (u < 1) requestAnimationFrame(step);
  })(t0);
}
function gFitAll(animate) { const L = G.layout; gFit({ x: 0, y: 0, w: L.w, h: L.h }, 30, animate); }
function gFitSystem(id, animate = true) { const s = G.suns[id]; if (!s) return; gFit({ x: s.x - s.reach, y: s.y - s.reach, w: s.reach * 2, h: s.reach * 2 }, 30, animate, G.planet ? G.panel.offsetWidth : 0); }

function gPlanetEl(p) {
  const at = G.pos[p.id], r = gRadius(p);
  const g = svgEl("g", { class: "gplanet", "data-id": p.id, transform: `translate(${at.x},${at.y})` });
  const orb = svgEl("g", { class: "orb", "data-r": r });  // scaled up when zoomed far out so it never shrinks below ~10px
  orb.append(svgEl("circle", { class: "halo", r: r + 9 }), svgEl("circle", { class: "body", r }));
  g.append(orb);
  const label = svgEl("text", { class: "plabel", y: r + 16, "text-anchor": "middle" });
  label.textContent = p.title.length > 30 ? p.title.slice(0, 29) + "…" : p.title;
  g.append(label);
  if (p.sessions > 1) { const n = svgEl("text", { class: "pcount", "text-anchor": "middle", dy: "0.35em" }); n.textContent = p.sessions; orb.append(n); }
  g.onmouseenter = e => gHover(p.id, e);
  g.onmousemove = e => gTipMove(e);
  g.onmouseleave = () => gHover(null);
  g.onclick = e => { e.stopPropagation(); if (!G.moved) gOpenPlanet(p.id); };
  return g;
}
function gStatusPatch(p) {
  const n = G.world && G.world.querySelector(`.gplanet[data-id="${p.id}"]`);
  if (!n) return;
  n.setAttribute("class", `gplanet st-${p.status}${p.needs ? " needs" : ""}${p.dormant ? " dormant" : ""}${p.tabs.length ? " live" : ""}`);
}

function gLinkPath(a, b) {
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
  const bend = Math.min(80, len * 0.15);
  return `M${a.x},${a.y} Q${mx - (dy / len) * bend},${my + (dx / len) * bend} ${b.x},${b.y}`;
}

function gBuild() {
  const L = G.layout = gLayout();
  G.pos = L.pos; G.suns = L.suns;
  const wrap = el("div", "galaxy"), svg = svgEl("svg", { class: "gsvg" }), world = svgEl("g", {});
  const defs = svgEl("defs", {});
  const marker = svgEl("marker", { id: "garrow", viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" });
  marker.append(svgEl("path", { d: "M0,0 L10,5 L0,10 z", class: "garrowhead" }));
  defs.append(marker); svg.append(defs, world);
  // Suns and orbit rings
  Object.entries(L.suns).forEach(([id, s]) => {
    const g = svgEl("g", { class: "gsys", "data-sys": id });
    const radii = [...new Set(s.planets.map(p => Math.round(Math.hypot(G.pos[p.id].x - s.x, G.pos[p.id].y - s.y))))];
    radii.forEach(r => g.append(svgEl("circle", { class: "orbit", cx: s.x, cy: s.y, r })));
    const sun = svgEl("circle", { class: "sun" + (id ? "" : " nogoal"), cx: s.x, cy: s.y, r: s.r });
    const flare = svgEl("circle", { class: "flare", cx: s.x, cy: s.y, r: s.r + 14 });  // pulses while anything in this goal needs you
    g.append(flare);
    const t = svgEl("text", { class: "slabel", x: s.x, y: s.y - s.reach, dy: "-0.9em", "text-anchor": "middle" }); t.textContent = s.title;
    const tt = svgEl("title", {}); tt.textContent = id ? "Click to zoom into this goal" : "Items the goal sorter hasn't placed yet. Use \"Sort into goals\" at the top left."; g.append(tt);
    const c = svgEl("text", { class: "scount", x: s.x, y: s.y - s.reach, dy: "0.4em", "text-anchor": "middle" });
    g.append(sun, t, c);
    g.onclick = e => { e.stopPropagation(); if (!G.moved) gGoSystem(id); };
    world.append(g);
  });
  // Links under planets
  const lg = svgEl("g", { class: "glinks" });
  const pairs = {};
  G.data.links.forEach(l => {
    if (!G.pos[l.a] || !G.pos[l.b] || !GLINES.includes(l.kind)) return;
    const key = l.a + "|" + l.b;
    (pairs[key] = pairs[key] || []).push(l);
  });
  Object.values(pairs).forEach(ls => {
    ls.forEach((l, n) => {
      const a = G.pos[l.a], b = G.pos[l.b];
      const path = svgEl("path", { class: `glink k-${l.kind}${a.sys !== b.sys ? " cross" : ""}`, d: gLinkPath(a, b), "data-a": l.a, "data-b": l.b, "data-kind": l.kind });
      if (l.kind === "spinoff") path.setAttribute("marker-end", "url(#garrow)");
      if (n) path.setAttribute("transform", `translate(${n * 4},${n * 4})`);
      lg.append(path);
    });
  });
  world.append(lg, gHubs());
  const pg = svgEl("g", {});
  gVisible().forEach(p => pg.append(gPlanetEl(p)));
  G.cityLayer = svgEl("g", { class: "gcities" });
  world.append(pg, G.cityLayer);
  // Pan (drag empty space), zoom (pinch / ctrl+wheel), two-finger scroll pans
  svg.onmousedown = e => { G.drag = { x: e.clientX, y: e.clientY, cx: G.cam.x, cy: G.cam.y }; G.moved = false; };
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      const k = Math.max(0.12, Math.min(7, G.cam.k * Math.exp(-e.deltaY * 0.01)));
      G.cam.x = mx - ((mx - G.cam.x) * k) / G.cam.k; G.cam.y = my - ((my - G.cam.y) * k) / G.cam.k; G.cam.k = k;
    } else { G.cam.x -= e.deltaX; G.cam.y -= e.deltaY; }
    gApply();
  }, { passive: false });
  let g0 = null;  // WebKit (cmux's browser) reports pinch as gesture events, not ctrl+wheel
  svg.addEventListener("gesturestart", e => { e.preventDefault(); g0 = { k: G.cam.k, x: G.cam.x, y: G.cam.y, cx: e.clientX, cy: e.clientY }; });
  svg.addEventListener("gesturechange", e => {
    e.preventDefault(); if (!g0) return;
    const r = svg.getBoundingClientRect(), mx = g0.cx - r.left, my = g0.cy - r.top, k = Math.max(0.12, Math.min(7, g0.k * e.scale));
    G.cam = { k, x: mx - ((mx - g0.x) * k) / g0.k, y: my - ((my - g0.y) * k) / g0.k }; gApply();
  });
  svg.addEventListener("gestureend", e => { e.preventDefault(); g0 = null; });
  svg.onclick = () => { if (G.moved) return; if (G.pinned) { G.pinned = null; gFocus(null); } };
  G.tip = el("div", "gtip"); G.tip.hidden = true;
  wrap.append(svg, gCrumbs(), gLegend(), G.tip);
  G.wrap = wrap; G.svg = svg; G.world = world;
}

function gCrumbs() {
  const c = el("div", "gcrumbs");
  const add = (text, fn, cur) => { const b = el(cur ? "span" : "button", cur ? "cur" : "", text); if (fn) b.onclick = fn; if (c.childNodes.length) c.append(el("span", "sep", "›")); c.append(b); };
  add("Galaxy", G.sys == null && !G.planet ? null : gGoGalaxy, G.sys == null && !G.planet);
  if (G.sys != null) add(G.suns[G.sys] ? G.suns[G.sys].title : "", G.planet ? () => gGoSystem(G.sys) : null, !G.planet);
  if (G.planet) { const p = G.data.planets.find(x => x.id === G.planet); add(p ? p.title : "", null, true); }
  const loose = G.data.planets.filter(p => !G.suns[p.group] || p.group === "").length;
  if (loose && G.suns[""]) {
    const b = el("button", "gsort", G.sorting ? "Sorting…" : `Sort into goals (${loose} have none)`);
    b.title = "One Sonnet call (about 2 cents) groups every open item by the goal it serves. It replaces the current goals, including ones you moved by hand.";
    b.onclick = async () => { if (G.sorting) return; G.sorting = true; gRefreshCrumbs();
      try { await workPost("groups"); } catch (e) { b.textContent = "Failed: " + e.message; }
      G.sorting = false; G.sys = null; await galaxyFetch(true); G.cam = null; G.wrap = null; render(last); };
    c.append(b);
  }
  const needs = gNeedsOrder();
  if (needs.length) {
    const b = el("button", "gnext", `Next that needs you (${needs.length})`);
    b.title = "Fly to the next item waiting on you (key n)"; b.onclick = gNextNeeds;
    c.append(b);
  }
  const fit = el("button", "gfit", "Fit"); fit.title = "Show the whole galaxy (key 0)"; fit.onclick = gGoGalaxy;
  c.append(fit);
  return c;
}
function gRefreshCrumbs() { const old = G.wrap.querySelector(".gcrumbs"); if (old) old.replaceWith(gCrumbs()); }

function gLegend() {
  const box = el("div", "glegend");
  const counts = {};
  G.data.links.forEach(l => (counts[l.kind] = (counts[l.kind] || 0) + 1));
  const shapes = el("div", "gshapes");
  shapes.innerHTML = `<svg width="300" height="22" viewBox="0 0 300 22"><circle cx="9" cy="11" r="8" class="sun"/><text x="22" y="15">goal</text>
    <circle cx="66" cy="11" r="6" class="lg-planet"/><text x="77" y="15">work item</text><rect x="146" y="5" width="11" height="11" rx="2.5" class="lg-city"/><text x="162" y="15">session</text>
    <polygon points="${gHex(225, 11, 7)}" class="lg-hub"/><text x="237" y="15">project</text></svg>`;
  box.append(shapes, el("hr"));
  [...GLINES, "project"].forEach(k => {
    const lab = el("label", "k-" + k), cb = el("input");
    cb.type = "checkbox"; cb.checked = G.kinds[k];
    cb.onchange = () => { G.kinds[k] = cb.checked; remember("ow.gkinds2", JSON.stringify(G.kinds)); gFocus(G.pinned || G.planet); };
    const text = k === "project" ? ` project roads (${G.hubCount} shared projects)` : ` ${GKINDS[k]} (${counts[k] || 0})`;
    lab.append(cb, el("i", "swatch"), document.createTextNode(text));
    box.append(lab);
  });
  const dorm = G.data.planets.filter(p => p.dormant).length;
  const lab = el("label", ""), cb = el("input");
  cb.type = "checkbox"; cb.checked = G.showDormant;
  cb.onchange = () => { G.showDormant = cb.checked; remember("ow.gdormant", cb.checked ? "1" : "0"); G.wrap = null; render(last); };
  lab.append(cb, document.createTextNode(` dormant items (${dorm}, no activity in ${G.data.dormant_days}+ days)`));
  box.append(el("hr"), lab, el("div", "ghint", "pinch or ⌘-scroll to zoom · drag or scroll to pan · click a goal or item to zoom in · n next that needs you · Esc goes up · 0 fit · g leaves"));
  return box;
}

// Hover or pin a planet: light it, its links (every kind, including hover-only ones) and its neighbours; dim the rest.
function gFocus(id) {
  const svg = G.svg;
  svg.classList.toggle("focusing", !!id);
  const near = new Set(id ? [id] : []);
  svg.querySelectorAll(".glink").forEach(l => {
    const touches = id && (l.dataset.a === id || l.dataset.b === id);
    const shown = G.kinds[l.dataset.kind] || touches;
    l.classList.toggle("hidden", !shown);
    l.classList.toggle("on", !!touches);
    if (touches) { near.add(l.dataset.a); near.add(l.dataset.b); }
  });
  const hubsOn = new Set();
  svg.querySelectorAll(".groad").forEach(r => {
    const touches = id && r.dataset.p === id;
    r.classList.toggle("hidden", !(G.kinds.project || touches));
    r.classList.toggle("on", !!touches);
    if (touches) hubsOn.add(r.dataset.hub);
  });
  svg.querySelectorAll(".ghub").forEach(h => { h.classList.toggle("near", hubsOn.has(h.dataset.hub)); h.classList.toggle("hidden", !(G.kinds.project || hubsOn.has(h.dataset.hub))); });
  svg.querySelectorAll(".gplanet").forEach(n => { n.classList.toggle("near", near.has(n.dataset.id)); n.classList.toggle("pin", n.dataset.id === id); });
  svg.classList.toggle("incity", !!G.planet && !!G.detail);
}
function gHover(id, e) {
  if (!id) { G.tip.hidden = true; return gFocus(G.pinned || G.planet); }
  gFocus(id);
  const p = G.data.planets.find(x => x.id === id), L = G.data.links.filter(l => l.a === id || l.b === id);
  const kinds = {};
  L.forEach(l => (kinds[l.kind] = (kinds[l.kind] || 0) + 1));
  G.tip.replaceChildren(
    el("b", "", p.title),
    el("div", "muted", [p.needs ? "needs you" : LABEL[p.status] || (p.dormant ? "dormant" : "no live tab"), `active ${gAgo(p.last_active)}`,
      `${p.sessions} session${p.sessions === 1 ? "" : "s"}`].join(" · ")),
    ...(p.next ? [el("div", "", "Next: " + p.next)] : []),
    ...(p.waits_on ? [el("div", "", "Waits on: " + p.waits_on)] : []),
    ...(L.length ? [el("div", "muted", "Linked: " + Object.entries(kinds).map(([k, n]) => `${n} ${GKINDS[k]}`).join(", "))] : []));
  G.tip.hidden = false; gTipMove(e);
}
function gTipMove(e) {
  if (!e || G.tip.hidden) return;
  const r = G.wrap.getBoundingClientRect();
  G.tip.style.left = Math.min(e.clientX - r.left + 16, r.width - 340) + "px"; G.tip.style.top = (e.clientY - r.top + 16) + "px";
}
function gAgo(t) { return t ? ago(new Date(t * 1000).toISOString()) + (Date.now() / 1000 - t < 90 ? "" : " ago") : "never"; }

function gGoGalaxy() { G.sys = null; gClosePlanet(true); gRefreshCrumbs(); gFitAll(true); }

// Zoomed into an item: its sessions are cities around it. Spokes tie each city to the item; purple roads join a session to the one spun off from it.

function gHex(x, y, r) { return [0, 1, 2, 3, 4, 5].map(i => { const a = Math.PI / 6 + (i * Math.PI) / 3; return `${(x + r * Math.cos(a)).toFixed(1)},${(y + r * Math.sin(a)).toFixed(1)}`; }).join(" "); }

// Shared project folders as hubs: placed among the items that use them, with a road to each. Replaces a tangle of item-to-item lines.
function gHubs() {
  const layer = svgEl("g", { class: "ghubs" }), users = {};
  gVisible().forEach(p => (p.repos || []).forEach(r => (users[r] = users[r] || []).push(p.id)));
  const hubs = Object.entries(users).filter(([, ids]) => ids.length >= 2 && ids.length <= HUB_MAX).map(([path, ids]) => {
    const xs = ids.map(i => G.pos[i]);
    return { path, ids, x: xs.reduce((a, b) => a + b.x, 0) / xs.length, y: xs.reduce((a, b) => a + b.y, 0) / xs.length };
  });
  const blockers = [...Object.values(G.pos).map(q => ({ x: q.x, y: q.y, r: 62 })), ...Object.values(G.suns).map(s => ({ x: s.x, y: s.y, r: s.r + 50 }))];
  for (let pass = 0; pass < 40; pass++) {  // nudge hubs off planets, suns and each other
    hubs.forEach(h => {
      [...blockers, ...hubs.filter(o => o !== h).map(o => ({ x: o.x, y: o.y, r: 46 }))].forEach(b => {
        const dx = h.x - b.x, dy = h.y - b.y, dist = Math.hypot(dx, dy) || 0.01;

  hubs.forEach((h, n) => {
    const key = "h" + n;
    h.ids.forEach(i => roads.append(svgEl("path", { class: "groad", "data-p": i, "data-hub": key, d: gLinkPath(h, G.pos[i]) })));
    const g = svgEl("g", { class: "ghub", "data-hub": key, transform: `translate(${h.x},${h.y})` });
    g.append(svgEl("polygon", { points: gHex(0, 0, 13) }));
    const t = svgEl("text", { class: "hlabel", "text-anchor": "middle", y: 28 }); t.textContent = h.path.split("/").pop(); g.append(t);
    const tt = svgEl("title", {}); tt.textContent = `${h.path.replace(/^\/Users\/[^/]+/, "~")}\nused by ${h.ids.length} items`; g.append(tt);
    g.onmouseenter = () => { G.svg.querySelectorAll(`.groad[data-hub="${key}"]`).forEach(r => r.classList.add("on")); G.svg.classList.add("hubfocus"); h.ids.forEach(i => { const n2 = G.svg.querySelector(`.gplanet[data-id="${i}"]`); if (n2) n2.classList.add("near"); }); g.classList.add("near"); };
    g.onmouseleave = () => { G.svg.classList.remove("hubfocus"); gFocus(G.pinned || G.planet); };

// Needs-you items in reading order: goal by goal, then around each goal's rings.
function gNeedsOrder() {
  if (!G.data || !G.suns) return [];
  const order = Object.keys(G.suns);
  return G.data.planets.filter(p => p.needs && G.pos[p.id])
    .sort((a, b) => order.indexOf(G.pos[a.id].sys) - order.indexOf(G.pos[b.id].sys) || G.pos[a.id].y - G.pos[b.id].y || G.pos[a.id].x - G.pos[b.id].x);
}
function gNextNeeds() {
  const list = gNeedsOrder();
  if (!list.length) return;
  const at = list.findIndex(p => p.id === G.planet);
  gOpenPlanet(list[(at + 1) % list.length].id);
}

// Goals pulse while anything inside needs you; the count under the sun stays current.
function gSunPatch() {
  if (!G.wrap) return;
  Object.entries(G.suns).forEach(([id, s]) => {
    const ps = G.data.planets.filter(p => G.pos[p.id] && G.pos[p.id].sys === id);
    const need = ps.filter(p => p.needs).length, dorm = ps.filter(p => p.dormant).length;
    const g = G.world.querySelector(`.gsys[data-sys="${CSS.escape(id)}"]`);
    if (!g) return;
    g.classList.toggle("alert", need > 0);
    g.querySelector(".scount").textContent = `${ps.length - dorm} active${need ? ` · ${need} need${need === 1 ? "s" : ""} you` : ""}`;
  });

function gStrength(ls) { const w = { spinoff: 5, thread: 4, file: 3, project: 1, person: 1 }; return ls.reduce((s, l) => s + w[l.kind] * l.via.length, 0); }
function gVia(v) { return v.startsWith("slack:") ? "#" + v.split(":")[1] : v.includes("/") ? v.split("/").pop() : v; }

// One row per session on a shared time axis: bar = first to last turn, ticks = your prompts, curve = spun off from (via a /spinoff brief).
function gHistory(d) {
  const S = d.sessions.filter(s => s.first && s.last);  // a transcript with no turns yet has no span
  if (!S.length) return el("div", "muted", "No transcripts on disk for this item.");
  const now = Date.now() / 1000, t0 = Math.min(...S.map(s => s.first)), t1 = Math.max(...S.map(s => (s.live ? now : s.last)));
  const W = Math.max(420, G.panel.clientWidth - 40), LBL = 170, PAD = 14, ROW = 30, H = S.length * ROW + 30;
  const x = t => LBL + PAD + ((t - t0) / Math.max(1, t1 - t0)) * (W - LBL - PAD * 2);
  const svg = svgEl("svg", { class: "ghist", width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  // Day ticks
  const days = (t1 - t0) / 86400, step = days > 40 ? 7 : days > 10 ? 2 : 1;
  const d0 = new Date(t0 * 1000); d0.setHours(0, 0, 0, 0);
  for (let t = d0.getTime() / 1000 + 86400; t < t1; t += 86400 * step) {
    svg.append(svgEl("line", { class: "gday", x1: x(t), x2: x(t), y1: 0, y2: H - 18 }));
    const tx = svgEl("text", { class: "gdaylabel", x: x(t), y: H - 4, "text-anchor": "middle" });
    tx.textContent = new Date(t * 1000).toLocaleDateString([], { month: "short", day: "numeric" }); svg.append(tx);
  }
  const rowOf = Object.fromEntries(S.map((s, i) => [s.transcript, i]));
  S.forEach((s, i) => {
    const y = i * ROW + 14, g = svgEl("g", { class: "grow" + (s.live ? " live st-" + s.status : "") });
    const label = svgEl("text", { class: "grlabel", x: 4, y: y + 4 });
    label.textContent = (s.title.length > 22 ? s.title.slice(0, 21) + "…" : s.title);
    const tt = svgEl("title", {}); tt.textContent = `${s.title}\n${s.where || ""} · ${s.live ? LABEL[s.status] || s.status : "closed"}\n${new Date(s.first * 1000).toLocaleString()} → ${new Date(s.last * 1000).toLocaleString()}${s.subagents ? `\n${s.subagents} sub-agents` : ""}${s.brief ? `\nstarted from brief ${s.brief}` : ""}${s.live ? "\nclick to open its tab" : ""}`;
    g.append(tt, label);
    const xa = x(s.first), xb = Math.max(xa + 3, x(s.live ? now : s.last));
    g.append(svgEl("rect", { class: "grbar", x: xa, y: y - 5, width: xb - xa, height: 10, rx: 5 }));
    s.prompts.forEach(t => g.append(svgEl("line", { class: "grtick", x1: x(t), x2: x(t), y1: y - 7, y2: y + 7 })));
    if (s.subagents) { const a = svgEl("text", { class: "grsub", x: xb + 6, y: y + 4 }); a.textContent = `+${s.subagents} agents`; g.append(a); }
    if (s.live) g.onclick = () => gFocusTab(s);
    svg.append(g);
    if (s.parent && s.parent in rowOf) {
      const py = rowOf[s.parent] * ROW + 14, px = xa;
      svg.append(svgEl("path", { class: "grspin", d: `M${px},${py + 6} C${px},${(py + y) / 2} ${px},${(py + y) / 2} ${px + 2},${y - 6}`, "marker-end": "url(#garrow)" }));
    }
  });

  wrap.append(svg, el("div", "ghint", "bar = first to last turn · ticks = your prompts · purple curve = spun off with a brief · click a live row to open it"));
  return wrap;
}

    if (!G.cam) { if (G.sys != null && G.suns[G.sys]) gFitSystem(G.sys, false); else gFitAll(false); }
    gApply();
  }
  if (G.pendingFit && G.wrap.clientWidth >= 200) document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px");

function seedPanel(w) {
  const panel = el("div", "wpanel");
  if (!w.proposal) {
    panel.append(el("b", null, "Group your tabs into work items"),
      el("p", null, "One model call reads every agent tab and proposes the pieces of work they belong to. You review and edit before anything is saved. Takes about 20 seconds."));
    const go = el("button", "wbtn", seeding ? "Reading your tabs…" : "Propose work items");
    go.disabled = seeding;

    panel.append(go);
    if (workMsg.seed) panel.append(el("p", "fail", workMsg.seed));
    return panel;
  }
  // Review as a diff: today's workspaces and tabs on the left, proposed work items on the right, one colored line per tab.
  if (!propEdit) propEdit = JSON.parse(JSON.stringify(w.proposal.items));
  const known = [...w.proposal.items.flatMap(p => p.tabs), ...w.proposal.unsorted];
  const itemOf = new Map();
  propEdit.forEach((p, i) => p.tabs.forEach(t => itemOf.set(t.id, i)));
  const leftRegions = last.regions.map(r => ({ r, tabs: r.sessions.filter(t => known.some(k => k.id === t.id)) })).filter(x => x.tabs.length);
  const regionOf = new Map();
  leftRegions.forEach(({ r, tabs }) => tabs.forEach(t => regionOf.set(t.id, r.title)));
  const live = propEdit.map((p, i) => ({ p, i })).filter(x => x.p.tabs.length);
  const joins = live.filter(x => new Set(x.p.tabs.map(t => regionOf.get(t.id))).size > 1);
  const splits = leftRegions.filter(x => new Set(x.tabs.map(t => itemOf.get(t.id)).filter(i => i != null)).size > 1);
  const out = known.filter(k => !itemOf.has(k.id));

  const ask = el("div", "seedbar");
  ask.append(el("b", null, `${known.length} tabs in ${leftRegions.length} workspaces → ${live.length} work items. Accept to save.`));
  const facts = el("div", "facts");
  const fact = (n, text, cls) => { const f = el("span", "fact " + cls); f.append(el("b", null, String(n)), " " + text); facts.append(f); };
  fact(joins.length, joins.length === 1 ? "item joins tabs from different workspaces" : "items join tabs from different workspaces", "join");
  fact(splits.length, splits.length === 1 ? "workspace splits into several items" : "workspaces split into several items", "split");
  fact(live.length - joins.length, "items map to tabs in one workspace", "same");
  if (out.length) fact(out.length, "tabs left out", "out");
  ask.append(facts, el("span", "hint", "Hover anything to trace its lines. Drag a tab (left) onto an item (right) to move it. Click an item title to rename."));
  const acts = el("div", "iacts");

  ok.onclick = async () => {
    const items = propEdit.map(p => ({ title: p.title, goal: p.goal, people: p.people, tabs: p.tabs.map(x => x.transcript) }));
    try { await workPost("accept", { items }); propEdit = null; } catch (e) { workMsg.seed = e.message; }
    tick();
  };
  again.onclick = async () => { seeding = true; propEdit = null; render(last); try { await workPost("seed"); } catch (e) { workMsg.seed = e.message; } seeding = false; tick(); };
  cancel.onclick = () => { propEdit = null; edit({ op: "drop-proposal" }); };
  acts.append(ok, again, cancel);
  if (w.proposal.cost != null) acts.append(el("span", "hint", `proposal cost $${w.proposal.cost.toFixed(3)}`));
  ask.append(acts);
  if (workMsg.seed) ask.append(el("p", "fail", workMsg.seed));

  const hue = i => `hsl(${(i * 137.5) % 360} 65% 62%)`;
  const diff = el("div", "diff"), L = el("div", "dcol"), R = el("div", "dcol right");
  L.append(el("div", "dhead", "Today: workspaces and tabs"));
  R.append(el("div", "dhead", "Proposed: work items (labels only; no tab, workspace or group moves in cmux)"));
  leftRegions.forEach(({ r, tabs }) => {
    const box = el("div", "dbox ws"), h = el("div", "dtitle", r.title);
    const g = r.scratch ? null : (last.groups.find(x => x.id === r.group) || {}).name;
    if (g) h.append(el("span", "cnt", g));
    const n = new Set(tabs.map(t => itemOf.get(t.id)).filter(i => i != null)).size;
    if (n > 1) h.append(el("span", "tag split", `splits into ${n}`));
    box.append(h);
    tabs.forEach(t => {
      const i = itemOf.get(t.id), row = el("div", "dtab" + (i == null ? " gone" : ""));
      row.dataset.tab = t.id; if (i != null) row.dataset.item = i;
      row.style.setProperty("--h", i == null ? "var(--idle)" : hue(i));
      row.append(el("span", "sw"), el("span", null, t.title));
      row.draggable = true;
      row.ondragstart = e => { dragging = { diffTab: t.id }; e.dataTransfer.setData("text/plain", t.id); };
      row.ondragend = () => { dragging = null; document.querySelectorAll(".drop").forEach(x => x.classList.remove("drop")); };
      box.append(row);
    });
    L.append(box);
  });
  // Items ordered by where their first tab sits on the left, so lines cross as little as possible.
  const leftOrder = leftRegions.flatMap(x => x.tabs.map(t => t.id));
  const firstPos = x => Math.min(...x.p.tabs.map(t => leftOrder.indexOf(t.id)).map(v => v < 0 ? 1e9 : v));
  const moveTab = (id, to) => {
    const tab = known.find(k => k.id === id);
    propEdit.forEach(p => { p.tabs = p.tabs.filter(t => t.id !== id); });
    if (to != null) propEdit[to].tabs.push(tab);
    render(last);
  };
  const dropOn = (box, to) => {
    box.ondragover = e => { if (dragging && dragging.diffTab) { e.preventDefault(); box.classList.add("drop"); } };
    box.ondragleave = () => box.classList.remove("drop");
    box.ondrop = e => { e.preventDefault(); box.classList.remove("drop"); if (dragging && dragging.diffTab) { const id = dragging.diffTab; dragging = null; moveTab(id, to); } };
  };
  live.sort((a, b) => firstPos(a) - firstPos(b)).forEach(({ p, i }) => {
    const box = el("div", "dbox item2"); box.dataset.item = i;
    box.style.setProperty("--h", hue(i));
    const h = el("div", "dtitle"), name = el("span", "name", p.title);
    name.title = "Click to rename";
    name.onclick = () => { const pen = pencil(name, p.title, t => { p.title = t; }); pen.click(); };
    h.append(name);
    const ws = new Set(p.tabs.map(t => regionOf.get(t.id)));
    if (ws.size > 1) h.append(el("span", "tag join", `joins ${ws.size} workspaces`));
    h.append(el("span", "cnt", `${p.tabs.length} tab${p.tabs.length === 1 ? "" : "s"}`));
    box.append(h, el("div", "dgoal", p.goal));
    if (p.people.length) { const pp = el("div", "dpeople"); p.people.forEach(x => pp.append(el("span", "chip", x))); box.append(pp); }
    dropOn(box, i);
    R.append(box);
  });
  const outBox = el("div", "dbox outbox", out.length ? `Left out: ${out.map(k => (sessionById(k.id) || {}).title || "closed tab").join(", ")}` : "Drop a tab here to leave it out");
  dropOn(outBox, null);
  R.append(outBox);
  const svg = document.createElementNS(SVGNS, "svg"); svg.classList.add("links");
  diff.append(svg, L, R);
  diff.onmouseover = e => { const n = e.target.closest("[data-item]"); diffFocus = n ? n.dataset.item : null; applyFocus(diff); };
  diff.onmouseleave = () => { diffFocus = null; applyFocus(diff); };

  requestAnimationFrame(() => drawLinks(diff));

}
let diffFocus = null;
function applyFocus(diff) {
  diff.classList.toggle("focused", diffFocus != null);
  diff.querySelectorAll("[data-item]").forEach(n => n.classList.toggle("on", n.dataset.item === diffFocus));
}
function drawLinks(diff) {
  const svg = diff.querySelector("svg.links"); if (!svg) return;
  const base = diff.getBoundingClientRect();
  svg.setAttribute("width", base.width); svg.setAttribute("height", base.height);
  svg.replaceChildren();
  const seen = {};
  diff.querySelectorAll(".dtab[data-item]").forEach(row => {
    const box = diff.querySelector(`.item2[data-item="${row.dataset.item}"]`); if (!box) return;
    const a = row.getBoundingClientRect(), b = box.getBoundingClientRect();
    const k = row.dataset.item, n = seen[k] = (seen[k] || 0) + 1;
    const x1 = a.right - base.left, y1 = a.top + a.height / 2 - base.top;
    const x2 = b.left - base.left, y2 = b.top - base.top + Math.min(14 + n * 6, b.height - 6);
    const mid = (x1 + x2) / 2;
    const path = svgEl("path", { d: `M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`, stroke: getComputedStyle(row).getPropertyValue("--h"), "data-item": k });
    svg.append(path);
  });
  applyFocus(diff);
}

// Recent captures: where each hotkey note went and why, with a picker to send it somewhere else.
let capBusy = {}, capErr = {}, groupBusy = false, groupErr = "";
async function proposeGroups() {
  groupBusy = true; groupErr = ""; render(last);
  try { await workPost("groups"); } catch (e) { groupErr = "Grouping failed: " + e.message; }
  groupBusy = false; tick();
}
function capturesEl(state, items) {
  const caps = state.captures || [];
  if (!caps.length) return null;
  const box = el("div", "caps");
  box.append(section("Recent captures", caps.length, el("span", "hint", "where each hotkey note went, and why")));
  caps.forEach(c => {
    const row = el("div", "cap " + c.routed);
    const note = c.text.replace(/https?:\/\/\S+/g, m => /slack\.com/.test(m) ? "[Slack link]" : "[link]").replace(/Screenshot: \S+/, "[screenshot]").trim();
    const where = c.routed === "new" ? "new tab" : (c.item_title || (sessionById(c.surface) || {}).title || "a tab");
    row.append(el("span", "when", ago(new Date(c.at * 1000).toISOString())), el("span", "note", note || "(empty note)"),
      el("span", "arrow", c.routed === "resumed" ? "→ reopened" : "→"), el("b", null, where), el("span", "why", c.reason || ""));
    const pick = el("select");
    pick.append(el("option", null, capBusy[c.id] ? "moving…" : "Wrong? Move to…"));
    const nw = el("option", null, "New tab"); nw.value = "new"; if (c.routed !== "new") pick.append(nw);
    items.filter(i => i.state !== "done" && i.id !== c.item).sort((a, b) => a.title.localeCompare(b.title))
      .forEach(i => { const o = el("option", null, i.title); o.value = i.id; pick.append(o); });
    pick.disabled = !!capBusy[c.id];
    pick.onfocus = () => { editing = true; };
    pick.onblur = () => { editing = false; };
    pick.onchange = async () => {
      editing = false; capBusy[c.id] = true; delete capErr[c.id]; render(last);
      const res = await fetch("/api/capture/redirect", { method: "POST", body: JSON.stringify({ id: c.id, to: pick.value }) });
      if (!res.ok) capErr[c.id] = (await res.json().catch(() => ({}))).error || `HTTP ${res.status}`;
      delete capBusy[c.id]; tick();
    };
    row.append(pick);
    if (capErr[c.id]) row.append(el("span", "fail", "not moved: " + capErr[c.id]));
    // Hover lights its tab, item and goal in the map below; click opens its session (or pins its item when no tab is open).
    const item = items.find(i => i.id === c.item);
    const tab = sessionById(c.surface) || (item && item.tabs.map(sessionById).find(Boolean));
    const wmap = () => document.querySelector(".wmap");
    const keyOf = () => {  // its tab if the map draws it (exited sessions are hidden), else its item
      const m = wmap(), on = k => m && m.querySelector(`[data-key="${CSS.escape(k)}"]`);
      return tab && on("t:" + tab.id) ? "t:" + tab.id : item && on("i:" + item.id) ? "i:" + item.id : null;
    };
    row.classList.toggle("go", !!(tab || item));
    row.title = tab ? `Click to open ${tab.title}` : item ? `${item.title} has no open tab: click to show it in the map` : "Its tab is closed";
    row.onmouseenter = () => { const m = wmap(), k = keyOf(); if (k && m) { mapFocus = k; mapApply(m, m._chain); } };
    row.onmouseleave = () => { const m = wmap(); if (m) { mapFocus = null; mapApply(m, m._chain); } };
    row.onclick = e => {
      if (e.target.closest("select")) return;
      if (tab) fetch("/api/focus", { method: "POST", body: JSON.stringify({ workspace: tab.workspace, surface: tab.id }) });
      else if (keyOf()) { const m = wmap(), key = keyOf(); mapPin = key; mapApply(m, m._chain); const n = m.querySelector(`[data-key="${CSS.escape(key)}"]`); if (n) n.scrollIntoView({ block: "center", behavior: "smooth" }); }
    };
    box.append(row);
  });
  return box;
}

function renderWork(state) {
  document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");  // header wraps to 2-3 rows on narrow panes
  const w = state.work, y = scrollY;
  const all = state.regions.flatMap(r => r.sessions);
  const root = el("div", "work");
  if (!w.seeded) {
    tally.replaceChildren(el("span", null, `${all.filter(t => t.agent).length} agent tabs, no work items yet`));
    root.append(seedPanel(w));
    map.replaceChildren(root); scrollTo(0, y); return;
  }
  const items = w.items.filter(i => i.state !== "done");
  const goals = w.groups || [];
  const needs = items.filter(i => i.needs);
  tally.replaceChildren(...[["waiting", needs.length, "need you"], ["working", items.filter(i => i.status === "working").length, "working"],
    ["shell", items.filter(i => i.state === "parked" && i.status === "none").length, "parked"]].map(([k, n, label]) => {
    const s = el("span"), d = el("span", "dot"); d.style.background = `var(--${k})`; s.append(d, el("b", null, n), " " + label); return s;
  }));
  const caps = capturesEl(state, w.items);
  if (caps) root.append(caps);
  root.append(workMap(state, w, items, goals));
  if (pendingMerge) root.append(mergeBar());
  map.replaceChildren(root);
  requestAnimationFrame(() => {
    drawMap(root.querySelector(".wmap"));
    const pin = scrollPin && root.querySelector(".wmap .pinned");
    if (pin) { scrollPin = false; pin.scrollIntoView({ block: "center" }); }
  });
  scrollTo(0, y);
}

// The work map: spaces and their tabs (left) -> work items (middle) -> goals (right), one line per link. Hover traces a chain.
let mapFocus = null, mapPin = null;  // hover key; clicked key (stays lit until you click off it)
const GOAL_HUE = n => `hsl(${(n * 67 + 200) % 360} 62% 62%)`;
function workMap(state, w, items, goals) {
  const goalIdx = new Map(goals.map((g, n) => [g.id, n]));
  const hueOf = it => goalIdx.has(it.group) ? GOAL_HUE(goalIdx.get(it.group)) : "var(--idle)";
  const RANK = { waiting: 0, working: 1, done: 2, idle: 3, shell: 4, none: 5 };
  const ordered = items.slice().sort((a, b) => (goalIdx.get(a.group) ?? 99) - (goalIdx.get(b.group) ?? 99)
    || (b.needs - a.needs) || (RANK[a.status] ?? 9) - (RANK[b.status] ?? 9) || a.title.localeCompare(b.title));
  const itemPos = new Map(ordered.map((it, n) => [it.id, n]));
  const itemOfTab = new Map(); items.forEach(it => it.tabs.forEach(t => itemOfTab.set(t, it)));
  // Workspaces and their tabs ordered by where their items sit, so lines cross as little as possible.
  const pos = t => itemOfTab.has(t.id) ? itemPos.get(itemOfTab.get(t.id).id) : 1e3;
  const spaces = state.regions.map(r => ({ r, tabs: r.sessions.filter(t => t.agent || showShells.checked).sort((a, b) => pos(a) - pos(b)) }))
    .filter(x => x.tabs.length)
    .map(x => ({ ...x, at: x.tabs.reduce((s, t) => s + pos(t), 0) / x.tabs.length })).sort((a, b) => a.at - b.at);

  // Relations for hover: every node knows the chain it belongs to.
